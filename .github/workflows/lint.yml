name: lint

# Backstop for the same checks pre-commit runs locally — catches commits
# from contributors who haven't run `pre-commit install`, web-UI edits,
# and bypassed hooks (--no-verify).
#
# Runs the quote-balance lint, the boot-image gate unit test, a bash syntax
# check, and ansible-lint.  Add yamllint / shellcheck steps here as needed.

on:
  # Every branch, not just main.  These checks only ever ran on main and on PRs
  # into it, so a long-lived feature branch accumulated 136 commits without CI
  # seeing any of them — and the one real regression in that batch (a template
  # construct the cloud's own parser rejects) was found by hand, late, on the
  # live cloud.  Linting a branch costs a couple of GitHub-hosted minutes;
  # finding out at merge time costs a lot more.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ansible-shell-quote-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run ansible shell quote-balance lint
        # The script enforces: no ansible.builtin.shell: | block contains
        # an odd number of single quotes.  Catches the class of bug where
        # an English contraction (that's, can't, …) inside a bash heredoc
        # comment unbalances the count, then split_args refuses the whole
        # playbook with "either an unbalanced jinja2 block or quotes".
        # See scripts/lint-ansible-quotes.py for the rationale.
        run: |
          python3 scripts/lint-ansible-quotes.py ansible

      - name: Boot-image gate logic unit test (P3-IMG.1)
        # The offline format gate's pure karg-assertion logic — the cheap check
        # that turns a silently-broken RHCOS re-stamp into a loud CI failure.
        run: |
          cd scripts && python3 verify_kargs_test.py

      - name: Bash syntax check (boot-image scripts)
        run: |
          bash -n scripts/bootimage-gate.sh

      - name: Install PyYAML (for the ROS tag lint)
        run: pip install PyYAML

      - name: Ansible variable-collision gate
        # A registered variable is a HOST FACT: it lives for the rest of the run
        # and outranks a later play's vars.  So `register: x` in one playbook
        # silently replaces `vars: x:` in every playbook that runs after it.
        # Harmless while each phase ran as its own ansible-playbook process;
        # site-apsara.yml puts the whole chain in one, and the first live run
        # hit two of these — a PVC whose storageClassName became a result dict,
        # and `oc delete ns <that same dict>`.  Neither error mentions variables.
        run: |
          python3 scripts/lint-ansible-var-collisions.py

      - name: Boot-image stream detection unit test
        # Upstream split data/data/coreos/rhcos.json into coreos-rhel-{9,10}.json
        # in 4.22.  The detector asked for the old name, got a real 404, read it
        # as "this minor has no branch yet" and stopped — so 4.22 and everything
        # above it went invisible while the job reported "nothing to bake".
        # These pin the selection rule (match the stream to the branch, never
        # fall back to another release's stream).  A future rename is caught at
        # runtime by StreamFileMissing, not here.
        run: |
          python3 scripts/bootimage_detect_test.py

      - name: Red Hat lifecycle unit test
        # bootimage/oldest-supported-minor 现在是机器写的,而它决定了每天烤哪些
        # RHCOS —— 也就决定了用户装机时菜单上有哪些版本。生命周期接口里 EOL 和
        # EUS 在版本序列里交错(4.17 EOL,更老的 4.16/4.14/4.12 却是 Extended
        # Support),所以「最老的非 EOL 版本」会给出 4.12 而不是 4.18:一个看上去
        # 完全合理、而且不会报错的错答案,后果是菜单里塞满没人该装的版本。
        # 退役那半边更要测:它今天在真实数据上一条都不触发(六个配方全在支持期
        # 内),所以除了这里没有别的地方能证明它对 —— 而它错了是整张菜单。
        run: |
          python3 scripts/rh_lifecycle_test.py

      - name: Component image tag drift gate
        # vars/images.yml is the source of truth, but build-mirror-tarball.sh is
        # a standalone bash script that cannot read ansible vars, so it carries
        # its own defaults.  Both sides said "keep in sync" in a comment; both
        # sides drifted anyway (CAPA v0.1.12 vs v0.1.24, CSI v0.1.0 vs v0.1.13).
        # Drift is silent: the mirror gets three unused old images, and 04 then
        # re-pulls the right ones from upstream.
        run: |
          python3 scripts/lint-image-tags.py

      - name: Apsara discovery unit test
        # discover.py WRITES group_vars/all.yml.  A wrong value there does not
        # fail loudly — it fails forty minutes later somewhere unrelated.  These
        # are the pure, cloud-free parts: indent isolation between the top-level
        # `region` and cloud_env's `REGION`, empty values staying `""` (a bare
        # empty parses as None and `None | length` is what nas_available would
        # hit), and the CIDR overlap check.
        run: |
          python3 scripts/apsara/discover_test.py

      - name: ROS template tag lint
        # !Condition is not supported by Aliyun ROS at all — it rejects the whole
        # template — and !Not parses but always evaluates false.  Both look
        # correct locally and fail only when the cloud parses the template, so a
        # !Condition survived review, syntax checks and weeks of use on Apsara
        # (whose path rewrites the template first) before PreviewStack caught it.
        run: |
          python3 scripts/lint-ros-tags.py ros-templates/
  
  ansible-lint:
    # Regression gate for shell/correctness hygiene. Config in .ansible-lint
    # (cosmetic -> warnings); existing findings grandfathered in
    # .ansible-lint-ignore. A NEW no-changed-when / risky-shell-pipe /
    # command-instead-of-{module,shell} in a NEW file fails here.
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-lint (pinned)
        run: pip install "ansible-lint==26.6.0"     # 原来是 6.22.2

      - name: Run ansible-lint
        run: ansible-lint -q ansible/

      - name: ROS template parameter contract
        run: python3 scripts/lint-ros-params.py

      - name: Apsara template transform smoke
        run: |
          set -euo pipefail
          for t in ros-templates/*.yaml; do
            echo "== $t"
            python3 scripts/apsara/apsara_ize.py "$t" "$RUNNER_TEMP/$(basename "$t").apsara"
          done
