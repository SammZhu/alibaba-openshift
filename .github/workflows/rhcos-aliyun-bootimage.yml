# RHCOS aliyun boot-image supply chain — version matrix (P3-IMG.1)
name: rhcos-aliyun-bootimage

on:
  schedule:
    - cron: "17 6 * * *"        # daily: poll for new RHCOS across the support window
  workflow_dispatch: {}

permissions:
  contents: write               # provenance write-back

jobs:
  bake-matrix:
    runs-on: [self-hosted, Linux, X64, rhel8, alibaba-vpc]
    steps:
      # This runner is in the Alibaba VPC; its cross-border path to github.com is
      # flaky (OpenSSL SSL_ERROR_SYSCALL).  fetch-depth:1 minimises the clone, and
      # the provenance write-back below retries.  A rare checkout SSL drop just
      # needs a workflow re-run.
      # checkout@v4 runs on Node 20, which GitHub already force-upgrades to
      # Node 24 with a deprecation warning on every run; v5 targets Node 24.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      # floor 决定了每天扫哪些 minor,也就决定了用户装机时菜单上有哪些版本。
      # 手写那一行没有参照系,而红帽每 4 个月发一个 minor —— 必然过期。这一步每次
      # 跑之前先从红帽自己的生命周期数据推出下沿(Full + Maintenance,**不含 EUS**;
      # 为什么不含,见 rh_oldest_supported_minor.py 的模块注释,那是个会给出好看错答案的坑)。
      #
      # 查不到就沿用已提交的 floor 照常烤 —— 接口挂了不该让整条供应链停摆,
      # 但也绝不拿一个残缺列表算出来的数字去改文件。
      - name: Refresh the floor from Red Hat's product lifecycle
        run: |
          set -uo pipefail
          # 管道里 head 提前关掉会给 grep 一个 SIGPIPE,pipefail 下就是非 0。单进程读。
          BEFORE="$(awk '!/^#/ && NF {print; exit}' bootimage/oldest-supported-minor)"
          python3 scripts/rh_oldest_supported_minor.py --write bootimage/oldest-supported-minor
          rc=$?
          AFTER="$(awk '!/^#/ && NF {print; exit}' bootimage/oldest-supported-minor)"
          case "$rc" in
            0) echo "floor: $BEFORE -> $AFTER" ;;
            2) echo "::warning::红帽生命周期接口取不到(原因见上)—— 沿用已提交的 floor $BEFORE,照常烤" ;;
            3) echo "::error::生命周期数据不可信(原因见上)—— 沿用已提交的 floor $BEFORE。烤照常进行,但这条要人看" ;;
            *) echo "::error::rh_oldest_supported_minor.py 意外退出 $rc"; exit "$rc" ;;
          esac

      - name: Bake every RHCOS from the floor up (skip already baked)
        run: |
          set -uo pipefail
          # AND 上 AI 版本矩阵:从 operator 的 all.yml 读 token 路径
          OP_GV="$HOME/work/alibabacloud/openshift-alibaba/alibaba-openshift/ansible/group_vars/all.yml"
          AI_ARG=""
          if python3 scripts/ai_versions.py --group-vars "$OP_GV" > /tmp/ai-versions.txt 2>/tmp/ai.err; then
            AI_ARG="--ai-versions /tmp/ai-versions.txt"
            # 只打每个 minor 的最新 z + 总数。全量是七百多个版本(4.11 一直到
            # 5.0-rc),把日志淹掉而检测只用得到每 minor 的最新一个 —— 2026-09-15
            # 手动触发那次,ai_filtered_out=[] 这行就差点被它埋掉。
            echo "AI-supported: $(grep -vE -- '-(multi|ec|rc)\b' /tmp/ai-versions.txt \
              | awk -F. '{print $1"."$2}' | sort -u -t. -k1,1n -k2,2n \
              | while read -r m; do
                  grep -E "^${m}\.[0-9]+$" /tmp/ai-versions.txt \
                    | sort -t. -k3,3n | tail -1;
                done | tr '\n' ' ')($(wc -l < /tmp/ai-versions.txt) 个版本,只列每个 minor 的最新 z)"
          else
            echo "::warning::AI 拉取失败 — 不做 AI 交集,仅按 floor 烤"; cat /tmp/ai.err 2>/dev/null || true
          fi
          LIST="$(python3 scripts/bootimage_detect.py --all-from $AI_ARG --provenance-dir bootimage/provenance)"
          
          if [ -z "$LIST" ]; then
            echo "✓ all versions up to date — nothing to bake"
            exit 0
          fi
          echo "to bake:"; printf '%s\n' "$LIST" | cut -f1,2
          rc=0
          while IFS=$'\t' read -r RHCOS OCP URL SHA; do
            [ -z "$RHCOS" ] && continue
            echo "::group::bake $RHCOS (OCP $OCP)"
            if bash scripts/bake-one.sh "$RHCOS" "$OCP" "$URL" "$SHA"; then
              echo "✓ $RHCOS baked + provenance recorded"
            else
              echo "::error::bake failed for $RHCOS (OCP $OCP)"; rc=1
            fi
            echo "::endgroup::"
          done <<< "$LIST"
          exit $rc

      - name: Commit the floor + refreshed provenance
        if: ${{ !cancelled() }}            # 即使某个版本烤失败也刷新其它条目
        run: |
          set -uo pipefail
          # 复用 bake 步骤已拉好的 AI 列表;没有就跳过(没 AI 源刷不了 z)
          # 没有 AI 列表就刷不了 z —— 但 floor 可能已经变了,那个照样要提交,
          # 所以这里只跳过 normalize 这一步,不再整步 exit 0。
          if [ -s /tmp/ai-versions.txt ]; then
            python3 scripts/normalize_provenance.py \
              --ai-versions /tmp/ai-versions.txt \
              --provenance-dir bootimage/provenance
          else
            echo "no AI list — skip provenance z refresh (floor 仍会提交)"
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootimage/provenance bootimage/oldest-supported-minor
          git commit -m "chore(bootimage): refresh support floor + provenance z" \
            || { echo "no change"; exit 0; }
          # Self-hosted runner -> github.com is cross-border and flaky
          # (OpenSSL SSL_ERROR_SYSCALL); retry the pull/push write-back.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" \
               && git push origin "HEAD:${GITHUB_REF_NAME:-main}"; then
              echo "provenance write-back OK (attempt $i)"; exit 0
            fi
            echo "::warning::git write-back attempt $i failed (github.com SSL/network); retry in 15s"
            sleep 15
          done
          echo "::error::git write-back failed after 5 attempts"; exit 1
