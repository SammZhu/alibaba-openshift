---
# Build + ship the mirror content tarball to OSS — the one-time prerequisite for
# Phase 04 (which downloads it onto the mirror ECS).  This is the ansible wrapper
# around scripts/build-mirror-tarball.sh: it assembles the script's environment
# from group_vars and dispatches OSS to the right client per platform, so the long
# env line is never hand-crafted.
#
# Public cloud: OSS via the aliyun CLI + auto-detected endpoint (script defaults).
# Apsara Stack: OSS via apsara-oss to the internal endpoint.  Registry pulls stay
#   DIRECT — cloud_env carries APSARA_PROXY (apsara-oss uses it for the OSS leg
#   only) but NOT http_proxy/https_proxy, so oc-mirror/skopeo pull straight from
#   quay.io (~7 MB/s vs ~17 KB/s through the Squid proxy).
#
# Prereqs (group_vars): pull_secret_file, offline_token_file, oss_bucket,
#   openshift_version (X.Y.Z), cluster_name, region; ~60 GB free disk.
#
# Usage:
#   ansible-playbook ansible/playbooks/mirror-build.yml
# The build runs ~1-2 h; follow it with `tail -f` on the log printed at start.
- name: Build + ship the mirror tarball to OSS
  hosts: local
  gather_facts: false
  # 组件镜像 tag 的唯一事实来源。build-mirror-tarball.sh 是独立 bash 脚本,读不到
  # ansible 变量,所以它自带一份默认值 —— 两边漂过一次(脚本停在 CAPA v0.1.12 /
  # CSI v0.1.0,而 images.yml 已经是 v0.1.24 / v0.1.13)。从这里显式传进去,走
  # ansible 的路径就不可能再漂;单独跑脚本那条路由 scripts/lint-image-tags.py 看着。
  vars_files:
    - "{{ playbook_dir }}/../vars/images.yml"
  # apsara: cloud_env carries CLOUD_PLATFORM/AK/SK/endpoints/APSARA_PROXY so
  # apsara-oss can upload.  It deliberately does NOT set http_proxy — registry
  # pulls go direct.  Public cloud: cloud_env is {} (no-op).
  environment: "{{ cloud_env | default({}) }}"
  tasks:
    - ansible.builtin.include_tasks: ../tasks/path_defaults.yml
    - ansible.builtin.include_tasks: ../tasks/resolve_ak_sk.yml

    - name: Sanity — build inputs present
      ansible.builtin.assert:
        that:
          - oss_bucket | default('') | length > 0
          - openshift_version | default('') | length > 0
          - cluster_name | default('') | length > 0
        fail_msg: "Set oss_bucket / openshift_version / cluster_name in group_vars."

    - name: Sanity — pull secret + offline token readable
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ pull_secret_file }}"
        - "{{ offline_token_file }}"
      register: _mb_files
      failed_when: not _mb_files.stat.exists

    # ── Preflight: fail fast in ansible (not mid-script) on a missing tool or ───
    #    too little disk, with a clear message. ──────────────────────────────────
    - name: Preflight — probe required build tools
      ansible.builtin.shell: "command -v {{ item }} >/dev/null 2>&1 && echo ok || echo MISSING"
      args:
        executable: /bin/bash
      loop: [skopeo, jq, tar, curl]
      register: _mb_tools
      changed_when: false

    - name: Preflight — all build tools present
      ansible.builtin.assert:
        that: "_mb_tools.results | selectattr('stdout', 'equalto', 'MISSING') | list | length == 0"
        fail_msg: >-
          Missing build tool(s):
          {{ _mb_tools.results | selectattr('stdout', 'equalto', 'MISSING') | map(attribute='item') | list }}.
          Install them (e.g. sudo dnf install -y skopeo jq).  oc-mirror is fetched
          by the script itself, so it need not be pre-installed.

    - name: Preflight — apsara OSS client binary is present + executable
      ansible.builtin.stat:
        path: "{{ oss_cli }}"
      register: _mb_ossbin
      failed_when: not (_mb_ossbin.stat.exists and _mb_ossbin.stat.executable)
      when: (cloud_platform | default('public')) == 'apsara'

    - name: Preflight — free disk at the build dir (needs ~60 GB)
      # pipefail: without it the status comes from tr, which succeeds on empty
      # input — a failing df would report 0 GB free and the preflight would
      # "fail" for the wrong reason, or worse, parse as plenty of space.
      ansible.builtin.shell: |
        set -o pipefail
        df -BG --output=avail {{ repo_root }} | tail -1 | tr -dc '0-9'
      args:
        executable: /bin/bash
      register: _mb_disk
      changed_when: false

    - name: Preflight — enough disk for the build
      ansible.builtin.assert:
        that: (_mb_disk.stdout | default('0') | int) >= 60
        fail_msg: >-
          Only {{ _mb_disk.stdout | default('?') }} GB free at {{ repo_root }};
          the build needs ~60 GB (30 GB tarball + oc-mirror working set/cache).
          Free space or set WORK_DIR to a larger volume.

    # Apsara 的跨境链路上,oc-mirror 自己的默认(4 并发 / 每镜像 10m)是会失败的:
    # 四路并发把带宽分掉,几个 GB 级的 release 镜像跑不完 10m 就 context deadline
    # exceeded。这一点 build-mirror-tarball.sh 的注释里早就写着(「seen on Apsara:
    # 17/192 mirrored」),旋钮也早就做好了 —— 但它只作为注释躺在公有云的
    # all.yml.example 里,Apsara 的模板里一句都没有,于是默认值照旧生效。
    # 2026-09-16 一次 4.22.12 装机就这么死在这儿:跑了 24 分 33 秒,192 个镜像里
    # **只差一个** ocpReleaseContent 超时,整轮 rc=10。
    #
    # 所以把慢链路的值做成 Apsara 的**兜底**,而不是模板里的一条建议:模板救不了
    # 已经存在的 all.yml。显式设过的仍然优先(见下面 combine 的顺序)。
    - name: Slow-link oc-mirror defaults (apsara only)
      ansible.builtin.set_fact:
        _mb_oc_mirror_defaults: >-
          {{ {
               'OC_MIRROR_PARALLEL_IMAGES': '2',
               'OC_MIRROR_PARALLEL_LAYERS': '4',
               'OC_MIRROR_IMAGE_TIMEOUT':   '45m',
               'OC_MIRROR_RETRIES':         '10'
             } if (cloud_platform | default('public')) == 'apsara' else {} }}

    - name: Assemble build-mirror-tarball.sh environment (per platform)
      ansible.builtin.set_fact:
        _mb_env: >-
          {{ {
               'OSS_CLI': oss_cli | default('aliyun oss'),
               'OSS_BUCKET': oss_bucket,
               'REGION': region,
               'CLUSTER_NAME': cluster_name,
               'OPENSHIFT_VERSION': (openshift_version.split('.')[0:2] | join('.')),
               'OPENSHIFT_PATCH_VERSION': openshift_version,
               'PULL_SECRET': pull_secret_file,
               'OFFLINE_TOKEN_FILE': offline_token_file,
               'WORK_DIR': repo_root ~ '/mirror-build',
               'OPENSHIFT_CAPI_IMAGE': capa_image_repo ~ ':' ~ capa_image_tag,
               'CSI_OPERATOR_VERSION': csi_operator_image_tag
             } | combine(
               _mb_oc_mirror_defaults
             ) | combine(
               {
                 'OC_MIRROR_PARALLEL_IMAGES': oc_mirror_parallel_images | default('') | string,
                 'OC_MIRROR_PARALLEL_LAYERS': oc_mirror_parallel_layers | default('') | string,
                 'OC_MIRROR_IMAGE_TIMEOUT':   oc_mirror_image_timeout   | default('') | string,
                 'OC_MIRROR_RETRIES':         oc_mirror_retries         | default('') | string
               } | dict2items | rejectattr('value', 'equalto', '') | list | items2dict
             ) | combine(
               {
                 'OSS_ENDPOINT': apsara_oss_endpoint | default(''),
                 'AK': _ak,
                 'SK': _sk,
                 'SIG_STORAGE_REGISTRY': apsara_sig_storage_registry | default('')
               } if (cloud_platform | default('public')) == 'apsara' else {}
             ) }}

    - name: Build log path
      ansible.builtin.set_fact:
        _mb_log: "{{ repo_root }}/mirror-build-{{ cluster_name }}-{{ openshift_version }}.log"

    # 2026-09-19: a full-chain run rebuilt a tarball that was already on OSS,
    # same cluster, same 4.22.12, built two days earlier by a matching
    # oc-mirror.  Measured cost of that rebuild: 1:59:52 (09-16) and 1:32:16
    # (09-17, with a warm cache) — a warm cache does not save you.  The only way
    # to skip was for a human to notice and hand-add apsara_skip=[mirror-build],
    # which is a judgement the pipeline is better placed to make than the
    # operator is at 23:00.
    #
    # The signal is the OSS OBJECT, not the local tarball.  Skipping this phase
    # skips the upload too, so "the tar is on disk" is precisely the wrong
    # question — a local tar that was never shipped would make 04 fail to fetch
    # anything.  Ask whether the thing 04 will download is already there.
    #
    # And "same version" is not enough.  The 4.20 oc-mirror produced a
    # byte-complete 4.22.12 tarball with the signatures stripped (#97/#98); the
    # version matched and the install deadlocked.  So the builder's version has
    # to match too, which is what the .buildinfo sidecar records.
    #
    # No buildinfo -> build.  An object we cannot describe is not an object we
    # may reuse: here the conservative direction is to rebuild, because reusing
    # an unknown tarball is the failure that cost days.
    - name: Is a matching tarball already on OSS?
      ansible.builtin.shell: |
        set -uo pipefail
        obj="mirror-tarballs/{{ cluster_name }}-{{ openshift_version }}.tar"
        # An unusable OSS client is not an absent object.  Prove we can talk to
        # the bucket at all first; if we cannot, say so and build — but say the
        # true reason, so nobody reads a broken probe as an empty bucket.
        if ! {{ oss_cli }} ls "oss://{{ oss_bucket }}/" >/dev/null 2>&1; then
          echo "MISS=oss-unusable"; exit 0
        fi
        if ! {{ oss_cli }} stat "oss://{{ oss_bucket }}/$obj" >/dev/null 2>&1; then
          echo "MISS=no-object"; exit 0
        fi
        tmp=$(mktemp)
        if ! {{ oss_cli }} cp "oss://{{ oss_bucket }}/$obj.buildinfo" "$tmp" --force >/dev/null 2>&1; then
          echo "MISS=no-buildinfo"; rm -f "$tmp"; exit 0
        fi
        got_ver=$(grep -E '^openshift_patch_version=' "$tmp" | cut -d= -f2-)
        got_ocm=$(grep -E '^oc_mirror_minor=' "$tmp" | cut -d= -f2-)
        rm -f "$tmp"
        want_ver="{{ openshift_version }}"
        want_ocm="{{ openshift_version.split('.')[0:2] | join('.') }}"
        [ "$got_ver" = "$want_ver" ] || { echo "MISS=version[$got_ver]!=[$want_ver]"; exit 0; }
        [ "$got_ocm" = "$want_ocm" ] || { echo "MISS=oc-mirror[$got_ocm]!=[$want_ocm]"; exit 0; }
        echo "HIT"
      # Same environment the build itself gets.  apsara-oss refuses to run
      # without an endpoint ("need --endpoint (or OSS_ENDPOINT)") and a bare
      # call would fail — which this guard would then have read as "no object"
      # and rebuilt, every single time, silently.  That is exactly how #104's
      # guard managed to never fire; caught here by running it against the real
      # bucket before merging rather than after.
      environment: "{{ (cloud_env | default({})) | combine(_mb_env) }}"
      register: _mb_have
      changed_when: false
      when: not (mirror_build_force | default(false) | bool)

    - name: Decide whether to build
      ansible.builtin.set_fact:
        _mb_reuse: >-
          {{ (not (mirror_build_force | default(false) | bool))
             and ((_mb_have.stdout | default('') | trim) == 'HIT') }}

    - name: Say which way this went, and why
      ansible.builtin.debug:
        msg: >-
          {% if _mb_reuse | bool %}
          oss://{{ oss_bucket }}/mirror-tarballs/{{ cluster_name }}-{{ openshift_version }}.tar
          is already there and its .buildinfo says {{ openshift_version }} built by a
          matching oc-mirror — skipping the rebuild (measured 1.5-2 h, warm cache
          included). Force one with -e mirror_build_force=true.
          05-verify still runs, so the signature assertion is not skipped with it.
          {% elif mirror_build_force | default(false) | bool %}
          mirror_build_force=true — rebuilding even though a matching object may exist.
          {% else %}
          Building: {{ _mb_have.stdout | default('MISS=unknown') | trim }}.
          {% endif %}

    - name: Announce (the build takes ~1-2 h)
      ansible.builtin.debug:
        msg: "Building the mirror tarball — follow progress with:  tail -f {{ _mb_log }}"
      when: not (_mb_reuse | bool)

    - name: Run build-mirror-tarball.sh (build + upload to OSS)
      ansible.builtin.shell: |
        set -o pipefail
        {{ repo_root }}/scripts/build-mirror-tarball.sh 2>&1 | tee {{ _mb_log }}
      args:
        executable: /bin/bash
      environment: "{{ (cloud_env | default({})) | combine(_mb_env) }}"
      register: _mb_run
      changed_when: true
      when: not (_mb_reuse | bool)

    - name: Done
      ansible.builtin.debug:
        msg: >-
          ✓ Mirror content shipped to oss://{{ oss_bucket }}/mirror-tarballs/.
          Next: 02-import-image (stages the mirror-registry installer), then
          04-prepare-mirror.
