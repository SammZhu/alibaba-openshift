---
# Phase 00 — verify all prerequisites are in place before touching the cloud.
- name: Preflight checks
  hosts: local
  gather_facts: true
  # apsara: dispatch {{ cloud_cli }}/{{ oss_cli }} + supply AK/SK (public: no-op).
  environment: "{{ cloud_env | default({}) }}"
  tasks:
    - name: Verify required CLI tools are installed
      ansible.builtin.command: "{{ item }} --version"
      changed_when: false
      check_mode: false
      register: tool_check
      failed_when: tool_check.rc != 0
      # apsara uses cloudcli/apsara-rpc/apsara-oss (built from scripts/apsara),
      # not the aliyun CLI — only require aliyun on public cloud.
      loop: "{{ (['aliyun'] if (cloud_platform | default('public')) != 'apsara' else []) + ['curl', 'jq'] }}"

    - name: Verify required input files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: input_files
      loop:
        - "{{ pull_secret_file }}"
        - "{{ ssh_pub_key_file }}"
        - "{{ ssh_priv_key_file }}"
        - "{{ offline_token_file }}"
      # No failed_when here — Ansible only exposes .results AFTER the loop.
      # The assert step below fails per-file with a clear message.

    - name: Assert each input file is present
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "Missing required file: {{ item.item }}"
      loop: "{{ input_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Assisted-Installer only — ABI (installation_method=Agent-based) has no
    # assisted-service dependency, so it needs no offline token / sso.redhat.com.
    - name: Verify offline token can mint an access token (Assisted only)
      ansible.builtin.include_tasks: ../tasks/assisted_token.yml
      when: installation_method | default('Assisted') | lower not in ['agent', 'agent-based']

    - name: Verify aliyun-cli profile + ECS read access
      ansible.builtin.command:
        argv:
          - "{{ cloud_cli }}"
          - ecs
          - DescribeRegions
          - --RegionId
          - "{{ region }}"
          - --profile
          - "{{ aliyun_profile }}"
      register: ali_check
      changed_when: false
      failed_when: ali_check.rc != 0

    # NLB is a separate service from SLB; AliyunNLBFullAccess is easy to
    # miss and otherwise surfaces only halfway through Phase 03 as
    # "Forbidden.NoPermission" on the ApiNLB resource.
    #
    # NLB also requires a service-linked role (AliyunServiceRoleForNlb)
    # to be created once per account.  We check for it below; the
    # alternative is a confusing CREATE_FAILED in Phase 03 with
    # "OperationDenied.ServiceLinkedRoleNotExist".
    # Public cloud: verify the RAM user's read access across services.  Apsara's
    # RAM model differs (the sub-user intentionally lacks ram:ListRoles; NLB/SLB
    # access + service-linked roles are provisioned by ASCM) — skip here and rely
    # on the ROS/ECS/VPC calls the actual phases make.
    - name: Verify aliyun-cli has VPC, SLB, NLB, RAM, ROS, PVTZ access (public cloud)
      ansible.builtin.command:
        argv: "{{ item }}"
      register: svc_check
      changed_when: false
      failed_when: svc_check.rc != 0
      when: (cloud_platform | default('public')) != 'apsara'
      loop:
        - [aliyun, vpc, DescribeVpcs,           --RegionId, "{{ region }}", --profile, "{{ aliyun_profile }}"]
        - [aliyun, slb, DescribeLoadBalancers,  --RegionId, "{{ region }}", --profile, "{{ aliyun_profile }}"]
        - [aliyun, nlb, ListLoadBalancers,      --RegionId, "{{ region }}", --profile, "{{ aliyun_profile }}"]
        - [aliyun, ram, ListRoles,              --profile, "{{ aliyun_profile }}"]
        - [aliyun, ros, DescribeRegions,        --profile, "{{ aliyun_profile }}"]
        - [aliyun, pvtz, DescribeZones,         --profile, "{{ aliyun_profile }}"]
      loop_control:
        label: "{{ item[1] }} {{ item[2] }}"

    # Public cloud only: NLB needs the AliyunServiceRoleForNlb SLR.  On Apsara
    # service-linked roles are ASCM-managed (a sub-user can't create them), so
    # this check does not apply — skip it.
    - name: Verify NLB service-linked role exists (account-level, one-time)
      ansible.builtin.command:
        argv: [aliyun, ram, GetRole, --RoleName, AliyunServiceRoleForNlb, --profile, "{{ aliyun_profile }}"]
      register: nlb_slr
      changed_when: false
      failed_when: false
      when: (cloud_platform | default('public')) != 'apsara'

    - name: Fail with actionable message if NLB SLR is missing
      ansible.builtin.fail:
        msg: |
          AliyunServiceRoleForNlb is missing — NLB cannot be created until
          this account-level service-linked role exists.  Create it once:

            aliyun resourcemanager CreateServiceLinkedRole \
              --ServiceName nlb.aliyuncs.com \
              --endpoint resourcemanager.aliyuncs.com \
              --profile {{ aliyun_profile }}
      when:
        - (cloud_platform | default('public')) != 'apsara'
        - (nlb_slr.rc | default(0)) != 0

    # ── ECS instance-type stock check (avoid wasting Phase 03 time on stockouts) ──
    # ROS CreateStack returns ResourceNoStock at the end of its provisioning
    # attempt — i.e. after the stack is half-built — so the cleanup is annoying.
    # Querying DescribeAvailableResource up front catches the problem in 5 sec
    # and recommends alternatives.
    - name: Compute the (zone, instance_type) combinations needed
      ansible.builtin.set_fact:
        _stock_checks: >-
          {{ [
            {'zone': zone,  'type': control_plane_type, 'role': 'control plane (master-1, master-2)'},
            {'zone': zone2, 'type': control_plane_type, 'role': 'control plane (master-3)'}
          ] + (
            [{'zone': zone,  'type': compute_type,         'role': 'compute (workers)'}]
              if (compute_count | int) > 0 else []
          ) + (
            [{'zone': zone,  'type': jump_host_type | default(''),       'role': 'jump host'}]
              if (enable_jump_host | default(false) | bool) else []
          ) + (
            [{'zone': zone,
              'type': (mirror_instance_type
                       if (mirror_instance_type | default('') | length > 0)
                       else (mirror_instance_type_fresh | default('ecs.g7.xlarge'))),
              'role': 'mirror registry'}]
              if (mirror_enabled | default(false) | bool) else []
          ) }}

    - name: Assert every stock-check target has a non-empty instance type
      ansible.builtin.assert:
        that: item.type | length > 0
        fail_msg: |
          {{ item.role }} is enabled but its instance type is empty.
          Set the matching variable in group_vars/all.yml (e.g.
          mirror_instance_type, jump_host_type).
      loop: "{{ _stock_checks }}"
      loop_control:
        label: "{{ item.role }} → {{ item.type or '(MISSING)' }}"

    # Decide stock with jq on the parsed JSON, not by pattern-matching the raw
    # text: the aliyun CLI pretty-prints and apsara-rpc emits compact JSON, and a
    # text match on '"StatusCategory": "WithStock"' silently reported every Apsara
    # instance type as sold out.  `jq -e` exits non-zero when nothing matches (and
    # when the call itself failed), so rc alone tells us the answer.
    - name: Probe each (zone, instance_type) for stock
      ansible.builtin.shell: >-
        {{ cloud_cli }} ecs DescribeAvailableResource
        --RegionId {{ region }}
        --DestinationResource InstanceType
        --InstanceType {{ item.type }}
        --ZoneId {{ item.zone }}
        --profile {{ aliyun_profile }} 2>/dev/null
        | jq -e '[.AvailableZones.AvailableZone[]?
                  .AvailableResources.AvailableResource[]?
                  .SupportedResources.SupportedResource[]?
                  | select(.StatusCategory == "WithStock")] | length > 0' >/dev/null
      register: _stock_results
      changed_when: false
      failed_when: false
      loop: "{{ _stock_checks }}"
      loop_control:
        label: "{{ item.zone }} / {{ item.type }} ({{ item.role }})"

    # Aliyun fields:
    #   Status         : "Available"     ← merely "sold in this region", not in stock
    #   StatusCategory : "WithStock"     ← actually has real-time inventory
    #                    "ClosedWithStock" / "SoldOut" → ROS CreateStack will fail
    # We must check StatusCategory == "WithStock" at the (innermost)
    # SupportedResource level.  Using Status would (and did) green-light
    # types that ROS then rejects with ResourceNoStock.  The probe above does that
    # check in jq, so here a non-zero rc simply means "no stock" (or the call
    # failed — treated the same, conservatively).
    - name: Identify out-of-stock combinations
      ansible.builtin.set_fact:
        _stock_failures: >-
          {{ _stock_results.results
             | selectattr('rc', 'defined')
             | selectattr('rc', 'ne', 0)
             | map(attribute='item') | list }}

    - name: Fail with actionable stockout report
      ansible.builtin.fail:
        msg: |
          ECS stockout in {{ region }}.  ROS CreateStack would fail at the
          end of Phase 03 (ResourceNoStock) — fix BEFORE running 03.

          Out-of-stock:
          {% for f in _stock_failures %}
            ✗ {{ f.zone }} / {{ f.type }} ({{ f.role }})
          {% endfor %}

          To find an in-stock alternative quickly:

            for T in c7 c7e c6e c6 g7 g7a r7; do
              for Z in a b c; do
                S=$(aliyun ecs DescribeAvailableResource --RegionId {{ region }} \
                  --DestinationResource InstanceType --InstanceType ecs.${T}.2xlarge \
                  --ZoneId {{ region }}-${Z} --profile {{ aliyun_profile }} 2>/dev/null \
                  | jq -r '.AvailableZones.AvailableZone[]?.AvailableResources.AvailableResource[]?.SupportedResources.SupportedResource[]?.Status' | head -1)
                [ "$S" = "Available" ] && echo "✓ ecs.${T}.2xlarge zone-${Z}"
              done
            done

          Then edit group_vars/all.yml — change control_plane_type / zone(s)
          to a row that shows ✓.  Same-tier swaps (c7 → c6e) keep the same
          vCPU / RAM ratio; cross-tier (c7 → g7) doubles RAM.
      when: _stock_failures | length > 0

    - name: Stock check passed
      ansible.builtin.debug:
        msg: |
          ✓ ECS stock available for all {{ _stock_checks | length }} (zone, type) combinations.

    # OSS uses ossutil under the hood, which does NOT support --profile.
    # Read AK/SK directly from ~/.aliyun/config.json for the named profile.
    - name: Resolve AK/SK for the OSS check (cloud_env on apsara, aliyun config on public)
      ansible.builtin.include_tasks: ../tasks/resolve_ak_sk.yml

    # Resolve OSS endpoint (internal when on aliyun ECS, public otherwise).
    # See tasks/oss_endpoint.yml for cost rationale (~¥150-200/mo savings).
    - ansible.builtin.include_tasks: ../tasks/oss_endpoint.yml

    # ossutil requires --flag=value form; space-separated (-i VALUE) is not supported.
    - name: Verify OSS access
      ansible.builtin.command:
        argv: "{{ oss_cli_argv + _a }}"
      vars:
        _a:
          - ls
          - "--endpoint={{ _oss_endpoint }}"
          - "--access-key-id={{ _ak }}"
          - "--access-key-secret={{ _sk }}"
      register: oss_check
      changed_when: false
      failed_when: oss_check.rc != 0
      no_log: true  # Don't print credentials to Ansible output

    - name: Ensure output directory exists
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"

    - name: Preflight passed
      ansible.builtin.debug:
        msg: |
          ✓ All preflight checks passed.
          Next: ansible-playbook playbooks/01-prepare-iso.yml
