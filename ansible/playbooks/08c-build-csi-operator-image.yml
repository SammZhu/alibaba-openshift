---
# 08c — rebuild the CSI operator image on the operator host and push it to the
# mirror.  Same reasoning and mechanics as 08b (see tasks/build_image_on_operator.yml).
#
# WHY: the CSI driver already supports private clouds through environment
# variables (NAS_ENDPOINT, ALICLOUD_CLIENT_SCHEME, ALIBABA_CLOUD_HTTP_HEADERS),
# but this operator only ever set ECS_ENDPOINT, so none of it was reachable —
# disk provisioning failed TLS verification against the environment's own CA and
# NAS resolved a public endpoint that does not exist.  spec.extraEnv passes them
# through; that needs a rebuilt operator AND a re-applied CRD (08 does the CRD).
#
# Usage:
#   ansible-playbook playbooks/08c-build-csi-operator-image.yml
#   Builds csi_build_ref, which defaults to main — the extraEnv support was
#   merged there (#29), so the old apsara-extra-env branch is gone.  Then just
#   run 08: the tag is recorded in state.yml and read back from there.
- name: Build the CSI operator image on the operator, push to the mirror
  hosts: local
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../vars/images.yml"
  vars:
    csi_repo: "{{ playbook_dir }}/../../../alibaba-cloud-csi-operator"
    csi_build_ref: "main"              # the extraEnv support lives on main since #29
    csi_base_tag: "{{ csi_operator_image_tag }}"
    csi_build_tag: "{{ csi_operator_image_tag }}-apsara"
    csi_mirror_repo: "{{ csi_operator_mirror_repo | default('samzhu/alibaba-cloud-csi-operator') }}"
  tasks:
    - ansible.builtin.include_tasks: ../tasks/load_state.yml

    - name: "08c — build and push"
      ansible.builtin.include_tasks: ../tasks/build_image_on_operator.yml
      vars:
        bi_name: 08c
        bi_repo: "{{ csi_repo }}"
        bi_ref: "{{ csi_build_ref }}"
        # This project's `make build` runs manifests/generate/fmt/vet first and
        # emits a host-arch, cgo-enabled bin/manager — neither of which suits a
        # distroless base — so compile directly.
        bi_build_argv: [go, build, -o, bin/manager, cmd/main.go]
        bi_binary: bin/manager
        bi_mirror_repo: "{{ csi_mirror_repo }}"
        bi_base_tag: "{{ csi_base_tag }}"
        bi_build_tag: "{{ csi_build_tag }}"
        bi_state_prefix: csi

    - name: "08c — next steps"
      ansible.builtin.debug:
        msg: |
          {{ csi_build_tag }} is recorded in state.yml — just re-run 08 (it also
          re-applies the CRD, which the extraEnv field needs), no tag to pass:
            ansible-playbook playbooks/08-deploy-post-install.yml
          then re-run the smoke:
            ansible-playbook playbooks/13-csi-smoke.yml

          08 reads both this tag and CAPA's from state, so re-running it can no
          longer revert the component whose tag you did not think to pass.
