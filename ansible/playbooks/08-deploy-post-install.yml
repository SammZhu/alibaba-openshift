---
# Phase 08 — deploy CAPI provider + CSI operator + CSI driver CR onto the cluster.
#
# Driven from the OPERATOR host (RHEL8); executed ON the jump host.  The jump
# host lives inside the VPC (can reach the private cluster API), and carries the
# repos + oc + kustomize + /root/kubeconfig — the operator box cannot reach the
# cluster API directly, so all kubectl/oc work happens on the jump host over SSH.
#
# Standalone + idempotent: play 1 derives the jump host from state.yml and adds
# it to the inventory (does NOT rely on Phase 03's in-run add_host), so Phase 08
# can be run on its own at any time.  Every apply is `oc apply` (idempotent) with
# changed_when gated on the "unchanged" marker.
#
# See docs/POST-INSTALL.md (OADP is manual-apply, not driven here).

- name: Resolve jump host from state (Phase 08 runs standalone)
  hosts: local
  gather_facts: false
  tasks:
    - ansible.builtin.include_tasks: ../tasks/load_state.yml

    - name: Resolve the deploy host (jump host, or the operator over peering)
      ansible.builtin.include_tasks: ../tasks/deploy_host.yml

    - name: Assert the jump host IP is known
      ansible.builtin.assert:
        that: mirror_private_ip | default('') | length > 0
        fail_msg: >-
          mirror_private_ip is not in state.yml — bring up the mirror-stack
          (Phase 03) first; Phase 08 deploys via the jump host.

    # The CAPA controller Deployment consumes AK/SK via `envFrom: secretRef:
    # alibaba-creds` (see openshift-capi-alicloud config/manager/deployment.yaml). Read them
    # from the operator's aliyun profile here so play 2 can create that secret —
    # without it the controller pod is stuck in CreateContainerConfigError.
    - name: Resolve Alibaba AK/SK (cloud_env on apsara, aliyun config on public)
      ansible.builtin.include_tasks: ../tasks/resolve_ak_sk.yml

    - name: Add the jump host to the inventory (carry creds as host vars)
      ansible.builtin.add_host:
        name: jumphost
        ansible_host: "{{ _dh_host }}"
        ansible_connection: "{{ _dh_connection }}"
        ansible_user: root
        ansible_ssh_private_key_file: "{{ ssh_priv_key_file }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15"
        groups: deploy
        capa_ak: "{{ _ak }}"
        capa_sk: "{{ _sk }}"
        # Carry the mirror IP so play 2 can apply an ImageTagMirrorSet for the
        # tag-pinned CAPA/CSI images (the install-config only emits an
        # ImageDigestMirrorSet, which does NOT redirect tag pulls — see the ITMS
        # task in play 2).
        mirror_private_ip: "{{ mirror_private_ip | default('') }}"
        # Cluster network (from state.yml) so play 2 can apply a filesystem-mode
        # NAS StorageClass that dynamically provisions (needs vpc/vSwitch/zone).
        nas_vpc_id: "{{ mirror_vpc_id | default('') }}"
        nas_vsw_id: "{{ mirror_private_vsw_1 | default('') }}"
        nas_zone_id: "{{ mirror_zone_id | default('') }}"
      no_log: true

- name: Deploy post-install components (executed on the jump host)
  hosts: jumphost
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../vars/images.yml"
  vars:
    # Operator image from the deploy-repo SSOT (vars/images.yml, auto-bumped by the
    # csi-operator CI on each v* release). Was hardcoded to v1.35.3 (the DRIVER
    # version, wrong) and never wired to images.yml, so the operator deployed at
    # v1.35.3 regardless of the release — its pod specs never picked up code fixes.
    csi_operator_img: "{{ csi_operator_image_repo }}:{{ csi_operator_image_tag }}"
    capi_provider_img: "{{ capa_image }}"
    kubeconfig_file: /root/kubeconfig
    # Repos live on the OPERATOR host (RHEL8, where ansible runs), NOT on the jump
    # host. Manifest rendering reads them via `delegate_to: local`; only `oc apply`
    # (cluster I/O) runs on the jump host over SSH. The jump host carries no repo
    # checkout and needs no `git pull` / GitHub access — the controller working
    # tree is the single source, so an edit takes effect on the next run.
    capi_repo: "{{ playbook_dir }}/../../../openshift-capi-alicloud"
    csi_repo: "{{ playbook_dir }}/../../../alibaba-cloud-csi-operator"
    deploy_repo: "{{ playbook_dir }}/../.."
  tasks:
    # Deploy what 08b/08c actually built, without anyone retyping the tag.
    #
    # vars/images.yml holds the UPSTREAM base tags; 08b/08c layer Apsara support
    # on top and push under `<tag>-apsara`, recording it in state.yml. Reading it
    # back here is what removes the hand-carried `-e` that, left out for one
    # component on 2026-09-06, silently reverted it to a base image.
    #
    # Precedence makes this work: set_fact (19) outranks play vars_files (14),
    # so state beats the SSOT default — and extra vars (22) outrank set_fact, so
    # an explicit `-e capa_image_tag=…` still wins over both.
    - name: "08 — is there recorded build state?"
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../state.yml"
      register: _deploy_state_stat
      delegate_to: local
      changed_when: false

    - name: "08 — read what 08b/08c recorded"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../state.yml"
        name: _built
      when: _deploy_state_stat.stat.exists

    # Read separately from vars_files so the SSOT base tags stay visible after
    # the set_fact below rewrites the top-level ones — the staleness check needs
    # to compare the two.
    - name: "08 — read the SSOT image tags"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vars/images.yml"
        name: _ssot

    # Falls back to _ssot rather than to capa_image_tag itself: a set_fact whose
    # value references the name it is setting can trip Ansible's recursive-loop
    # detection, and _ssot holds the identical value.
    - name: "08 — prefer the recorded build over the SSOT base tag"
      ansible.builtin.set_fact:
        capa_image_tag: "{{ _built.capa_image_built_tag | default(_ssot.capa_image_tag, true) }}"
        csi_operator_image_tag: "{{ _built.csi_image_built_tag | default(_ssot.csi_operator_image_tag, true) }}"
      when: _built is defined

    # A recorded build carries the base it was layered on. When vars/images.yml
    # moves to a new upstream version, that recording goes stale WITHOUT its tag
    # changing — `v0.1.13-apsara` is still called that after the base becomes
    # v0.1.14 — so deploying it would put an old build against new manifests.
    # The tag cannot show this; only the recorded base can.
    - name: "08 — the recorded builds must match the current base versions"
      ansible.builtin.assert:
        that:
          - (_built.capa_image_built_base_tag | default(_ssot.capa_image_tag)) == _ssot.capa_image_tag
          - (_built.csi_image_built_base_tag | default(_ssot.csi_operator_image_tag)) == _ssot.csi_operator_image_tag
        fail_msg: >-
          A recorded image was built against a base version that vars/images.yml
          has since moved past, so it is stale even though its tag still looks
          right. CAPA: built on
          {{ _built.capa_image_built_base_tag | default('(none)') }}, SSOT now
          {{ _ssot.capa_image_tag }}. CSI operator: built on
          {{ _built.csi_image_built_base_tag | default('(none)') }}, SSOT now
          {{ _ssot.csi_operator_image_tag }}. Re-run 08b and/or 08c to rebuild on
          the current base, then run 08 again.
        success_msg: >-
          builds current — capa {{ capa_image_tag }}
          (from {{ _built.capa_image_built_sha | default('?') }}),
          csi {{ csi_operator_image_tag }}
          (from {{ _built.csi_image_built_sha | default('?') }})
      when: _built is defined

    # Apsara only works from the images 08b/08c build: the endpoint, scheme and
    # tenancy-header support is compiled or baked into them, not configured here.
    # Their tags default to the base values in vars/images.yml, so re-running 08
    # with only one overridden silently reverts the OTHER component to its base
    # image — and that failure surfaces much later, somewhere else, looking like
    # something unrelated: on 2026-09-06 it was CSI PVCs stuck Pending behind
    # "x509: certificate signed by unknown authority", because the driver had
    # lost ALICLOUD_CLIENT_SCHEME and gone back to https.  Fail here instead,
    # before anything is applied.
    - name: "08 — on Apsara BOTH components must run their -apsara images"
      ansible.builtin.assert:
        that:
          - capa_image_tag.endswith('-apsara')
          - csi_operator_image_tag.endswith('-apsara')
        fail_msg: >-
          Apsara needs the images built by 08b (CAPA) and 08c (CSI operator).
          Right now capa_image_tag={{ capa_image_tag }} and
          csi_operator_image_tag={{ csi_operator_image_tag }} — at least one is a
          base image that does not speak Apsara. Run the build playbook for
          whichever is missing (08b for CAPA, 08c for the CSI operator); it
          records the tag in state.yml and 08 reads it back on the next run.
          There is nothing to pass by hand — and passing tags by hand is what
          used to revert whichever component was left out.
        success_msg: >-
          Apsara images: capa={{ capa_image_tag }}, csi={{ csi_operator_image_tag }}
      when: (cloud_platform | default('public')) == 'apsara'

    - name: Assert kubeconfig is present on the jump host
      ansible.builtin.stat:
        path: "{{ kubeconfig_file }}"
      register: kc_stat
      failed_when: not kc_stat.stat.exists

    - name: Verify cluster reachable
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", get, nodes]
      changed_when: false
      register: oc_nodes
      retries: 5
      delay: 10
      until: oc_nodes.rc == 0

    # Air-gap: pin the CAPA controller image BY DIGEST (not tag) — the same
    # pattern 08a uses for the CAPI core image. The companion ITMS (below) already
    # redirects tag pulls to the mirror, but a digest pin is stricter: the
    # install-config ImageDigestMirrorSet resolves it directly, the reference is
    # immutable, and CAPA stays consistent with capi-core. Resolve the digest from
    # the mirror copy that 04-prepare-mirror pushed. No-op (keeps the tag) when the
    # mirror is disabled — a connected cluster pulls from quay.io by tag.
    - name: Pin CAPA controller image by digest from the mirror (air-gap)
      when: mirror_private_ip | default('') | length > 0
      block:
        - name: Extract the cluster pull secret (mirror auth for oc image info)
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, openshift-config,
                   extract, secret/pull-secret, --to=/root, --confirm]
          changed_when: false

        - name: Resolve the CAPA controller image digest from the mirror
          ansible.builtin.command:
            argv: [oc, image, info,
                   "{{ mirror_private_ip }}:8443/samzhu/openshift-capi-alicloud:{{ capa_image_tag }}",
                   "--registry-config=/root/.dockerconfigjson", "--insecure", -o, json]
          register: _capa_imginfo
          changed_when: false

        - name: Override capi_provider_img with the digest-pinned reference
          ansible.builtin.set_fact:
            capi_provider_img: "quay.io/samzhu/openshift-capi-alicloud@{{ (_capa_imginfo.stdout | from_json).digest }}"

        # The CSI operator needs this for a second reason beyond air-gap
        # immutability: 08c rebuilds under the SAME tag, and a Deployment whose
        # spec still says `:v0.1.13-apsara` is unchanged as far as Kubernetes is
        # concerned, so nothing rolls out and (with IfNotPresent) the node keeps
        # serving the image it already has.  A rebuilt operator then never
        # reaches the cluster while 08 reports success — observed 2026-09-06,
        # where a pod stayed on the previous build for five hours across two
        # rebuilds.  Pinning the digest makes the spec change whenever the
        # content does, which is what triggers the rollout.
        - name: Resolve the CSI operator image digest from the mirror
          ansible.builtin.command:
            argv: [oc, image, info,
                   "{{ mirror_private_ip }}:8443/samzhu/alibaba-cloud-csi-operator:{{ csi_operator_image_tag }}",
                   "--registry-config=/root/.dockerconfigjson", "--insecure", -o, json]
          register: _csi_imginfo
          changed_when: false

        - name: Override csi_operator_img with the digest-pinned reference
          ansible.builtin.set_fact:
            csi_operator_img: "quay.io/samzhu/alibaba-cloud-csi-operator@{{ (_csi_imginfo.stdout | from_json).digest }}"

    # ── CAPA provider (single kustomize SSOT: provider repo config/default) ──
    # CRDs + RBAC + controller + admission webhooks all come from the provider
    # repo's config/default kustomize base — the SAME source clusterctl
    # (gen-clusterctl-components.sh) and the OLM bundle CRDs build from. They are
    # rendered + applied together below, AFTER the namespace + creds secret +
    # air-gap ITMS are in place (the Deployment's envFrom needs the secret, and the
    # ITMS must precede the controller image pull).
    - name: Ensure capa-system namespace exists (before the creds secret)
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", create, namespace, capa-system]
      register: _capa_ns
      changed_when: "'created' in (_capa_ns.stdout | default(''))"
      failed_when:
        - _capa_ns.rc != 0
        - "'AlreadyExists' not in (_capa_ns.stderr | default(''))"

    # Apsara: the SDK derives ecs.<region>.aliyuncs.com, which does not exist
    # there, so the controller could not create a single instance ("no such
    # host").  The provider reads these to override endpoint, scheme and the
    # tenancy headers; unset on public cloud, where the derived endpoints are
    # correct and the secret carries only the credentials as before.
    - name: "08 — Apsara environment for the CAPA controller"
      ansible.builtin.set_fact:
        _capa_apsara_env: >-
          {{ {
               'ALIBABA_CLOUD_SCHEME': 'HTTP',
               'ALIBABA_CLOUD_ENDPOINT_ECS': cloud_env.ENDPOINT_ECS | default(''),
               'ALIBABA_CLOUD_ENDPOINT_VPC': cloud_env.ENDPOINT_VPC | default(''),
               'ALIBABA_CLOUD_ORGANIZATION_ID': cloud_env.ORG_ID | default(''),
               'ALIBABA_CLOUD_RESOURCE_GROUP_ID': cloud_env.RG_ID | default(''),
               'ALIBABA_CLOUD_CALLER_SDK_SOURCE': cloud_env.CALLER_SDK_SOURCE | default('capi-alicloud'),
             } | dict2items | rejectattr('value', 'equalto', '') | list | items2dict
             if (cloud_platform | default('public')) == 'apsara' else {} }}

    - name: Create/update alibaba-creds secret for the CAPA controller (envFrom)
      ansible.builtin.shell: |
        oc --kubeconfig {{ kubeconfig_file }} create secret generic alibaba-creds \
          -n capa-system \
          --from-literal=ALIBABA_CLOUD_ACCESS_KEY_ID='{{ capa_ak }}' \
          --from-literal=ALIBABA_CLOUD_ACCESS_KEY_SECRET='{{ capa_sk }}' \
          {% for k, v in (_capa_apsara_env | dictsort) %}--from-literal={{ k }}='{{ v }}' \
          {% endfor %}--dry-run=client -o yaml | oc --kubeconfig {{ kubeconfig_file }} apply -f -
      register: _capa_secret
      changed_when: "'configured' in _capa_secret.stdout or 'created' in _capa_secret.stdout"
      no_log: true

    # envFrom is read at pod start, so an updated secret changes nothing until
    # the controller restarts — exactly the kind of "configured but not in
    # effect" gap this run kept hitting.
    - name: "08 — restart the CAPA controller so the new environment is picked up"
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, capa-system,
               rollout, restart, deployment/capa-controller-manager]
      when: (_capa_apsara_env | default({}) | length) > 0
      changed_when: true
      failed_when: false

    # Air-gap: the install-config emits only an ImageDigestMirrorSet
    # (imageDigestSources), which redirects pulls BY DIGEST. But our CAPA and CSI
    # manifests pin images BY TAG (capa :{{ capa_image_tag }}, csi :v1.35.3), so a
    # tag pull is NOT redirected and escapes to public quay.io — fine on nodes that
    # already cached the image, but on any node a pod is rescheduled to (scale /
    # rolling / drain / MHC remediation) the pull dials quay.io and times out
    # (capa-controller-manager stuck ImagePullBackOff, HA degraded; observed
    # 2026-06-11). Apply the companion ImageTagMirrorSet so tag pulls of these
    # mirrored repos also resolve to the mirror. No-op on non-air-gapped clusters
    # (mirror_private_ip empty). NOTE: like any IDMS/ITMS change, this is rendered
    # into registries.conf by the MCO and triggers a rolling node config update.
    - name: Apply ImageTagMirrorSet for tag-pinned CAPA/CSI mirror images
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", apply, -f, "-"]
      args:
        stdin: |
          apiVersion: config.openshift.io/v1
          kind: ImageTagMirrorSet
          metadata:
            name: samzhu-tag-mirror
          spec:
            imageTagMirrors:
              - source: quay.io/samzhu/openshift-capi-alicloud
                mirrors:
                  - {{ mirror_private_ip }}:8443/samzhu/openshift-capi-alicloud
              - source: quay.io/samzhu/alibaba-cloud-csi-operator
                mirrors:
                  - {{ mirror_private_ip }}:8443/samzhu/alibaba-cloud-csi-operator
              - source: quay.io/samzhu/alibaba-cloud-csi-operator-bundle
                mirrors:
                  - {{ mirror_private_ip }}:8443/samzhu/alibaba-cloud-csi-operator-bundle
              - source: quay.io/samzhu/alibaba-cloud-csi-operator-catalog
                mirrors:
                  - {{ mirror_private_ip }}:8443/samzhu/alibaba-cloud-csi-operator-catalog
              # CSI driver + 6 sidecars: the operator pulls these by tag from the
              # Aliyun ACR (tags hardcoded in the operator binary). Redirect the
              # whole acs/ namespace to the mirror so the driver Pods don't try to
              # reach the public registry (no egress in air-gap).
              - source: registry.cn-hangzhou.aliyuncs.com/acs
                mirrors:
                  - {{ mirror_private_ip }}:8443/acs
              # The CCM ships from a DIFFERENT host — registry-cn-hangzhou.ack.
              # aliyuncs.com, not registry.cn-hangzhou.aliyuncs.com — so the rule
              # above does not cover it, and 08d's -apsara tag is a tag pull that
              # the install-config's digest-only mirroring never redirects.
              # Without this the CCM pod sits in ErrImagePull reaching for the
              # public registry.
              - source: registry-cn-hangzhou.ack.aliyuncs.com/acs
                mirrors:
                  - {{ mirror_private_ip }}:8443/acs
      register: _itms_apply
      changed_when: "'unchanged' not in _itms_apply.stdout"
      when: mirror_private_ip | default('') | length > 0

    # Companion ImageDigestMirrorSet for the CAPA controller, which the digest-pin
    # block above pins BY DIGEST (quay.io/samzhu/openshift-capi-alicloud@sha256:..).
    # The ITMS only redirects TAG pulls, and the install-config IDMS only covers
    # the openshift release repos — so the CAPA digest pull is redirected by
    # NEITHER and escapes to public quay.io, where the mirror's manifest digest
    # does not exist ("manifest unknown" -> ImagePullBackOff; observed 2026-06-20
    # on the ABI multi-AZ cluster). IDMS redirects the digest pull to the mirror
    # (which has that exact digest, since the digest was resolved FROM the mirror).
    # Same digest+IDMS pattern 08a uses for the CAPI core image. No-op when the
    # mirror is disabled.
    # Both digest-pinned images belong in the SAME IDMS object: applying two
    # objects with the same metadata.name would leave whichever ran last, and
    # the other image would then pull from quay.io by digest — unreachable from
    # this VPC.
    - name: Apply ImageDigestMirrorSet for the digest-pinned CAPA + CSI images
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", apply, -f, "-"]
      args:
        stdin: |
          apiVersion: config.openshift.io/v1
          kind: ImageDigestMirrorSet
          metadata:
            name: samzhu-digest-mirror
          spec:
            imageDigestMirrors:
              - source: quay.io/samzhu/openshift-capi-alicloud
                mirrors:
                  - {{ mirror_private_ip }}:8443/samzhu/openshift-capi-alicloud
              - source: quay.io/samzhu/alibaba-cloud-csi-operator
                mirrors:
                  - {{ mirror_private_ip }}:8443/samzhu/alibaba-cloud-csi-operator
      register: _idms_capa_apply
      changed_when: "'unchanged' not in _idms_capa_apply.stdout"
      when: mirror_private_ip | default('') | length > 0

    # An IDMS/ITMS apply is not in force until the MCO has rendered it into every
    # node's registries.conf, and that rollout is serial. Everything below pulls
    # images that exist ONLY on the mirror, so going ahead while a pool is still
    # updating means those pulls escape to the public registry and fail there
    # ("manifest unknown"). Skipped when both applies were no-ops, which is the
    # normal case on a re-run.
    - ansible.builtin.include_tasks: ../tasks/wait_for_mirror_config.yml
      vars:
        wmc_changed: "{{ _itms_apply.changed | default(false)
                         or _idms_capa_apply.changed | default(false) }}"

    - name: Render CAPA deployment set from config/ kustomize (image override)
      # `oc kustomize` renders the provider repo's config/default SSOT (CRDs + RBAC
      # + controller + webhooks). The controller image is the only thing overridden:
      # sed swaps the placeholder TAG for {{ capi_provider_img }} (the mirror DIGEST
      # on air-gapped clusters, see the digest-pin block above).
      # Rendered on the operator host (delegate_to: local) from the controller's
      # repo checkout; only the apply below touches the cluster (on the jump host).
      # pipefail is essential: without it the pipeline's status comes from sed,
      # which happily returns 0 on empty input.  A missing capi_repo then renders
      # to an empty string, the task reports success, and the failure only
      # surfaces several tasks later as oc's opaque "no objects passed to apply".
      ansible.builtin.shell: |
        set -o pipefail
        oc kustomize '{{ capi_repo }}/config/default' \
          | sed 's|image: quay.io/samzhu/openshift-capi-alicloud:.*|image: {{ capi_provider_img }}|'
      args:
        executable: /bin/bash
      delegate_to: local
      register: capa_rendered
      changed_when: false

    - name: "08 — the CAPA render must not be empty"
      ansible.builtin.assert:
        that: (capa_rendered.stdout | default('') | trim | length) > 0
        fail_msg: >-
          Rendering CAPA from {{ capi_repo }}/config/default produced nothing.
          That repo is a SIBLING checkout of this one — run 00a-prepare-operator
          (it clones the companion repos), or clone it next to this repo:
          git clone https://github.com/SammZhu/openshift-capi-alicloud.git

    - name: Apply CAPA deployment set (CRDs + RBAC + controller + webhooks)
      # Server-side apply so the service-ca-injected webhook caBundle is not
      # clobbered on re-apply (--force-conflicts resolves field ownership). The
      # controller's webhook server reads its serving cert at
      # /tmp/k8s-webhook-server/serving-certs/tls.crt, minted by service-ca once the
      # webhook Service (in this set) exists.
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", apply, --server-side=true,
               --force-conflicts, -f, "-"]
      args:
        stdin: "{{ capa_rendered.stdout }}"
      register: capa_apply
      changed_when: "'unchanged' not in capa_apply.stdout"

    # ── CAPA metrics (G11) ────────────────────────────────────────────────
    - name: Check for the Prometheus Operator ServiceMonitor CRD
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", get, crd,
               servicemonitors.monitoring.coreos.com]
      register: _servicemonitor_crd
      changed_when: false
      failed_when: false

    - name: Render CAPA metrics overlay (config/metrics)
      ansible.builtin.command:
        argv: [oc, kustomize, "{{ capi_repo }}/config/metrics"]
      delegate_to: local
      register: capa_metrics_rendered
      changed_when: false
      when: _servicemonitor_crd.rc == 0

    - name: Apply CAPA metrics Service + ServiceMonitor
      # Wires the controller's :8080 metrics endpoint into OpenShift monitoring.
      # Guarded on the monitoring.coreos.com CRD (always present on OpenShift);
      # skipped on a cluster without the Prometheus Operator so the run stays green.
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", apply, -f, "-"]
      args:
        stdin: "{{ capa_metrics_rendered.stdout }}"
      register: capa_metrics_apply
      changed_when: "'unchanged' not in capa_metrics_apply.stdout"
      when: _servicemonitor_crd.rc == 0

    # ── CSI operator ──────────────────────────────────────────────────────
    # Rendered on the operator host (delegate_to: local) with `oc kustomize`
    # (RHEL8 has oc, not a standalone kustomize binary). The controller image is
    # the only override: sed swaps the placeholder TAG for {{ csi_operator_img }}
    # (the ITMS above redirects that tag pull to the mirror on air-gapped clusters).
    # No `kustomize edit` — that would dirty the repo working tree.
    - name: Render CSI operator kustomize (image override)
      ansible.builtin.shell: >
        oc kustomize '{{ csi_repo }}/config/default'
        | sed 's|image: quay.io/samzhu/alibaba-cloud-csi-operator:.*|image: {{ csi_operator_img }}|'
      delegate_to: local
      register: csi_rendered
      changed_when: false

    - name: Apply CSI operator
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", apply, -f, "-"]
      args:
        stdin: "{{ csi_rendered.stdout }}"
      register: csi_apply
      changed_when: "'unchanged' not in csi_apply.stdout"

    # ── Air-gap: point CSI operand (sidecar) images at the mirror ─────────────
    # The operator defaults its external CSI sidecars to upstream
    # registry.k8s.io/sig-storage digests (so a direct / operatorhub.io install
    # works on vanilla Kubernetes). On the air-gap path the mirror serves these
    # under registry.cn-hangzhou.aliyuncs.com/acs/<name>:<tag> (04-prepare-mirror
    # Group A in-region + Group B cross-border re-tag), and the cluster's IDMS/ITMS
    # redirects acs/* → mirror. Override the operator's RELATED_IMAGE_* env to those
    # acs refs so the sidecars resolve via the mirror. No-op on non-air-gap clusters.
    - name: Air-gap — override CSI operand images via RELATED_IMAGE_* env
      when: mirror_private_ip is defined and (mirror_private_ip | string | length) > 0
      ansible.builtin.command:
        argv:
          - oc
          - --kubeconfig
          - "{{ kubeconfig_file }}"
          - -n
          - alibaba-cloud-csi-operator-system
          - set
          - env
          - deployment/alibaba-cloud-csi-operator-controller-manager
          - RELATED_IMAGE_CSI_PROVISIONER=registry.cn-hangzhou.aliyuncs.com/acs/csi-provisioner:v3.5.0
          - RELATED_IMAGE_CSI_ATTACHER=registry.cn-hangzhou.aliyuncs.com/acs/csi-attacher:v4.3.0
          - RELATED_IMAGE_CSI_RESIZER=registry.cn-hangzhou.aliyuncs.com/acs/csi-resizer:v1.8.0
          - RELATED_IMAGE_CSI_SNAPSHOTTER=registry.cn-hangzhou.aliyuncs.com/acs/csi-snapshotter:v6.3.0
          - RELATED_IMAGE_CSI_NODE_DRIVER_REGISTRAR=registry.cn-hangzhou.aliyuncs.com/acs/csi-node-driver-registrar:v2.8.0
          - RELATED_IMAGE_LIVENESSPROBE=registry.cn-hangzhou.aliyuncs.com/acs/livenessprobe:v2.10.0
      register: csi_relimg_env
      changed_when: "'updated' in csi_relimg_env.stdout"

    # The CR below is inert without the operator: it is the operator that turns
    # spec.disk.storageClasses into StorageClasses. Applying the CR while the
    # operator is down SUCCEEDS, reconciles nothing, and the failure then surfaces
    # five minutes later at the StorageClass guard — which reports a StorageClass
    # problem and points at csi_storageclass_recreate, a remedy for drift that
    # cannot help when nothing was ever created. That is what happened on
    # 2026-09-08: the operator sat in ImagePullBackOff behind a registries.conf
    # rollout that had not reached any node yet, and the guard blamed the classes.
    # Fail here instead, where the cause is, and say what the operator is doing.
    - name: "08 — the CSI operator must be running before its CR means anything"
      block:
        - name: "08 — wait for the CSI operator rollout"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n,
                   alibaba-cloud-csi-operator-system, rollout, status,
                   deployment/alibaba-cloud-csi-operator-controller-manager,
                   "--timeout={{ csi_operator_rollout_timeout | default('300s') }}"]
          changed_when: false
      rescue:
        - name: "08 — collect why the CSI operator is not Available"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n,
                   alibaba-cloud-csi-operator-system, get, pods, -o, wide]
          register: _csi_op_pods
          changed_when: false
          failed_when: false

        - name: "08 — the CSI operator never became Available"
          ansible.builtin.fail:
            msg: |
              The CSI operator deployment did not become Available, so nothing
              downstream of it can work: the CR would apply cleanly, create no
              StorageClasses, and provision no volumes.

              {{ _csi_op_pods.stdout | default('(could not list pods)') }}

              ImagePullBackOff on a {{ mirror_private_ip | default('mirror') }}
              image usually means the IDMS/ITMS has not reached the nodes yet —
              check `oc get mcp` for a pool still updating, and see
              tasks/wait_for_mirror_config.yml.

    - name: Wait for AlibabaCloudCSIDriver CRD Established
      ansible.builtin.command:
        argv:
          - oc
          - --kubeconfig
          - "{{ kubeconfig_file }}"
          - wait
          - --for=condition=Established
          - --timeout=120s
          - crd/alibabacloudcsidrivers.csi.alibabacloud.com
      changed_when: false

    - name: Apply CSI driver CR
      # Rendered as a template (lookup runs on the operator host) so spec.ecsEndpoint
      # picks up the cluster region from state.yml; piped to the jump host's oc.
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", apply, -f, "-"]
      args:
        stdin: "{{ lookup('template', deploy_repo + '/custom_manifests/04-csi-driver-cr.yaml') }}"
      register: csi_cr
      changed_when: "'unchanged' not in csi_cr.stdout"

    - name: "08 — read the CR back (authoritative for the comparison below)"
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", get, alibabacloudcsidriver,
               cluster, -o, json]
      register: csi_cr_readback
      changed_when: false

    # A StorageClass's parameters are IMMUTABLE, so the operator cannot move an
    # existing class onto a new disk category — it leaves the old one in place and
    # says nothing.  Changing system_disk_category therefore updated the CR, went
    # green everywhere, and left the cluster provisioning the old category: the
    # same "configured but not in effect" trap as the stale agent image and the
    # leftover openshift/ manifests.  Compare and refuse to pass silently.
    # Wait before judging.  On a fresh install the CR has only just been applied
    # and the operator has not reconciled the StorageClasses into existence yet —
    # "absent" then means "not created YET", not "configured but not in effect".
    # Without this the check races the operator and fails an install that is
    # perfectly fine: the classes appeared, with the right category, seconds
    # later.  A check meant to catch silent no-ops must not invent loud ones.
    - name: "08 — wait for the operator to reconcile the disk StorageClasses"
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", get, storageclass, -o, json]
      register: _sc_settle
      changed_when: false
      retries: "{{ csi_storageclass_settle_retries | default(30) }}"
      delay: 10
      # No {{ }} here: a conditional is already an expression.  Wrapped, Ansible
      # warns and evaluates the rendered *string* — which is how a check like
      # this quietly becomes always-true and stops guarding anything.
      until: >-
        ((_sc_settle.stdout | default('{}') | from_json)['items'] | default([]))
        | selectattr('metadata.name', 'in', _decl_names) | list | length
        == (_decl_names | length)
      failed_when: false
      vars:
        _decl_names: >-
          {{ (((csi_cr_readback.stdout | default('{}') | from_json).spec | default({})).disk.storageClasses
              | default([])) | map(attribute='name') | list }}

    - name: "08 — read back the disk StorageClasses against the CR"
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", get, storageclass, -o, json]
      register: _sc_readback
      changed_when: false

    # What the CR declares.  ['items'] / explicit keys throughout — on a dict,
    # .items resolves to the builtin method, which is how this check first died.
    - name: "08 — what the CR declares vs what the cluster has"
      ansible.builtin.set_fact:
        _sc_decl_names: "{{ _decl | map(attribute='name') | list }}"
        _sc_decl_types: "{{ _decl | map(attribute='type') | list }}"
        _sc_live_names: "{{ _live | map(attribute='metadata.name') | list }}"
      vars:
        _decl: "{{ ((csi_cr_readback.stdout | default('{}') | from_json).spec | default({})).disk.storageClasses | default([]) }}"
        _live: "{{ (_sc_readback.stdout | from_json)['items'] | selectattr('parameters.type', 'defined') | list }}"

    # Two ways the cluster can disagree with the CR, both silent:
    #   drifted — the class exists with the previous disk category.  Parameters
    #     are IMMUTABLE, so the operator cannot update it in place; it leaves the
    #     old one and says nothing.
    #   missing — declared but absent (e.g. deleted to fix drift).  The operator
    #     creates classes only while reconciling the CR, and deleting one does
    #     not trigger that, so it simply stays gone.
    # Checking only the first is what let an empty result read as "all fine"
    # while in fact all three classes had vanished.
    - name: "08 — find drifted and missing disk StorageClasses"
      ansible.builtin.set_fact:
        _sc_drift: >-
          {{ (_sc_readback.stdout | from_json)['items']
             | selectattr('parameters.type', 'defined')
             | selectattr('metadata.name', 'in', _sc_decl_names)
             | rejectattr('parameters.type', 'in', _sc_decl_types)
             | map(attribute='metadata.name') | list }}
        _sc_missing: "{{ _sc_decl_names | reject('in', _sc_live_names) | list }}"

    - name: "08 — reconcile the disk StorageClasses with the CR"
      when: (_sc_drift | length > 0) or (_sc_missing | length > 0)
      block:
        - name: "08 — the disk StorageClasses do not match the CR"
          ansible.builtin.assert:
            that: false
            # Two causes, two different remedies. Offering the drift remedy for
            # a missing class sends the next person to delete classes that are
            # not there and wait again on an operator that never reconciled —
            # which is exactly the wrong move when the operator itself is down.
            fail_msg: >-
              {% if _sc_drift | length %}{{ _sc_drift | join(', ') }} still carry the
              previous disk category (parameters are immutable, so the operator
              cannot update them in place). Re-run with
              csi_storageclass_recreate=true to delete them and nudge the
              operator into recreating them.{% endif %}
              {% if _sc_missing | length %}{{ _sc_missing | join(', ') }} are declared
              in the CR but absent from the cluster. The operator creates classes
              only while reconciling the CR, so the reconcile never produced them
              — look at the operator itself
              (oc -n alibaba-cloud-csi-operator-system get pods, then its log)
              before touching any class. csi_storageclass_recreate does NOT help
              here: it deletes drifted classes, and there is nothing to
              delete.{% endif %}
              The cluster would keep provisioning the old category, or nothing at
              all, while every task here reports success.
          when: not (csi_storageclass_recreate | default(false) | bool)

        - name: "08 — delete the drifted StorageClasses (they hold no data)"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", delete, storageclass, "{{ item }}"]
          loop: "{{ _sc_drift }}"
          changed_when: true

        # Deleting a StorageClass does not make the operator notice: it reconciles
        # on CR changes, so the classes stay gone until something touches the CR.
        - name: "08 — nudge the CSI operator into reconciling"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", annotate,
                   alibabacloudcsidriver, cluster, --overwrite,
                   "csi.alibabacloud.com/reconciled-by-ansible={{ lookup('pipe', 'date -u +%FT%TZ') }}"]
          changed_when: true

        - name: "08 — wait for every declared StorageClass to exist with the CR's category"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", get, storageclass, -o, json]
          register: _sc_recheck
          changed_when: false
          retries: 30
          delay: 5
          until: >-
            {{ ((_sc_recheck.stdout | default('{}') | from_json)['items'] | default([]))
               | selectattr('parameters.type', 'defined')
               | selectattr('metadata.name', 'in', _sc_decl_names)
               | selectattr('parameters.type', 'in', _sc_decl_types)
               | list | length == (_sc_decl_names | length) }}

    # The CSI driver otherwise authenticates with the node RAM role's STS token,
    # and on Apsara its DescribeSnapshots then comes back empty — which the
    # driver's waiter reads as "snapshot gone" and turns into a nil dereference
    # that takes the whole driver down.  The same call with a static AccessKey
    # returns the snapshot correctly, and the provider chain puts env AK/SK ahead
    # of the RAM role, so pointing the driver at a key moves it off the token.
    #
    # In a Secret rather than the CR: extraEnv accepts secretKeyRef precisely so
    # credentials do not sit in plain text in a cluster-scoped object.
    - name: "08 — credentials Secret for the CSI driver (apsara)"
      ansible.builtin.shell: |
        oc --kubeconfig {{ kubeconfig_file }} create secret generic alibaba-csi-creds \
          -n kube-system \
          --from-literal=access_key_id='{{ capa_ak }}' \
          --from-literal=access_key_secret='{{ capa_sk }}' \
          --dry-run=client -o yaml | oc --kubeconfig {{ kubeconfig_file }} apply -f -
      args:
        executable: /bin/bash
      register: _csi_creds
      changed_when: "'configured' in _csi_creds.stdout or 'created' in _csi_creds.stdout"
      no_log: true
      when: (cloud_platform | default('public')) == 'apsara'

    # ── NAS StorageClass (filesystem-mode dynamic provisioning) ───────────────
    # The CR sets nas.storageClasses=[] so the operator deploys the NAS driver but
    # creates no StorageClass — a provisionable NAS SC needs cluster-network params
    # the operator can't know. Apply it here, filled from state.yml's vpc/vSwitch/
    # zone. Gated on those being present, so it is a safe no-op if state lacks them
    # (NAS just stays unprovisioned; the deploy never fails). StorageClass params
    # are immutable, so this is created once; delete the SC to change params.

    # The CCM manifest is baked into the agent ISO at install time, so it cannot
    # carry credentials — the same reason the CSI driver's live in a Secret.  The
    # namespace is created by that manifest, so this runs after it exists; on a
    # fresh install the CCM pod waits in CreateContainerConfigError until this
    # lands, which is visible and self-explanatory rather than silent.
    - name: "08 — credentials Secret for the CCM (apsara)"
      ansible.builtin.include_tasks: ../tasks/ccm_credentials_secret.yml
      vars:
        ccm_secret_caller: "08"
        # 08 runs whether or not the CCM was ever deployed, so a missing
        # namespace is expected rather than a failure.
        _ccm_secret_optional: true
      when:
        - (cloud_platform | default('public')) == 'apsara'
        - ccm_enabled | default(false) | bool
        - ccm_static_credentials | default(true) | bool
    - name: Apply NAS StorageClass (filesystem-mode, dynamic provisioning)
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", apply, -f, "-"]
      args:
        stdin: |
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: alicloud-nas-performance
          provisioner: nasplugin.csi.alibabacloud.com
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          # Immediate: RWX NAS has no node affinity (unlike WaitForFirstConsumer disk).
          volumeBindingMode: Immediate
          parameters:
            volumeAs: filesystem
            fileSystemType: standard
            storageType: Performance
            regionId: "{{ region }}"
            zoneId: "{{ nas_zone_id }}"
            vpcId: "{{ nas_vpc_id }}"
            vSwitchId: "{{ nas_vsw_id }}"
      register: nas_sc
      changed_when: "'unchanged' not in nas_sc.stdout"
      when:
        # Gate on the service existing before the network params: without this
        # the class was created on dyz7, where there is no NAS at all, and the
        # only symptom was 13's RWX check failing with a misleading reason.
        - nas_available | default(true) | bool
        - nas_vpc_id | default('') | length > 0
        - nas_vsw_id | default('') | length > 0
        - nas_zone_id | default('') | length > 0

    # ── OADP / OSS backup (optional, opt-in via oadp_enabled) ─────────────────
    # Deploys the OADP operator (OLM Subscription from redhat-operators), then —
    # only if backup credentials are supplied — the cloud-credentials Secret and
    # the DataProtectionApplication (both rendered from oadp_* vars via stdin, so
    # the AK/SK never lands on disk). Air-gap: the redhat-oadp-operator package
    # must already be in the private mirror (build-mirror-tarball.sh OADP_MIRROR=true).
    - name: Apply OADP operator Subscription
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", apply, -f, "-"]
      args:
        stdin: "{{ lookup('file', deploy_repo + '/custom_manifests/05-oadp-subscription.yaml') }}"
      register: oadp_sub
      changed_when: "'unchanged' not in oadp_sub.stdout"
      when: oadp_enabled | default(false) | bool

    - name: Wait for DataProtectionApplication CRD Established
      ansible.builtin.command:
        argv:
          - oc
          - --kubeconfig
          - "{{ kubeconfig_file }}"
          - wait
          - --for=condition=Established
          - --timeout=300s
          - crd/dataprotectionapplications.oadp.openshift.io
      register: oadp_crd_wait
      retries: 10
      delay: 15
      until: oadp_crd_wait.rc == 0
      changed_when: false
      when: oadp_enabled | default(false) | bool

    - name: Apply OADP OSS credentials Secret (rendered via stdin, never on disk)
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", apply, -f, "-"]
      args:
        stdin: "{{ lookup('template', deploy_repo + '/custom_manifests/05-oadp-oss-credentials.yaml.j2') }}"
      register: oadp_creds
      changed_when: "'unchanged' not in oadp_creds.stdout"
      no_log: true
      when:
        - oadp_enabled | default(false) | bool
        - oadp_oss_access_key_id | default('') | length > 0

    - name: Apply DataProtectionApplication (rendered from oadp_* vars)
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", apply, -f, "-"]
      args:
        stdin: "{{ lookup('template', deploy_repo + '/custom_manifests/05-oadp-dpa.yaml.j2') }}"
      register: oadp_dpa
      changed_when: "'unchanged' not in oadp_dpa.stdout"
      when:
        - oadp_enabled | default(false) | bool
        - oadp_oss_access_key_id | default('') | length > 0

    - name: OADP operator deployed without backup credentials (subscription only)
      ansible.builtin.debug:
        msg: >
          OADP operator installed but oadp_oss_access_key_id is empty — skipped the
          cloud-credentials Secret and DataProtectionApplication. Set
          oadp_oss_access_key_id / _secret (dedicated backup RAM user) and re-run
          08 to finish the backup wiring.
      when:
        - oadp_enabled | default(false) | bool
        - oadp_oss_access_key_id | default('') | length == 0

    # ── Pin ingress to the nodes the load balancer actually forwards to ───────
    # The *.apps CLB's backend set is fixed when the stack is created:
    # WorkerInstance1/2 with EnableSplitWorkers, the three masters without.  The
    # routers must run on exactly those nodes, because the CLB forwards 80/443
    # there and nowhere else.
    #
    # Nothing enforces that by itself.  Once phase 12 adds CAPA workers the
    # cluster has a third class of node — schedulable, labelled worker, and NOT
    # in the ServerGroup — and a router that lands on one is invisible to the
    # load balancer: the CLB keeps forwarding to the install-time workers, finds
    # no router, and returns 503 for a share of requests.  Pin before phase 12
    # runs, not after.
    #
    # Skipped entirely on the default topology, where the masters are the backend
    # set and are also the only nodes: pinning to a label nothing carries would
    # make every router unschedulable and take ingress down.
    - name: "08 — pin ingress to the load balancer's backend nodes"
      when: split_ingress_workers | default(false) | bool
      block:
        - name: "08 — find the install-time workers"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", get, nodes,
                   -o, 'jsonpath={range .items[*]}{.metadata.name}{"\n"}{end}']
          register: _ing_nodes
          changed_when: false

        - name: "08 — the backend nodes must exist before anything is pinned to them"
          vars:
            _want: "{{ [cluster_name ~ '-worker-1', cluster_name ~ '-worker-2'] }}"
            _have: "{{ _ing_nodes.stdout_lines | map('trim') | select | list }}"
          ansible.builtin.assert:
            that: _want | difference(_have) | length == 0
            fail_msg: |
              {{ _want | difference(_have) | join(', ') }} is not in the cluster,
              but split_ingress_workers is on and the CLB forwards *.apps to it.

              Pinning ingress to nodes that do not exist makes every router
              unschedulable and takes ingress down, so this stops here instead.

              Nodes present: {{ _have | join(', ') }}
              If the workers were never installed, check that 06 harvested their
              MACs (abi_worker_macs in state.yml) and that agent-config carried a
              host entry per worker.
          quiet: true

        - name: "08 — label the backend nodes"
          # A dedicated label, not node-role.kubernetes.io/infra: the fact being
          # recorded is "the load balancer forwards to this node", which is not
          # what the infra role means, and infra carries subscription and taint
          # semantics this does not implement.
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", label, node,
                   "{{ item }}", "openshift-ingress-backend=true", --overwrite]
          loop: "{{ [cluster_name ~ '-worker-1', cluster_name ~ '-worker-2'] }}"
          register: _ing_label
          changed_when: "'labeled' in (_ing_label.stdout | default(''))"

        - name: "08 — pin the default IngressController to them"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n,
                   openshift-ingress-operator, patch, ingresscontroller, default,
                   --type, merge, -p,
                   '{"spec":{"nodePlacement":{"nodeSelector":{"matchLabels":{"openshift-ingress-backend":"true"}}}}}']
          register: _ing_patch
          changed_when: "'no change' not in (_ing_patch.stdout | default(''))"

        - name: "08 — wait for the routers to move"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, openshift-ingress,
                   rollout, status, deploy/router-default, --timeout=300s]
          changed_when: false

        # The patch reporting success proves only that the object was accepted.
        # Confirm the routers are actually ON the backend nodes -- otherwise this
        # whole block is another "green but did nothing", and the symptom would be
        # intermittent 503s that look like a load balancer fault.
        - name: "08 — read back where the routers are running"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, openshift-ingress,
                   get, pods, -l, "ingresscontroller.operator.openshift.io/deployment-ingresscontroller=default",
                   -o, 'jsonpath={range .items[*]}{.spec.nodeName}{"\n"}{end}']
          register: _ing_where
          changed_when: false

        - name: "08 — every router must be on a backend node"
          vars:
            _want: "{{ [cluster_name ~ '-worker-1', cluster_name ~ '-worker-2'] }}"
            _on: "{{ _ing_where.stdout_lines | map('trim') | select | list | unique }}"
          ansible.builtin.assert:
            that:
              - _on | length > 0
              - _on | difference(_want) | length == 0
            fail_msg: >-
              Routers are running on {{ _on | join(', ') | default('(none)', true) }},
              which is not the load balancer's backend set
              ({{ _want | join(', ') }}). The CLB forwards *.apps only to the
              backend nodes, so requests reaching a router elsewhere never
              arrive and requests to a backend without a router return 503.
            quiet: true

        - name: "08 — ingress pinned"
          ansible.builtin.debug:
            msg: "routers on {{ _ing_where.stdout_lines | map('trim') | select | list | unique | join(', ') }} (the CLB backend set)"

    - name: Phase 08 done
      ansible.builtin.debug:
        msg: |
          ✓ CAPI provider, CSI operator, CSI driver CR all applied
            (driven from operator → executed on {{ 'jump host ' ~ ansible_host if (_dh_via_jump | default(false) | bool) else 'the operator host' }}).

          {% if oadp_enabled | default(false) | bool %}✓ OADP operator applied{% if oadp_oss_access_key_id | default('') | length > 0 %} + cloud-credentials + DataProtectionApplication (OSS backup → {{ oadp_oss_bucket }}){% else %} (subscription only — set oadp_oss_access_key_id to finish){% endif %}
          {% endif %}
          Verify{{ ' on the jump host' if (_dh_via_jump | default(false) | bool) else '' }}:
          {% if _dh_via_jump | default(false) | bool %}  ssh root@{{ ansible_host }}
          {% endif %}  oc --kubeconfig=/root/kubeconfig get pods -n capa-system
