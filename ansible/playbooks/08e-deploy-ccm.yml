---
# 08e — deploy the Alibaba CCM onto an already-installed cluster.
#
# The manifest is normally baked into the agent ISO at install time (07), so a
# cluster installed with ccm_enabled=false has no way to gain it later.  This
# renders the same template and applies it live.  For a fresh install this play
# is not needed: set ccm_enabled (now the default) and 07 does it.
#
# It lands the Deployment at replicas=0 and stops.  The CCM's node controller
# resolves Nodes by providerID; whether it deletes a Node it cannot find in the
# cloud could NOT be established from the binary, and a wrong endpoint is
# exactly the state this change exists to fix.  So: apply, read back what
# actually landed, and scale up only on a second, deliberate run.
#
#   ansible-playbook playbooks/08e-deploy-ccm.yml -e ccm_image_tag=v2.14.0-apsara
#   # read the summary, then:
#   ansible-playbook playbooks/08e-deploy-ccm.yml -e ccm_image_tag=v2.14.0-apsara -e ccm_scale_up=true
#
# Prerequisites: 08d built the image, and cloud_env carries ENDPOINT_SLB.
- name: Resolve the deploy host (08e runs standalone)
  hosts: local
  gather_facts: false
  tasks:
    - ansible.builtin.include_tasks: ../tasks/load_state.yml
    - ansible.builtin.include_tasks: ../tasks/deploy_host.yml

    # The CCM's credentials Secret needs these, same as 08's does.
    - name: "08e — resolve Alibaba AK/SK"
      ansible.builtin.include_tasks: ../tasks/resolve_ak_sk.yml

    # Without this the second play matches no hosts and is skipped in silence —
    # a green run that did nothing at all, which is the failure mode this
    # project keeps meeting.  deploy_host.yml resolves _dh_host/_dh_connection;
    # turning that into an inventory entry is the caller's job.
    - name: "08e — add the deploy host to the inventory"
      ansible.builtin.add_host:
        name: jumphost
        ansible_host: "{{ _dh_host }}"
        ansible_connection: "{{ _dh_connection }}"
        ansible_user: root
        ansible_ssh_private_key_file: "{{ ssh_priv_key_file }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15"
        groups: deploy
        capa_ak: "{{ _ak }}"
        capa_sk: "{{ _sk }}"
        mirror_private_ip: "{{ mirror_private_ip | default('') }}"
        # The cloud.conf ConfigMap is rendered in play two and needs the
        # cluster's network identifiers, which only exist in state.yml on the
        # operator.
        mirror_vpc_id: "{{ mirror_vpc_id | default('') }}"
        mirror_zone_id: "{{ mirror_zone_id | default('') }}"
        mirror_private_vsw_1: "{{ mirror_private_vsw_1 | default('') }}"
        # 08d records this in state.yml, which only play one reads — state facts
        # do not cross to a host added with add_host, so without carrying it the
        # manifest silently renders the tag instead of the digest.
        ccm_image_digest: "{{ ccm_image_digest | default('') }}"
      no_log: true

    # An empty group means the next play matches nothing and Ansible skips it
    # without a word — the run ends failed=0 having done nothing.  Cheaper to
    # catch here than to notice that a "successful" deploy changed nothing.
    - name: "08e — the deploy host must be in the inventory"
      ansible.builtin.assert:
        that: (groups['deploy'] | default([])) | length > 0
        fail_msg: >-
          add_host did not register a deploy host, so the play that does the
          work would be skipped silently.  Check _dh_host / _dh_connection from
          tasks/deploy_host.yml.
        quiet: true

- name: Deploy the Alibaba CCM (executed on the deploy host)
  hosts: jumphost
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../vars/images.yml"
  vars:
    ccm_enabled: true
    ccm_scale_up: false
    kubeconfig_file: /root/kubeconfig
    _ccm_ns: alibaba-cloud-controller-manager
    # The Deployment and the ServiceAccount have different names in the
    # manifest (alibaba-cloud-controller-manager vs cloud-controller-manager);
    # naming it once here stops the wrong one being used by habit.
    _ccm_deploy: alibaba-cloud-controller-manager
  tasks:
    - name: "08e — running on the deploy host"
      ansible.builtin.debug:
        msg: "deploy host = {{ inventory_hostname }} ({{ ansible_host | default('local') }})"

    - name: "08e — kubeconfig must be present"
      ansible.builtin.stat:
        path: "{{ kubeconfig_file }}"
      register: _ccm_kc
      failed_when: not _ccm_kc.stat.exists

    # Fail here rather than three steps later with an empty env var: without it
    # the CCM resolves slb.<region>.aliyuncs.com, which does not exist on
    # Apsara, and the symptom is an endless "no such host" in the controller log.
    - name: "08e — the SLB endpoint must be configured"
      ansible.builtin.assert:
        that: (cloud_env.ENDPOINT_SLB | default('')) | length > 0
        fail_msg: >-
          cloud_env.ENDPOINT_SLB is not set.  The CCM cannot reach SLB without
          it (dyz7: slb-vpc.cloud.dyz7.com — find yours with
          scripts/apsara/probe-endpoints.sh <domain>).  Add it to
          group_vars/all.yml under cloud_env and re-run.
        quiet: true
      when: (cloud_platform | default('public')) == 'apsara'

    - name: "08e — the image tag must be one built for this platform"
      ansible.builtin.assert:
        that: ccm_image_tag is search('-apsara')
        fail_msg: >-
          ccm_image_tag is "{{ ccm_image_tag }}".  Upstream images cannot decode
          this gateway's LoadBalancer.Tags — run 08d and pass the tag it prints
          (-e ccm_image_tag=v2.14.0-apsara).
        quiet: true
      when: (cloud_platform | default('public')) == 'apsara'

    # Take our own backup regardless of what was taken by hand: this play is the
    # thing that could lose Nodes, so the backup should be tied to running it.
    - name: "08e — back up the Node objects"
      ansible.builtin.shell:
        cmd: >-
          oc --kubeconfig {{ kubeconfig_file }} get nodes -o yaml
          > /root/nodes-before-ccm-{{ ansible_date_time.iso8601_basic_short }}.yaml
      args:
        executable: /bin/bash
      changed_when: true

    - name: "08e — record the Nodes as they are now (compared after scale-up)"
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", get, nodes,
               -o, 'jsonpath={range .items[*]}{.metadata.name}{" "}{.spec.providerID}{"\n"}{end}']
      register: _ccm_nodes_before
      changed_when: false

    # Rendered on the controller with lookup(), not written to a file: the repo
    # lives on the operator while these tasks run on the deploy host, and a
    # file-then-read dance across the two is how a play ends up applying
    # something other than what it rendered.
    - name: "08e — render the CCM manifest"
      ansible.builtin.set_fact:
        _ccm_yaml: "{{ lookup('template', playbook_dir + '/../../custom_manifests/01-alibaba-ccm.yaml.j2') }}"

    # Same guard 07 applies to the installed copy: an unrendered {{ }} would
    # deploy a CCM that cannot reach the API server.
    - name: "08e — the render must have no template residue"
      ansible.builtin.assert:
        that:
          - _ccm_yaml is not search('\\{\\{')
          - _ccm_yaml is search('image:.*cloud-controller-manager')
        fail_msg: "the rendered manifest is not what it should be"
        quiet: true

    - name: "08e — force replicas to 0 for the first apply"
      ansible.builtin.set_fact:
        _ccm_yaml: "{{ _ccm_yaml | regex_replace('(?m)^(\\s*replicas:)\\s*\\d+\\s*$', '\\1 0') }}"
      when: not (ccm_scale_up | bool)

    - name: "08e — apply the manifest"
      ansible.builtin.shell:
        cmd: "oc --kubeconfig {{ kubeconfig_file }} apply -f -"
        stdin: "{{ _ccm_yaml }}"
      args:
        executable: /bin/bash
      register: _ccm_apply
      changed_when: "'unchanged' not in _ccm_apply.stdout"

    # The CCM mounts cloud.conf from this ConfigMap and will not start without
    # it — the pod sits in ContainerCreating on "configmap not found", which
    # reads like a scheduling problem rather than a missing object.  It is
    # normally baked into the ISO alongside the Deployment, so the retrofit path
    # has to bring it too.
    - name: "08e — cloud.conf ConfigMap"
      ansible.builtin.shell:
        cmd: "oc --kubeconfig {{ kubeconfig_file }} apply -f -"
        stdin: "{{ lookup('template', playbook_dir + '/../templates/alibaba-ccm-config.yaml.j2') }}"
      args:
        executable: /bin/bash
      register: _ccm_cfg
      changed_when: "'unchanged' not in _ccm_cfg.stdout"

    # The image is pulled by tag, and tag pulls are redirected by an
    # ImageTagMirrorSet — the install-config only mirrors digests.  The CCM also
    # ships from registry-cn-hangzhou.ack.aliyuncs.com, a different host from the
    # registry.cn-hangzhou.aliyuncs.com that 08's rule covers, so neither applies
    # and the pull escapes to the public registry.  Applied under its own name so
    # it does not fight 08's.
    #
    # Note this makes the MCO rewrite registries.conf and roll the nodes.
    - name: "08e — ImageTagMirrorSet for the CCM image"
      ansible.builtin.shell:
        cmd: "oc --kubeconfig {{ kubeconfig_file }} apply -f -"
        stdin: |
          apiVersion: config.openshift.io/v1
          kind: ImageTagMirrorSet
          metadata:
            name: ccm-tag-mirror
          spec:
            imageTagMirrors:
              - source: registry-cn-hangzhou.ack.aliyuncs.com/acs
                mirrors:
                  - {{ mirror_private_ip }}:8443/acs
      args:
        executable: /bin/bash
      register: _ccm_itms
      changed_when: "'unchanged' not in _ccm_itms.stdout"
      when: mirror_private_ip | default('') | length > 0

    - name: "08e — credentials Secret"
      ansible.builtin.include_tasks: ../tasks/ccm_credentials_secret.yml
      vars:
        ccm_secret_caller: "08e"
      when: ccm_static_credentials | default(true) | bool

    # Read back what the cluster actually has, not what we think we sent.  The
    # recurring failure here is a step that reports success while the running
    # object still holds the old value.
    - name: "08e — read the env back off the Deployment"
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, "{{ _ccm_ns }}",
               get, deploy, "{{ _ccm_deploy }}",
               -o, 'jsonpath={.spec.template.spec.containers[0].image}{"\n"}{range .spec.template.spec.containers[0].env[*]}{.name}={.value}{"\n"}{end}']
      register: _ccm_env
      changed_when: false

    - name: "08e — what landed"
      ansible.builtin.debug:
        msg: |
          {{ _ccm_env.stdout }}
          Check before scaling up:
            - image ends in -apsara (an upstream image cannot decode Tags here)
            - SLB_/ECS_/VPC_ENDPOINT are private-cloud hostnames, not *.aliyuncs.com
            - ALICLOUD_CLIENT_SCHEME=HTTP (the gateway's CA is not in the pod)
          Credentials come from a Secret, so they do not appear above.

    - name: "08e — stopped at replicas=0"
      ansible.builtin.debug:
        msg: |
          The CCM is applied but NOT running.  Nothing has touched the Nodes.
          When the readback above is right:
            ansible-playbook playbooks/08e-deploy-ccm.yml \
              -e ccm_image_tag={{ ccm_image_tag }} -e ccm_scale_up=true
          Watch, in another shell:
            oc -n {{ _ccm_ns }} logs -f deploy/{{ _ccm_deploy }}
            oc get nodes -w
          Roll back at any point:
            oc -n {{ _ccm_ns }} scale deploy/{{ _ccm_deploy }} --replicas=0
      when: not (ccm_scale_up | bool)

    # ── scale-up path ────────────────────────────────────────────────────────
    - name: "08e — scale to 1"
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, "{{ _ccm_ns }}",
               scale, "deploy/{{ _ccm_deploy }}", --replicas=1]
      changed_when: true
      when: ccm_scale_up | bool

    - name: "08e — wait for it to become Available"
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, "{{ _ccm_ns }}",
               wait, --for=condition=Available, "deploy/{{ _ccm_deploy }}",
               --timeout=180s]
      register: _ccm_avail
      changed_when: false
      failed_when: false
      when: ccm_scale_up | bool

    - name: "08e — re-read the Nodes"
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", get, nodes,
               -o, 'jsonpath={range .items[*]}{.metadata.name}{" "}{.spec.providerID}{"\n"}{end}']
      register: _ccm_nodes_after
      changed_when: false
      when: ccm_scale_up | bool

    # The whole reason for the staged rollout.  This must not be something the
    # operator has to notice on their own.
    - name: "08e — no Node may have disappeared"
      ansible.builtin.assert:
        that: >-
          (_ccm_nodes_before.stdout_lines | map('trim') | select() | list
           | difference(_ccm_nodes_after.stdout_lines | map('trim') | select() | list))
          | length == 0
        fail_msg: |
          NODES WENT MISSING after the CCM started.  Scale it back to 0 now:
            oc -n {{ _ccm_ns }} scale deploy/{{ _ccm_deploy }} --replicas=0
          Before: {{ _ccm_nodes_before.stdout_lines | join(' | ') }}
          After:  {{ _ccm_nodes_after.stdout_lines | join(' | ') }}
          The backup this play took is /root/nodes-before-ccm-*.yaml.
        success_msg: "all {{ _ccm_nodes_after.stdout_lines | select() | list | length }} Node(s) still present"
        quiet: true
      when: ccm_scale_up | bool

    - name: "08e — running"
      ansible.builtin.debug:
        msg: |
          CCM is up ({{ 'Available' if _ccm_avail.rc | default(1) == 0 else 'NOT Available — check the logs' }}).
          Prove it end to end with a LoadBalancer Service, then delete it — a
          leaked SLB costs money and teardown only sweeps what it knows about.
      when: ccm_scale_up | bool
