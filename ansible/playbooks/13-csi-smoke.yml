---
# Phase 13 (OPTIONAL) — CSI / storage live smoke against the real OpenShift +
# Alibaba Cloud cluster. NOT part of the default site-post chain.
#
# This is the "live tier" of the storage test pyramid (unit → kind-smoke → e2e →
# LIVE). The operator-level kind smoke proves reconcile against a fake/real API
# server with no cloud; THIS proves the driver actually provisions real Alibaba
# storage. It exercises the primitives that do NOT need bare-metal / OKV:
#
#   [disk-fs]    PVC on alicloud-disk-essd (RWO, Filesystem) → Pod writes a file →
#                PVC Bound + Pod Ready + file read back
#   [disk-block] PVC volumeMode=Block on alicloud-disk-essd-block → Pod with
#                volumeDevices sees a raw block device
#   [snapshot]   VolumeSnapshot of the disk-fs PVC → ReadyToUse → restore a new PVC
#                from it → the file written before the snapshot survives
#   [nas-rwx]    RWX PVC on alicloud-nas-performance → two Pods mount it → one
#                writes, the other reads the same file (shared, for live migration).
#                SOFT check — 08 applies a filesystem-mode NAS StorageClass from the
#                cluster vpc/vSwitch/zone (state.yml); if those were absent when 08
#                ran the SC is skipped and the PVC stays Pending. Reported but does
#                NOT fail the play. Disable with -e csi_smoke_nas=false.
#
# Real cloud disks and a NAS filesystem ARE created and then deleted. The block in
# `always:` tears everything down (namespace + wait for finalizers) so a re-run is
# clean and no orphaned cloud resources are left.
#
# Run AFTER site-post (08 applied the CSI operator + CR; #32-34):
#   ansible-playbook -i ansible/inventory.yml ansible/playbooks/13-csi-smoke.yml
#
# Override the test image if openshift/tools is not the imagestream you mirror:
#   -e csi_smoke_image=image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
- name: Resolve jump host from state (Phase 13 runs standalone)
  hosts: local
  gather_facts: false
  tasks:
    - ansible.builtin.include_tasks: ../tasks/load_state.yml

    - name: Resolve the deploy host (jump host, or the operator over peering)
      ansible.builtin.include_tasks: ../tasks/deploy_host.yml

    - name: Assert the jump host IP is known
      ansible.builtin.assert:
        that: mirror_private_ip | default('') | length > 0
        fail_msg: >-
          mirror_private_ip is not in state.yml — run site-post (or Phase 08) first;
          Phase 13 smokes the cluster via the jump host.

    - name: Add the jump host to the inventory
      ansible.builtin.add_host:
        name: jumphost
        ansible_host: "{{ _dh_host }}"
        ansible_connection: "{{ _dh_connection }}"
        ansible_user: root
        ansible_ssh_private_key_file: "{{ ssh_priv_key_file }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15"
        groups: deploy

# The oc smoke runs ON the jump host (it reaches the private cluster API and carries
# /root/kubeconfig); the operator box cannot reach the cluster API directly.
- name: Phase 13 — CSI storage live smoke
  hosts: jumphost
  gather_facts: false
  vars:
    # Plain values — overridable with -e (extra-vars outrank play vars). They must
    # NOT be self-referential: "{{ kubeconfig_file | default(...) }}" recurses when
    # the var is not passed via -e (observed 2026-06-14).
    kubeconfig_file: /root/kubeconfig
    ns: csi-smoke
    # Air-gap-safe: the openshift/tools imagestream is populated from the mirrored
    # release payload, so it is present on any OpenShift cluster without extra mirroring.
    csi_smoke_image: "image-registry.openshift-image-registry.svc:5000/openshift/tools:latest"
    disk_fs_sc: alicloud-disk-essd
    disk_block_sc: alicloud-disk-essd-block
    nas_sc: alicloud-nas-performance
    snap_class: alibaba-cloud-disk-snapclass
    pvc_size: 20Gi
    wait_timeout: 300s
    # NAS is a SOFT check: the operator's NAS StorageClass currently sets only
    # mountType/storageType — no `volumeAs`, so it defaults to subpath mode which
    # needs a pre-existing `server` (mount-target). Dynamic filesystem-mode
    # provisioning needs volumeAs=filesystem + vpcId/vSwitchId/zoneId/regionId,
    # which the operator does not set yet. Until that lands, the NAS PVC will stay
    # Pending — so NAS is reported but does NOT fail the play. Toggle off entirely
    # with -e csi_smoke_nas=false. Shorter timeout since a stuck PVC won't bind.
    csi_smoke_nas: true
    # Snapshots are a required check by default.  Set false only where the
    # platform genuinely cannot do them — on Apsara the driver creates the
    # snapshot in the cloud and then crashes reading the response back
    # (DescribeSnapshots returns SourceDiskSize as a number where the SDK's
    # ecs.Snapshot declares a string, so the response does not unmarshal, the
    # waiter treats the snapshot as absent and CreateSnapshot dereferences nil).
    # That takes the whole driver down with every sidecar, and each retry leaves
    # another orphan snapshot in the cloud, so running the check there costs
    # something and proves nothing.  Deliberately NOT auto-disabled on apsara:
    # this is an upstream defect, and it should start failing again the moment
    # it is fixed.
    csi_smoke_snapshot: true
    # Set true to keep the smoke namespace even on success (for debugging).  A
    # required failure keeps it regardless — see "keep the namespace" below.
    csi_smoke_keep_ns: false
    _csi_keep_ns: "{{ csi_smoke_keep_ns | default(false) | bool }}"
    nas_wait_timeout: 120s
  tasks:
    - block:
        # ── resolve a node-pullable image ──────────────────────────────────
        # The default csi_smoke_image points at the in-cluster image registry, but
        # the node CRI resolves DNS via the cloud VPC resolver and cannot resolve
        # image-registry.openshift-image-registry.svc → ImagePullBackOff (observed
        # 2026-06-14). Derive the release `cli` image instead: its pullspec is a
        # quay.io/openshift-release-dev digest that the install-config IDMS redirects
        # to the mirror, so the node pulls it air-gapped. `-e csi_smoke_image=...`
        # still wins (extra-vars outrank set_fact); the play-var default is the
        # fallback if this lookup fails (e.g. on a non-air-gapped cluster).
        # `oc adm release info` has to pull the release image, so it needs the
        # cluster pull secret; without it the lookup fails and the play used to
        # fall through to something unusable.  08 extracts the secret here.
        - name: "13 — cluster pull secret for resolving the test image"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, openshift-config,
                   extract, secret/pull-secret, --to=/root, --confirm]
          changed_when: false
          failed_when: false

        # Prefer `tools`: it exists to run commands in, so it has a shell.  The
        # test does `sh -c`, and an image without /bin/sh fails at container
        # creation with the volume already attached — storage working perfectly
        # while the smoke reports failure.
        - name: Resolve a node-pullable test image from the release payload
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", adm, release, info,
                   "--image-for={{ item }}",
                   --registry-config=/root/.dockerconfigjson, --insecure]
          register: _cli_probe
          changed_when: false
          failed_when: false
          loop: [tools, cli]

        - name: "13 — first image that resolved"
          ansible.builtin.set_fact:
            _cli_img: >-
              {{ (_cli_probe.results | selectattr('rc', 'equalto', 0)
                  | map(attribute='stdout') | map('trim')
                  | select('match', '.+') | list | first | default('')) }}

        # Falling back to the default in-cluster registry address is not safe
        # here: kubelet does the pulling, on the NODE, using the node's resolver
        # — which on a private cloud is the environment's DNS and cannot resolve
        # *.svc at all.  The pull then fails with "lookup
        # image-registry.openshift-image-registry.svc ... no such host" while the
        # volume underneath is perfectly fine, so the smoke blames storage for a
        # test-harness problem.  Fall back to an image the node is demonstrably
        # able to pull: one it is already running.
        - name: Use the release image when it resolved
          ansible.builtin.set_fact:
            csi_smoke_image: "{{ _cli_img }}"
          when: _cli_img | length > 0

        - name: "13 — test image"
          ansible.builtin.debug:
            msg: "test image: {{ csi_smoke_image }}"

        # Two ways to end up with an image that cannot run the test, both of
        # which previously surfaced as a "storage" failure: the in-cluster
        # registry, which the node's resolver cannot see, and an image with no
        # shell.  Refuse rather than run a test that cannot pass.
        - name: "13 — no usable test image could be determined"
          ansible.builtin.assert:
            that:
              - _cli_img | length > 0
              - "'image-registry.openshift-image-registry.svc' not in csi_smoke_image"
            fail_msg: >-
              Could not resolve a test image from the release payload
              ({{ csi_smoke_image }}).  The default in-cluster registry is not
              usable — kubelet pulls on the node, whose resolver cannot see
              *.svc — and an image without /bin/sh fails at container creation
              with the volume already attached, which reads like a storage
              failure.  Pass one explicitly: -e csi_smoke_image=<ref>.

        # ── namespace ──────────────────────────────────────────────────────
        # A previous failure deliberately leaves this namespace behind for triage,
        # so start by removing it: reusing those objects means the run reports on
        # PVCs and Pods from an earlier attempt — which is exactly what happened
        # once the provisioning fix landed (the old PVCs bound fine, while the
        # old Pods were still stuck on an image pull, and the smoke "failed" on
        # stale evidence).  Keep the wait: PV finalizers hold the namespace.
        # An unready snapshot's finalizers otherwise hold the namespace until the
        # delete times out, reporting a failure unrelated to what is being tested.
        - name: Release snapshots that would block the namespace delete
          ansible.builtin.include_tasks: ../tasks/release_stuck_snapshots.yml
          vars:
            rss_ns: "{{ ns }}"

        # Deleting the namespace means deleting its PVCs, which means detaching
        # and deleting real cloud disks — slower here than on the public cloud,
        # and slower still when the driver has restarted and the calls are being
        # retried.  A blocking delete with a fixed timeout reported failure while
        # the namespace was in fact still going away, and did go away moments
        # later.  Issue the delete, then wait for it to actually be gone.
        - name: Remove any smoke namespace left over from a previous run
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", delete, namespace, "{{ ns }}",
                   --ignore-not-found, "--wait=false"]
          changed_when: true

        - name: Wait for the old smoke namespace to go
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", get, namespace, "{{ ns }}",
                   -o, "jsonpath={.status.phase}"]
          register: _ns_gone
          changed_when: false
          failed_when: false
          retries: "{{ csi_smoke_ns_delete_retries | default(60) }}"
          delay: 10
          until: _ns_gone.rc != 0

        - name: "13 — the old smoke namespace will not go away"
          ansible.builtin.assert:
            that: _ns_gone.rc != 0
            fail_msg: >-
              {{ ns }} is still {{ _ns_gone.stdout | default('present') }} after
              waiting.  Something in it still holds a finalizer — check
              `oc -n {{ ns }} get pvc,pod,volumesnapshot` and the CSI controller
              logs, since a crashed driver stops volumes being detached and
              deleted.

        - name: Create smoke namespace
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", create, namespace, "{{ ns }}"]
          register: _ns
          changed_when: _ns.rc == 0
          failed_when: _ns.rc != 0 and 'AlreadyExists' not in _ns.stderr

        # ── [disk-fs] RWO Filesystem PVC + writer Pod ──────────────────────
        - name: "[disk-fs] apply PVC + writer Pod"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", apply, -f, "-"]
          args:
            stdin: |
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata: { name: disk-fs, namespace: {{ ns }} }
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: {{ disk_fs_sc }}
                resources: { requests: { storage: {{ pvc_size }} } }
              ---
              apiVersion: v1
              kind: Pod
              metadata: { name: disk-fs-writer, namespace: {{ ns }} }
              spec:
                restartPolicy: Never
                containers:
                  - name: w
                    image: {{ csi_smoke_image }}
                    command: ["/bin/sh","-c","echo csi-smoke-disk-fs > /data/hello.txt && sync && sleep 3600"]
                    volumeMounts: [{ name: v, mountPath: /data }]
                volumes:
                  - name: v
                    persistentVolumeClaim: { claimName: disk-fs }
          changed_when: true

        - name: "[disk-fs] wait Pod Ready (binds the WaitForFirstConsumer PVC)"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, "{{ ns }}", wait, --for=condition=Ready, pod/disk-fs-writer, "--timeout={{ wait_timeout }}"]
          register: _diskfs_wait
          changed_when: false
          failed_when: false

        - name: "[disk-fs] read the file back"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, "{{ ns }}", exec, disk-fs-writer, --, cat, /data/hello.txt]
          register: _diskfs_cat
          changed_when: false
          failed_when: false

        - name: "[disk-fs] record result"
          ansible.builtin.set_fact:
            r_disk_fs: "{{ (_diskfs_wait.rc == 0) and ('csi-smoke-disk-fs' in _diskfs_cat.stdout) }}"

        # ── [disk-block] Block volumeMode PVC + Pod with volumeDevices ─────
        - name: "[disk-block] apply Block PVC + Pod"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", apply, -f, "-"]
          args:
            stdin: |
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata: { name: disk-block, namespace: {{ ns }} }
              spec:
                accessModes: [ReadWriteOnce]
                volumeMode: Block
                storageClassName: {{ disk_block_sc }}
                resources: { requests: { storage: {{ pvc_size }} } }
              ---
              apiVersion: v1
              kind: Pod
              metadata: { name: disk-block-user, namespace: {{ ns }} }
              spec:
                restartPolicy: Never
                containers:
                  - name: b
                    image: {{ csi_smoke_image }}
                    command: ["/bin/sh","-c","test -b /dev/xvdb && echo BLOCKOK && sleep 3600"]
                    volumeDevices: [{ name: v, devicePath: /dev/xvdb }]
                volumes:
                  - name: v
                    persistentVolumeClaim: { claimName: disk-block }
          changed_when: true

        - name: "[disk-block] wait Pod Ready (raw block device attached)"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, "{{ ns }}", wait, --for=condition=Ready, pod/disk-block-user, "--timeout={{ wait_timeout }}"]
          register: _diskblk_wait
          changed_when: false
          failed_when: false

        - name: "[disk-block] record result"
          ansible.builtin.set_fact:
            r_disk_block: "{{ _diskblk_wait.rc == 0 }}"

        # ── [snapshot] snapshot the disk-fs PVC, restore, verify data ──────
        - name: "[snapshot] create VolumeSnapshot of disk-fs"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", apply, -f, "-"]
          args:
            stdin: |
              apiVersion: snapshot.storage.k8s.io/v1
              kind: VolumeSnapshot
              metadata: { name: disk-fs-snap, namespace: {{ ns }} }
              spec:
                volumeSnapshotClassName: {{ snap_class }}
                source: { persistentVolumeClaimName: disk-fs }
          changed_when: true

          when: csi_smoke_snapshot | default(true) | bool
        - name: "[snapshot] wait readyToUse=true"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, "{{ ns }}", wait, "--for=jsonpath={.status.readyToUse}=true", volumesnapshot/disk-fs-snap, "--timeout={{ wait_timeout }}"]
          register: _snap_wait
          changed_when: false
          failed_when: false

          when: csi_smoke_snapshot | default(true) | bool
        - name: "[snapshot] restore PVC from snapshot + reader Pod"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", apply, -f, "-"]
          args:
            stdin: |
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata: { name: disk-fs-restore, namespace: {{ ns }} }
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: {{ disk_fs_sc }}
                dataSource:
                  name: disk-fs-snap
                  kind: VolumeSnapshot
                  apiGroup: snapshot.storage.k8s.io
                resources: { requests: { storage: {{ pvc_size }} } }
              ---
              apiVersion: v1
              kind: Pod
              metadata: { name: disk-fs-restore-reader, namespace: {{ ns }} }
              spec:
                restartPolicy: Never
                containers:
                  - name: r
                    image: {{ csi_smoke_image }}
                    command: ["/bin/sh","-c","sleep 3600"]
                    volumeMounts: [{ name: v, mountPath: /data }]
                volumes:
                  - name: v
                    persistentVolumeClaim: { claimName: disk-fs-restore }
          changed_when: true
          when: _snap_wait.rc == 0

          when: csi_smoke_snapshot | default(true) | bool
        - name: "[snapshot] wait restore reader Ready"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, "{{ ns }}", wait, --for=condition=Ready, pod/disk-fs-restore-reader, "--timeout={{ wait_timeout }}"]
          register: _restore_wait
          changed_when: false
          failed_when: false
          when: _snap_wait.rc == 0

          when: csi_smoke_snapshot | default(true) | bool
        - name: "[snapshot] verify the pre-snapshot file survived"
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, "{{ ns }}", exec, disk-fs-restore-reader, --, cat, /data/hello.txt]
          register: _restore_cat
          changed_when: false
          failed_when: false
          when: _snap_wait.rc == 0

          when: csi_smoke_snapshot | default(true) | bool
        - name: "[snapshot] record result"
          ansible.builtin.set_fact:
            r_snapshot: "{{ (_snap_wait.rc == 0) and (_restore_wait.rc | default(1) == 0) and ('csi-smoke-disk-fs' in (_restore_cat.stdout | default(''))) }}"

        # ── [nas-rwx] RWX PVC shared across two Pods ───────────────────────
          when: csi_smoke_snapshot | default(true) | bool
        - name: "[nas-rwx] apply RWX PVC + writer + reader Pods"
          when: csi_smoke_nas | default(true) | bool
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", apply, -f, "-"]
          args:
            stdin: |
              apiVersion: v1
              kind: PersistentVolumeClaim
              metadata: { name: nas-rwx, namespace: {{ ns }} }
              spec:
                accessModes: [ReadWriteMany]
                storageClassName: {{ nas_sc }}
                resources: { requests: { storage: {{ pvc_size }} } }
              ---
              apiVersion: v1
              kind: Pod
              metadata: { name: nas-writer, namespace: {{ ns }} }
              spec:
                restartPolicy: Never
                containers:
                  - name: w
                    image: {{ csi_smoke_image }}
                    command: ["/bin/sh","-c","echo csi-smoke-nas-rwx > /data/shared.txt && sync && sleep 3600"]
                    volumeMounts: [{ name: v, mountPath: /data }]
                volumes:
                  - name: v
                    persistentVolumeClaim: { claimName: nas-rwx }
              ---
              apiVersion: v1
              kind: Pod
              metadata: { name: nas-reader, namespace: {{ ns }} }
              spec:
                restartPolicy: Never
                containers:
                  - name: r
                    image: {{ csi_smoke_image }}
                    command: ["/bin/sh","-c","sleep 3600"]
                    volumeMounts: [{ name: v, mountPath: /data }]
                volumes:
                  - name: v
                    persistentVolumeClaim: { claimName: nas-rwx }
          changed_when: true

        - name: "[nas-rwx] wait both Pods Ready"
          when: csi_smoke_nas | default(true) | bool
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, "{{ ns }}", wait, --for=condition=Ready, pod/nas-writer, pod/nas-reader, "--timeout={{ nas_wait_timeout }}"]
          register: _nas_wait
          changed_when: false
          failed_when: false

        - name: "[nas-rwx] reader reads what the writer wrote (shared volume)"
          when: csi_smoke_nas | default(true) | bool
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, "{{ ns }}", exec, nas-reader, --, cat, /data/shared.txt]
          register: _nas_cat
          changed_when: false
          failed_when: false

        - name: "[nas-rwx] record result"
          ansible.builtin.set_fact:
            r_nas_rwx: "{{ csi_smoke_nas | default(true) | bool and (_nas_wait.rc | default(1) == 0) and ('csi-smoke-nas-rwx' in (_nas_cat.stdout | default(''))) }}"

        # ── report ─────────────────────────────────────────────────────────
        - name: CSI live smoke report
          ansible.builtin.debug:
            msg: |
              ===== CSI storage live smoke =====
              [disk-fs]    RWO Filesystem PVC + write/read ....... {{ 'PASS' if r_disk_fs | default(false) else 'FAIL' }}   (required)
              [disk-block] Block volumeMode raw device ........... {{ 'PASS' if r_disk_block | default(false) else 'FAIL' }}   (required)
              [snapshot]   VolumeSnapshot → restore → data kept .. {{ 'PASS' if r_snapshot | default(false) else ('SKIP' if not (csi_smoke_snapshot | default(true) | bool) else 'FAIL') }}   {{ '(required)' if (csi_smoke_snapshot | default(true) | bool) else '(disabled — known upstream defect)' }}
              [nas-rwx]    RWX shared across two Pods ............ {{ 'PASS' if r_nas_rwx | default(false) else ('SKIP' if not (csi_smoke_nas | default(true) | bool) else 'FAIL') }}   (soft)
              ==================================

        - name: "13 — keep the namespace when a required test failed"
          ansible.builtin.set_fact:
            _csi_keep_ns: >-
              {{ (csi_smoke_keep_ns | default(false) | bool)
                 or not (r_disk_fs | default(false))
                 or not (r_disk_block | default(false))
                 or ((csi_smoke_snapshot | default(true) | bool) and not (r_snapshot | default(false))) }}

        - name: "[nas-rwx] note when NAS soft-check failed"
          ansible.builtin.debug:
            msg: >
              NAS soft-check did not pass. 08-deploy-post-install should have applied
              a filesystem-mode NAS StorageClass ({{ nas_sc }}) from the cluster
              vpc/vSwitch/zone. Check: `oc get sc {{ nas_sc }} -o yaml` (does it have
              volumeAs=filesystem + vpcId/vSwitchId/zoneId?), then
              `oc -n {{ ns }} describe pvc nas-rwx` and the csi-nas-controller logs
              in kube-system. If the SC is missing, state.yml lacked the network IDs
              when 08 ran (the apply task is gated on them).
          when:
            - csi_smoke_nas | default(true) | bool
            - not (r_nas_rwx | default(false))

        - name: Fail the play only if a REQUIRED storage test failed (NAS is soft)
          ansible.builtin.assert:
            that:
              - r_disk_fs | default(false)
              - r_disk_block | default(false)
              - (r_snapshot | default(false)) or not (csi_smoke_snapshot | default(true) | bool)
            fail_msg: "A required CSI storage test FAILED — see the report and `oc -n {{ ns }} get pvc,pod,volumesnapshot`."
            success_msg: "Required CSI storage tests PASSED (disk-fs, disk-block{{ ', snapshot' if (csi_smoke_snapshot | default(true) | bool) else '; snapshot disabled' }}).{{ ' NAS RWX also PASSED.' if r_nas_rwx | default(false) else ' NAS RWX is a soft check (see note).' }}"

      always:
        # Keep the evidence when something failed.  Cleaning up unconditionally
        # deleted the namespace the failure message tells you to inspect, so the
        # only way to see why a test failed was to reproduce it by hand.
        - name: "cleanup — keeping the namespace for triage (a required test failed)"
          ansible.builtin.debug:
            msg: >-
              {{ ns }} left in place. Inspect with:
                oc -n {{ ns }} get pvc,pod,volumesnapshot
                oc -n {{ ns }} describe pvc
                oc -n kube-system logs deploy/csi-disk-controller --all-containers --tail=100
              Delete it when done:  oc delete namespace {{ ns }}
          when: _csi_keep_ns

        - name: cleanup — release snapshots that would block the delete
          ansible.builtin.include_tasks: ../tasks/release_stuck_snapshots.yml
          vars:
            rss_ns: "{{ ns }}"
          when: not _csi_keep_ns

        - name: cleanup — delete the smoke namespace (waits for PV/finalizer release)
          ansible.builtin.command:
            argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", delete, namespace, "{{ ns }}", --ignore-not-found, "--wait=true", "--timeout=300s"]
          changed_when: true
          failed_when: false
          when: not _csi_keep_ns

