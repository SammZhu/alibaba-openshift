---
# Create the Secret the CCM manifest reads its AccessKey from.
#
# Shared because two paths need it and they must not drift: 08 (the manifest was
# baked into the agent ISO at install time, so the credentials have to arrive
# afterwards) and 08e (retrofitting a cluster installed without the CCM).
#
# Callers set _ccm_secret_optional=true where the namespace may legitimately not
# exist yet — 08 runs whether or not the CCM was ever deployed.
- name: "{{ ccm_secret_caller | default('ccm') }} — credentials Secret"
  ansible.builtin.shell: |
    oc --kubeconfig {{ kubeconfig_file }} create secret generic {{ ccm_credentials_secret | default('alibaba-ccm-creds') }} \
      -n alibaba-cloud-controller-manager \
      --from-literal=access_key_id='{{ capa_ak }}' \
      --from-literal=access_key_secret='{{ capa_sk }}' \
      --dry-run=client -o yaml | oc --kubeconfig {{ kubeconfig_file }} apply -f -
  args:
    executable: /bin/bash
  register: _ccm_secret
  changed_when: "'unchanged' not in _ccm_secret.stdout"
  failed_when:
    - _ccm_secret.rc != 0
    - not (_ccm_secret_optional | default(false) | bool and 'not found' in (_ccm_secret.stderr | default('')))
  no_log: true
