# apsara_unpeer_vpc.yml — tear down the mirror<->operator VPC peering created by
# apsara_peer_vpc.yml, BEFORE the mirror-stack DeleteStack (the Router Interface
# blocks VPC deletion with DependencyViolation.RouteInterface).
#
# Root cause of the recurring stall (nailed 2026-08-09 with -vv): even after the
# RIs report Inactive, deleting the peering route / the RI right away can still
# fail on Apsara (the connection hasn't fully settled) — the SAME DeleteRouteEntry
# succeeds a few minutes later by hand.  A single delete pass therefore leaves the
# accepting RI pinned by its route.  So: RETRY the whole (delete routes + delete
# RIs) until the RIs are actually gone.  Route params come from state and are
# correct (verified) — no scanning (avoids the operator VPC's route pagination).
#
# One shell task (state values via environment, no Jinja in the body — inlining
# {{ }} with jq quotes trips ansible's arg splitter), result surfaced via debug.
- name: "unpeer: tear down mirror<->operator peering (retry until RIs gone)"
  when: mirror_peer_ri_init | default('') | length > 0
  environment: "{{ (cloud_env | default({})) | combine({
      'CC': cloud_cli, 'R': region, 'P': aliyun_profile,
      'INIT': mirror_peer_ri_init, 'ACC': mirror_peer_ri_accept | default(''),
      'OP_RT': mirror_peer_op_rt | default(''), 'MR_RT': mirror_peer_mr_rt | default(''),
      'MR_CIDR': mirror_vpc_cidr | default(''), 'OP_CIDR': mirror_peer_op_cidr | default('') }) }}"
  ansible.builtin.shell: |
    set -uo pipefail
    echo "unpeer: deactivating RIs..."
    for ri in $INIT $ACC; do
      [ -n "$ri" ] && "$CC" vpc DeactivateRouterInterface --RegionId "$R" --RouterInterfaceId "$ri" --profile "$P" >/dev/null 2>&1 || true
    done
    # Retry the full delete until both RIs are gone: early attempts may fail while
    # the connection settles; keep going (up to ~5 min).
    for attempt in $(seq 1 20); do
      [ -n "$OP_RT" ] && "$CC" vpc DeleteRouteEntry --RegionId "$R" --RouteTableId "$OP_RT" --DestinationCidrBlock "$MR_CIDR" --NextHopId "$INIT" --profile "$P" >/dev/null 2>&1 || true
      [ -n "$MR_RT" ] && "$CC" vpc DeleteRouteEntry --RegionId "$R" --RouteTableId "$MR_RT" --DestinationCidrBlock "$OP_CIDR" --NextHopId "$ACC" --profile "$P" >/dev/null 2>&1 || true
      [ -n "$ACC" ]  && "$CC" vpc DeleteRouterInterface --RegionId "$R" --RouterInterfaceId "$ACC" --profile "$P" >/dev/null 2>&1 || true
      "$CC" vpc DeleteRouterInterface --RegionId "$R" --RouterInterfaceId "$INIT" --profile "$P" >/dev/null 2>&1 || true
      left=$("$CC" vpc DescribeRouterInterfaces --RegionId "$R" --profile "$P" \
             | jq -r --arg a "$ACC" --arg i "$INIT" '[.RouterInterfaceSet.RouterInterfaceType[]? | select(.RouterInterfaceId==$a or .RouterInterfaceId==$i)] | length')
      echo "unpeer attempt $attempt: remaining RIs = ${left:-?}"
      [ "${left:-1}" = "0" ] && { echo "unpeer: RIs gone"; break; }
      sleep 15
    done
  args:
    executable: /bin/bash
  register: _unpeer
  changed_when: true
  failed_when: false

- name: "unpeer: result"
  ansible.builtin.debug:
    msg: "{{ _unpeer.stdout_lines | default([]) }}"
  failed_when: false
