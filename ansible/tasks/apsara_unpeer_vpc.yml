# apsara_unpeer_vpc.yml — tear down the mirror<->operator VPC peering created by
# apsara_peer_vpc.yml, BEFORE the mirror-stack DeleteStack (the Router Interface
# blocks VPC deletion with DependencyViolation.RouteInterface).
#
# Lessons (2026-08-09):
#  * DEACTIVATE the RIs first — a route whose next hop is an ACTIVE RI, and the RI
#    itself, don't reliably delete while Active.
#  * Delete the peering routes by their EXACT (route-table, CIDR, next-hop) from
#    state — do NOT scan+match, because the operator VPC's route table paginates
#    and our entry can be on a later page (that left the init RI pinned).
#  * DeleteRouterInterface is async — wait until the RIs are actually gone, else
#    the DeleteStack that runs next races them.
#
# Observable per-step (each is its own task; the RI-delete stderr is surfaced) so a
# failure is visible instead of swallowed in one black-box shell.  Best-effort.
- name: "unpeer: tear down mirror<->operator peering"
  when: mirror_peer_ri_init | default('') | length > 0
  vars:
    _unpeer_env: "{{ (cloud_env | default({})) | combine({'CC': cloud_cli, 'R': region, 'P': aliyun_profile, 'INIT': mirror_peer_ri_init, 'ACC': mirror_peer_ri_accept | default('')}) }}"
  block:
    - name: "unpeer: deactivate both router interfaces"
      ansible.builtin.command:
        argv: ["{{ cloud_cli }}", vpc, DeactivateRouterInterface, --RegionId, "{{ region }}",
               --RouterInterfaceId, "{{ item }}", --profile, "{{ aliyun_profile }}"]
      loop:
        - "{{ mirror_peer_ri_init }}"
        - "{{ mirror_peer_ri_accept | default('') }}"
      when: item | length > 0
      changed_when: true
      failed_when: false

    - name: "unpeer: wait until neither RI is Active (deactivate is async)"
      environment: "{{ _unpeer_env }}"
      ansible.builtin.shell: >
        "$CC" vpc DescribeRouterInterfaces --RegionId "$R" --profile "$P"
        | jq -r --arg a "$ACC" --arg i "$INIT"
        '[.RouterInterfaceSet.RouterInterfaceType[]? | select(.RouterInterfaceId==$a or .RouterInterfaceId==$i) | select(.Status=="Active")] | length'
      register: _unpeer_active
      until: (_unpeer_active.stdout | trim) == '0'
      retries: 18
      delay: 10
      changed_when: false
      failed_when: false

    - name: "unpeer: delete the two peering route entries (targeted from state — no pagination)"
      ansible.builtin.command:
        argv: ["{{ cloud_cli }}", vpc, DeleteRouteEntry, --RegionId, "{{ region }}",
               --RouteTableId, "{{ item.rt }}", --DestinationCidrBlock, "{{ item.cidr }}",
               --NextHopId, "{{ item.nh }}", --profile, "{{ aliyun_profile }}"]
      loop:
        - { rt: "{{ mirror_peer_op_rt | default('') }}", cidr: "{{ mirror_vpc_cidr | default('') }}",     nh: "{{ mirror_peer_ri_init }}" }
        - { rt: "{{ mirror_peer_mr_rt | default('') }}", cidr: "{{ mirror_peer_op_cidr | default('') }}", nh: "{{ mirror_peer_ri_accept | default('') }}" }
      when: item.rt | length > 0 and item.cidr | length > 0 and item.nh | length > 0
      changed_when: true
      failed_when: false

    - name: "unpeer: delete both router interfaces (accepting first, then initiating)"
      ansible.builtin.command:
        argv: ["{{ cloud_cli }}", vpc, DeleteRouterInterface, --RegionId, "{{ region }}",
               --RouterInterfaceId, "{{ item }}", --profile, "{{ aliyun_profile }}"]
      loop:
        - "{{ mirror_peer_ri_accept | default('') }}"
        - "{{ mirror_peer_ri_init }}"
      when: item | length > 0
      register: _unpeer_del
      changed_when: true
      failed_when: false

    - name: "unpeer: surface any RI-delete errors (e.g. RouterInterfaceReferedByRouteEntry)"
      ansible.builtin.debug:
        msg: "{{ _unpeer_del.results | default([]) | selectattr('stderr', 'defined') | map(attribute='stderr') | select() | list }}"
      failed_when: false

    - name: "unpeer: wait until both RIs are actually gone (delete is async)"
      environment: "{{ _unpeer_env }}"
      ansible.builtin.shell: >
        "$CC" vpc DescribeRouterInterfaces --RegionId "$R" --profile "$P"
        | jq -r --arg a "$ACC" --arg i "$INIT"
        '[.RouterInterfaceSet.RouterInterfaceType[]? | select(.RouterInterfaceId==$a or .RouterInterfaceId==$i)] | length'
      register: _unpeer_left
      until: (_unpeer_left.stdout | trim) == '0'
      retries: 18
      delay: 10
      changed_when: false
      failed_when: false
