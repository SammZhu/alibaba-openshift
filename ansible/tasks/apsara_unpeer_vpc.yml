# apsara_unpeer_vpc.yml — tear down the mirror<->operator VPC peering created by
# apsara_peer_vpc.yml, BEFORE the mirror-stack DeleteStack (the Router Interface
# blocks VPC deletion with DependencyViolation.RouteInterface).
#
# Robust order (learned 2026-08-09): DEACTIVATE first, then clear routes, then
# delete the RIs.  On Apsara a route entry whose next hop is an ACTIVE RI does not
# reliably delete, which left the accepting RI pinned by its route and stalled the
# teardown.  Also: don't trust a single saved route-table/CIDR — scan BOTH VPCs'
# route tables and delete EVERY entry whose next hop is one of our two RIs.
# DeleteRouterInterface is async, so finally wait until both RIs are gone or the
# DeleteStack that runs next races them.
#
# Best-effort throughout (failed_when: false); skipped when no peering was recorded.
# Driven by state facts: mirror_peer_ri_init/accept, mirror_vpc_id,
# mirror_peer_op_vpc_id.

- name: "unpeer: deactivate -> clear routes -> delete RIs (robust, scan-based)"
  when: mirror_peer_ri_init | default('') | length > 0
  ansible.builtin.shell: |
    set -uo pipefail
    CC="{{ cloud_cli }}"; R="{{ region }}"; P="{{ aliyun_profile }}"
    INIT="{{ mirror_peer_ri_init }}"; ACC="{{ mirror_peer_ri_accept | default('') }}"
    MRVPC="{{ mirror_vpc_id | default('') }}"; OPVPC="{{ mirror_peer_op_vpc_id | default('') }}"

    ris="$INIT"; [ -n "$ACC" ] && ris="$ris $ACC"

    # 1) Deactivate both, then wait until neither is Active (delete + route-delete
    #    only behave once the RIs are Inactive).
    for ri in $ris; do
      "$CC" vpc DeactivateRouterInterface --RegionId "$R" --RouterInterfaceId "$ri" --profile "$P" >/dev/null 2>&1 || true
    done
    for _ in $(seq 1 18); do
      act=$("$CC" vpc DescribeRouterInterfaces --RegionId "$R" --profile "$P" \
            | jq -r --arg a "$ACC" --arg i "$INIT" '.RouterInterfaceSet.RouterInterfaceType[]?
                | select(.RouterInterfaceId==$a or .RouterInterfaceId==$i)
                | select(.Status=="Active") | .RouterInterfaceId' | wc -l)
      [ "$act" -eq 0 ] && break; sleep 10
    done

    # 2) Delete EVERY route entry (in either VPC's route tables) whose next hop is
    #    one of our RIs — do not rely on a single saved table/CIDR.
    for v in "$MRVPC" "$OPVPC"; do
      [ -n "$v" ] || continue
      for rt in $("$CC" vpc DescribeRouteTableList --RegionId "$R" --VpcId "$v" --profile "$P" \
                  | jq -r '.RouterTableList.RouterTableListType[]?.RouteTableId'); do
        "$CC" vpc DescribeRouteEntryList --RegionId "$R" --RouteTableId "$rt" --profile "$P" \
          | jq -r --arg a "$ACC" --arg i "$INIT" '.RouteEntrys.RouteEntry[]?
              | select(.NextHops.NextHop[0].NextHopId==$a or .NextHops.NextHop[0].NextHopId==$i)
              | .DestinationCidrBlock + " " + .NextHops.NextHop[0].NextHopId' \
          | while read -r cidr nh; do
              echo "unpeer: deleting route $cidr -> $nh (rt $rt)"
              "$CC" vpc DeleteRouteEntry --RegionId "$R" --RouteTableId "$rt" \
                --DestinationCidrBlock "$cidr" --NextHopId "$nh" --profile "$P" || true
            done
      done
    done

    # 3) Delete the RIs (now Inactive + unreferenced), then wait until gone
    #    (DeleteRouterInterface is async — else DeleteStack races the RI).
    for ri in $ACC $INIT; do
      "$CC" vpc DeleteRouterInterface --RegionId "$R" --RouterInterfaceId "$ri" --profile "$P" || true
    done
    for _ in $(seq 1 18); do
      left=$("$CC" vpc DescribeRouterInterfaces --RegionId "$R" --profile "$P" \
             | jq -r --arg a "$ACC" --arg i "$INIT" '.RouterInterfaceSet.RouterInterfaceType[]?
                 | select(.RouterInterfaceId==$a or .RouterInterfaceId==$i) | .RouterInterfaceId' | wc -l)
      [ "$left" -eq 0 ] && break; sleep 10
    done
    echo "unpeer: done (remaining of our RIs: ${left:-?})"
  args:
    executable: /bin/bash
  changed_when: true
  failed_when: false
