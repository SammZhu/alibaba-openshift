---
# tasks/install_agent.yml — Agent-based Installer (installation_method=Agent-based)
# install monitoring, ON THE MIRROR ECS.  Included by 07-install-cluster-agent.yml.
#
# The agent assets (install_dir with auth/ + .openshift_install_state.json) live
# on the mirror ECS where 01 (iso_agent.yml) built them, and the mirror ECS is
# in-VPC so it resolves the cluster's PrivateZone (api.<cluster>.<domain>) and
# can run `openshift-install agent wait-for`.  We wait there, then scp the
# kubeconfig back to {{ output_dir }}/auth on the operator host (same location
# the AI path uses, so 08+ are unchanged).  No host-role assignment / manifest
# upload / install trigger — all baked into the agent ISO at 01; the install
# auto-starts when 06 (cluster-stack) boots the nodes.

- name: ABI — set mirror ECS ssh connection facts
  ansible.builtin.set_fact:
    _ssh_common_args: "-i {{ ssh_priv_key_file }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes"
    _ssh_proxy_args: "-o ProxyCommand='ssh -i {{ ssh_priv_key_file }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@{{ jump_host_ip }}'"
    _m_install_dir: /var/lib/quay-storage/agent-build/install

- name: ABI — set _ssh_root_mirror
  ansible.builtin.set_fact:
    _ssh_root_mirror: "ssh {{ _ssh_common_args }} {{ _ssh_proxy_args }} root@{{ mirror_private_ip }}"

# Where the agent assets + openshift-install live, and how to invoke it:
#   apsara (container build) — on THIS operator host: install_dir (auth/state) +
#     install_dir/bin/openshift-install (the 4.20 binary extracted during 06a).
#     Run locally; the Helper reaches the cluster (api-int) via the peering +
#     CloudDns.  No mirror-ECS ssh, no jump host.
#   public cloud — on the mirror ECS via ssh (openshift-install shipped there).
- name: ABI — resolve wait-for location (apsara = local operator host)
  ansible.builtin.set_fact:
    _abi_local: "{{ (cloud_platform | default('public')) == 'apsara' }}"
    _abi_dir: "{{ install_dir if ((cloud_platform | default('public')) == 'apsara') else _m_install_dir }}"

- name: ABI — resolve command wrapper (local vs ssh-to-mirror)
  ansible.builtin.set_fact:
    _abi_pre: "{{ ('export PATH=' ~ install_dir ~ '/bin:$PATH; ') if _abi_local else (_ssh_root_mirror ~ \" '\") }}"
    _abi_post: "{{ '' if _abi_local else \"'\" }}"

- name: ABI — assert agent assets exist (01/06 ran)
  ansible.builtin.shell: "{{ _abi_pre }}test -f {{ _abi_dir }}/.openshift_install_state.json{{ _abi_post }}"
  changed_when: false

# ABI monitoring is `openshift-install agent wait-for` (NOT oc/clusteroperator
# polling like the AI path) — it is the authoritative ABI monitor and surfaces
# the agent-specific stages oc can't see (host validations, discovery, Agent
# REST API, bootstrap Kube API, operator rollout).  We use its output/exit as
# the basis.  To avoid ansible's opaque "ASYNC POLL ... finished=0" heartbeat,
# we launch it in the background (poll: 0 → no heartbeat spam) and track it with
# async_status, which shows a meaningful "(N retries left)" countdown; the full
# wait-for output is dumped on completion (and tee'd to a log on the mirror).
# For a fully streaming view, run scripts/abi-monitor.sh in a second terminal
# (it runs the same `agent wait-for`).
- name: ABI — live-monitor hint
  ansible.builtin.debug:
    msg: >-
      Monitoring via `openshift-install agent wait-for` on the mirror ECS.
      Countdown below = still waiting; full output prints on completion.
      For a live stream, run scripts/abi-monitor.sh in another terminal.

# Phase 1: agent wait-for bootstrap-complete (authoritative).
- name: ABI — start bootstrap-complete monitor (agent wait-for, background)
  ansible.builtin.shell: "{{ _abi_pre }}set -o pipefail; openshift-install agent wait-for bootstrap-complete --dir {{ _abi_dir }} --log-level=info 2>&1 | tee {{ _abi_dir }}/wait-bootstrap.log{{ _abi_post }}"
  args:
    executable: /bin/bash
  async: 3600
  poll: 0
  register: _abi_bs_job
  changed_when: false

- name: "ABI — waiting for bootstrap-complete [the 'FAILED - RETRYING' line below is the normal heartbeat = still installing (~20-40 min); live detail: scripts/abi-monitor.sh]"
  ansible.builtin.async_status:
    jid: "{{ _abi_bs_job.ansible_job_id }}"
  register: _abi_bs
  until: _abi_bs.finished | bool
  retries: 160
  delay: 30
  failed_when: (_abi_bs.finished | bool) and (_abi_bs.rc | default(0) | int) != 0

- name: ABI — bootstrap-complete (agent wait-for output)
  ansible.builtin.debug:
    msg: "{{ (_abi_bs.stdout_lines | default(['bootstrap complete']))[-12:] }}"

# IMPORTANT ordering: harvest the kubeconfig and rewrite *.apps DNS *between*
# bootstrap-complete and install-complete — NOT after.  `wait-for
# install-complete` blocks until ALL cluster operators are Available, and
# authentication/console/ingress only converge once the *.apps wildcard
# resolves to a node running router-default.  The cluster-stack seeds *.apps
# with a placeholder (IngressVip), so if we waited for install-complete first
# we'd deadlock (operators wait on DNS, DNS rewrite waits on install-complete).
# The AI path doesn't hit this because it confirms via assisted-service, not
# `openshift-install wait-for`.  The kubeconfig from `agent create image` is a
# valid admin kubeconfig the moment bootstrap is up, so harvesting it here is
# safe.

# ── harvest credentials back to the operator host (same path the AI path uses) ──
- name: ABI — ensure local output auth dir exists
  ansible.builtin.file:
    path: "{{ output_dir }}/auth"
    state: directory
    mode: "0700"

# apsara: the assets are already local (install_dir/auth) — just copy across.
- name: ABI — copy kubeconfig + kubeadmin-password from local install_dir (apsara)
  ansible.builtin.copy:
    src: "{{ install_dir }}/auth/{{ item }}"
    dest: "{{ output_dir }}/auth/{{ item }}"
    mode: "0600"
    remote_src: true
  loop:
    - kubeconfig
    - kubeadmin-password
  when: _abi_local | bool

- name: ABI — scp kubeconfig + kubeadmin-password back from the mirror ECS
  when: not (_abi_local | bool)
  ansible.builtin.command:
    argv:
      - scp
      - -i
      - "{{ ssh_priv_key_file }}"
      - -o
      - StrictHostKeyChecking=no
      - -o
      - UserKnownHostsFile=/dev/null
      - -o
      - "ProxyCommand=ssh -i {{ ssh_priv_key_file }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@{{ jump_host_ip }}"
      - "root@{{ mirror_private_ip }}:{{ _m_install_dir }}/auth/{{ item }}"
      - "{{ output_dir }}/auth/{{ item }}"
  loop:
    - kubeconfig
    - kubeadmin-password
  register: _abi_kc_scp
  retries: 3
  delay: 10
  until: _abi_kc_scp.rc == 0
  changed_when: true

- name: ABI — set kubeconfig_path fact
  ansible.builtin.set_fact:
    kubeconfig_path: "{{ output_dir }}/auth/kubeconfig"

- name: ABI — persist kubeconfig_path to state
  ansible.builtin.include_tasks: ../tasks/save_state.yml
  vars:
    new_state:
      kubeconfig_path: "{{ kubeconfig_path }}"

# Method-agnostic post-install wiring (same as the AI 07 path does inline):
# stage kubeconfig on the jump host (/root/kubeconfig — 08+ run oc there) and
# rewrite the *.apps wildcard PrivateZone record to a real router node so the
# console/ingress/auth operators can converge.  MUST run before install-complete
# (see ordering note above).
# apsara SNO: *.apps already resolves to the single node IP in CloudDns (the one
# node runs router-default), and there is no jump host — so the placeholder
# rewrite + jump-host staging don't apply.  08+ run oc on the operator host.
- name: ABI — stage kubeconfig on jump host + rewrite *.apps DNS
  ansible.builtin.include_tasks: ../tasks/post_install_apps_dns.yml
  when: not (_abi_local | bool)

# Phase 2: agent wait-for install-complete (authoritative).  *.apps was rewritten
# above, so the ingress/console/auth operators can converge — no deadlock.
- name: ABI — start install-complete monitor (agent wait-for, background)
  ansible.builtin.shell: "{{ _abi_pre }}set -o pipefail; openshift-install agent wait-for install-complete --dir {{ _abi_dir }} --log-level=info 2>&1 | tee {{ _abi_dir }}/wait-install.log{{ _abi_post }}"
  args:
    executable: /bin/bash
  async: 7200
  poll: 0
  register: _abi_ic_job
  changed_when: false

- name: "ABI — waiting for install-complete [the 'FAILED - RETRYING' line below is the normal heartbeat = operators still converging; live detail: scripts/abi-monitor.sh]"
  ansible.builtin.async_status:
    jid: "{{ _abi_ic_job.ansible_job_id }}"
  register: _abi_ic
  until: _abi_ic.finished | bool
  retries: 280
  delay: 30
  failed_when: (_abi_ic.finished | bool) and (_abi_ic.rc | default(0) | int) != 0

- name: ABI — install-complete (agent wait-for output)
  ansible.builtin.debug:
    msg: "{{ (_abi_ic.stdout_lines | default(['install complete']))[-15:] }}"

- name: ABI — install complete
  ansible.builtin.debug:
    msg: >-
      Agent-based install complete. kubeconfig at {{ output_dir }}/auth/kubeconfig
      and on the jump host at /root/kubeconfig; *.apps DNS rewritten. 08+ (site-post)
      run oc on the jump host as usual.
