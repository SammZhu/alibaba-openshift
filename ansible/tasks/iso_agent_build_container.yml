# iso_agent_build_container.yml — build the agent ISO on the OPERATOR host inside
# a UBI9 container (podman), instead of on the mirror ECS.
#
# WHY: `openshift-install agent create image` must run on glibc matching the OCP
# clients.  OCP 4.16+ ships RHEL9 clients (glibc 2.34); the mirror ECS runs
# Alibaba Cloud Linux 3 (glibc 2.32) and cannot run them.  A UBI9 container gives
# a fixed RHEL9 glibc regardless of the operator host OS, so this path is portable
# to any operator host that has podman (the host need NOT be RHEL9).
#
# The build runs with --network=host so it reaches the in-VPC mirror registry
# (mirror_private_ip:8443) over the VPC peering.  Output (agent.x86_64.iso +
# boot-artifacts/) lands in the LOCAL install_dir, then is pushed to the mirror
# ECS so the existing downstream steps (OSS upload + in-VPC rootfs HTTP serve +
# ImportImage) run unchanged.
#
# RESUME: the ~30 min build is skipped if the mirror ECS already has {{ _m_iso }}
# (a prior build).  Set agent_iso_force_rebuild=true to force a rebuild (do this
# whenever install-config/agent-config changed — the cached ISO would be stale).
#
# Inputs from iso_agent.yml: install_dir, mirror_private_ip, openshift_version,
#   region, output_dir (CA at {{ output_dir }}/mirror-ca.crt), mirror_init_user/
#   mirror_init_password, _ssh_root_mirror, _m_iso, _m_install_dir.
# Vars: agent_build_image (default UBI9), agent_bootstrap_oc (host oc for extract),
#   agent_iso_force_rebuild (default false).

- name: "container-build: assert podman is available on the operator host"
  ansible.builtin.command: podman --version
  register: _cb_podman
  changed_when: false

- name: "container-build: check for an existing ISO on the mirror (resume)"
  ansible.builtin.shell: "{{ _ssh_root_mirror }} 'test -f {{ _m_iso }} && echo yes || echo no'"
  register: _cb_iso_present
  changed_when: false

- name: "container-build: decide whether to (re)build the ISO"
  ansible.builtin.set_fact:
    _cb_build_iso: "{{ (agent_iso_force_rebuild | default(false) | bool)
                       or ((_cb_iso_present.stdout | trim) != 'yes') }}"

- name: "container-build: reuse existing ISO on mirror (skip ~30 min rebuild)"
  ansible.builtin.debug:
    msg: >-
      Existing {{ _m_iso }} on the mirror ECS — skipping the container rebuild.
      Set agent_iso_force_rebuild=true to force a rebuild (needed if the
      install-config / agent-config changed).
  when: not _cb_build_iso

- name: "container-build: build + push the agent ISO"
  when: _cb_build_iso
  block:
    - name: "container-build: registry-config with the mirror auth (for client extract)"
      ansible.builtin.copy:
        dest: "{{ install_dir }}/abi-rc.json"
        mode: "0600"
        content: >-
          {"auths":{"{{ mirror_private_ip }}:8443":{"auth":"{{
            ((mirror_init_user | default('mirror-admin')) + ':' + mirror_init_password) | b64encode }}"}}}
      no_log: true

    # openshift-install shells out to `oc image extract` WITHOUT --registry-config,
    # so it relies on the ambient registry auth.  Without it the ICSP redirect to
    # the mirror can't authenticate and oc silently falls back to the public
    # registry — which means every ISO build pulls machine-os-images (~1 GB of
    # RHCOS) across the border instead of from the mirror in the same VPC, taking
    # 8+ minutes instead of seconds.  Give the container a full auth file.
    - name: "container-build: ambient registry auth for openshift-install's child oc"
      ansible.builtin.copy:
        dest: "{{ install_dir }}/auth.json"
        content: "{{ _pull_secret_effective }}"
        mode: "0600"
      no_log: true

    # ICSP so `oc adm release extract` redirects the component pulls (the
    # ocp-v4.0-art-dev @sha256 images holding oc/openshift-install) from quay.io to
    # the mirror.  Without it, --from only locates the release image and the
    # component pulls hit quay.io -> unauthorized.
    - name: "container-build: ICSP mapping quay.io -> mirror (for client extract)"
      ansible.builtin.copy:
        dest: "{{ install_dir }}/abi-icsp.yaml"
        mode: "0644"
        content: |
          apiVersion: operator.openshift.io/v1alpha1
          kind: ImageContentSourcePolicy
          metadata:
            name: mirror
          spec:
            repositoryDigestMirrors:
            - source: quay.io/openshift-release-dev/ocp-release
              mirrors: ["{{ mirror_private_ip }}:8443/openshift/release-images"]
            - source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
              mirrors: ["{{ mirror_private_ip }}:8443/openshift/release"]

    # Extract the version-matched oc + openshift-install FROM the mirror release
    # into a local bin/ dir.  These are RHEL9 binaries — they run INSIDE the UBI9
    # container (not necessarily on the host).  A bootstrap oc only pulls them out.
    # Delete before extracting: if any process still has the old binary mapped
    # (a lingering `openshift-install agent wait-for`, a previous build), writing
    # over it fails with ETXTBSY and the whole run dies.  Unlinking always works —
    # the running process keeps its inode, the extract creates a fresh file.
    - name: "container-build: remove previously-extracted clients"
      ansible.builtin.file:
        path: "{{ install_dir }}/bin/{{ item }}"
        state: absent
      loop: [oc, oc.real, openshift-install, kubectl]

    - name: "container-build: extract oc + openshift-install {{ openshift_version }} from mirror"
      ansible.builtin.command:
        argv:
          - "{{ agent_bootstrap_oc | default('oc') }}"
          - adm
          - release
          - extract
          - --command={{ item }}
          - --to={{ install_dir }}/bin
          - --from={{ mirror_private_ip }}:8443/openshift/release-images:{{ openshift_version }}-x86_64
          - --registry-config={{ install_dir }}/abi-rc.json
          - --icsp-file={{ install_dir }}/abi-icsp.yaml
          - --insecure=true
      loop:
        - openshift-install
        - oc
      register: _cb_extract
      changed_when: true

    # Repo plumbing for the one-time image build below.  UBI's own public repos
    # (ubi-9-baseos/appstream) do the actual work; if the host uses RHUI, lend
    # those too since they are usually faster from inside the VPC.  Never mount
    # over /etc/yum.repos.d — that hides UBI's repos and leaves only the host's
    # entitlement-requiring rhel-9-* ones, which fails outright.
    - name: "container-build: look for host RHUI config to lend the container"
      ansible.builtin.stat:
        path: /etc/pki/rhui
      register: _cb_rhui

    # Mount the host repos at a SIDE path, never over /etc/yum.repos.d.  Replacing
    # that directory hides UBI's own public repos and leaves only the host's
    # entitlement-requiring rhel-9-* ones, so dnf goes to cdn.redhat.com hunting
    # for a client certificate the container doesn't have and fails outright —
    # that is exactly how the first attempt broke.  The build script copies only
    # RHUI definitions across (if any); UBI's repos stay and do the actual work.
    - name: "container-build: name of the prepared build image"
      ansible.builtin.set_fact:
        _cb_base_image: "{{ agent_build_image_prepared | default('localhost/agent-build-nmstate:latest') }}"

    - name: "container-build: repo mount args"
      ansible.builtin.set_fact:
        _cb_repo_mounts: >-
          {{ ['-v', '/etc/yum.repos.d:/host-repos:ro',
              '-v', '/etc/pki/rhui:/etc/pki/rhui:ro']
             if _cb_rhui.stat.exists else [] }}

    # Bake nmstate into a local image ONCE instead of installing it on every build:
    # the UBI repos live on cdn.redhat.com and from China that dnf takes anywhere
    # from 80 seconds to "still going after 10 minutes".  Rebuilds then start
    # instantly, and a flaky CDN can no longer stall an ISO build.
    - name: "container-build: does the prepared build image exist?"
      ansible.builtin.command: podman image exists {{ _cb_base_image }}
      register: _cb_base_present
      changed_when: false
      failed_when: false

    - name: "container-build: build it once (UBI9 + nmstate)"
      when: _cb_base_present.rc != 0
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          podman build --network=host -t {{ _cb_base_image }} -f - . <<'CONTAINERFILE'
          FROM {{ agent_build_image | default('registry.access.redhat.com/ubi9/ubi:latest') }}
          RUN dnf install -y --setopt=timeout=60 --setopt=retries=3 nmstate \
              && dnf clean all \
              && nmstatectl --version
          CONTAINERFILE
        executable: /bin/bash
      register: _cb_base_build
      changed_when: true
      # A slow CDN shouldn't fail instantly; give it room, but bounded.
      retries: 2
      delay: 10
      until: _cb_base_build.rc == 0

    # openshift-install shells out to `oc image extract` with hardcoded quay.io
    # references and its own --icsp-file, and oc does not honour that redirect
    # (measured: --icsp-file 80s, --idms-file 61s, registries.conf ignored — all
    # still hitting the CDN, and repeatedly hanging for hours on a ~1 GB pull).
    # Since /work/bin/oc is OURS, stop asking oc to redirect and rewrite the
    # reference before it ever sees it: same digest, mirror repository.
    - name: "container-build: install an oc wrapper that rewrites release refs to the mirror"
      ansible.builtin.copy:
        dest: "{{ install_dir }}/bin/oc-mirror-wrapper"
        mode: "0755"
        content: |
          #!/bin/bash
          # quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:X
          #   -> {{ mirror_private_ip }}:8443/openshift/release@sha256:X
          # quay.io/openshift-release-dev/ocp-release@sha256:X
          #   -> {{ mirror_private_ip }}:8443/openshift/release-images@sha256:X
          args=()
          for a in "$@"; do
            case "$a" in
              quay.io/openshift-release-dev/ocp-v4.0-art-dev@*)
                args+=("{{ mirror_private_ip }}:8443/openshift/release@${a#*@}") ;;
              quay.io/openshift-release-dev/ocp-release@*)
                args+=("{{ mirror_private_ip }}:8443/openshift/release-images@${a#*@}") ;;
              *) args+=("$a") ;;
            esac
          done
          exec /work/bin/oc.real "${args[@]}"

    - name: "container-build: write the in-container build script"
      ansible.builtin.copy:
        dest: "{{ install_dir }}/agent-build.sh"
        mode: "0755"
        content: |
          #!/bin/bash
          set -euo pipefail
          # Trust the mirror registry CA (openshift-install pulls the release over TLS).
          cp /work/mirror-ca.crt /etc/pki/ca-trust/source/anchors/mirror-ca.crt
          update-ca-trust
          # A static-network agent-config needs nmstatectl to validate the nmstate
          # YAML at ISO-build time.  It is baked into the prepared build image, so
          # this is only a guard against running with the wrong base image.
          if ! command -v nmstatectl >/dev/null 2>&1; then
            echo "ERROR: nmstatectl missing from {{ _cb_base_image }} — rebuild that image" >&2
            exit 1
          fi
          # Activate the rewriting wrapper by taking over the path openshift-install
          # actually resolves: move the real binary aside and stand the wrapper in
          # its place.  Doing this at /work/bin/oc rather than earlier on PATH means
          # it holds however the child is spawned — PATH order, an absolute path, or
          # a lookup relative to the installer's own directory.
          mv -f /work/bin/oc /work/bin/oc.real
          cp -f /work/bin/oc-mirror-wrapper /work/bin/oc
          chmod 0755 /work/bin/oc /work/bin/oc.real
          export PATH=/work/bin:$PATH
          # Read by `oc` (and thus by the extracts openshift-install runs itself),
          # so mirror-redirected pulls authenticate instead of falling back to the
          # public registry.
          export REGISTRY_AUTH_FILE=/install/auth.json
          mkdir -p /root/.docker && cp -f /install/auth.json /root/.docker/config.json
          # NOTE on the slow step, so nobody re-litigates it: openshift-install
          # runs `oc image extract` itself to pull machine-os-images (~1 GB of
          # RHCOS), and that pull always goes to quay.io over the border even
          # though the identical image sits in the mirror one VPC hop away —
          # costing ~8 min per ISO rebuild.  oc uses OpenShift's own registry
          # client: it ignores registries.conf (that only binds podman/skopeo),
          # and honours only --icsp-file/--idms-file, which openshift-install
          # generates and passes itself.  Measured: --icsp-file 80s, --idms-file
          # 61s, both still hitting the CDN (verified on the sockets); writing
          # registries.conf changed nothing.  Accepted as an upstream constraint.
          export XDG_CACHE_HOME=/install/.cache TMPDIR=/install/tmp
          mkdir -p "$XDG_CACHE_HOME" "$TMPDIR"
          cd /install
          rm -f agent.x86_64.iso .openshift_install_state.json
          openshift-install agent create image --dir /install --log-level=info
          oc version --client
          openshift-install version

    - name: "container-build: openshift-install agent create image (UBI9 container, host network)"
      ansible.builtin.command:
        argv: "{{ ['podman', 'run', '--rm', '--network=host', '--security-opt=label=disable',
                   '-e', 'http_proxy=' ~ (cloud_env.APSARA_PROXY | default('')),
                   '-e', 'https_proxy=' ~ (cloud_env.APSARA_PROXY | default('')),
                   '-e', 'no_proxy=' ~ mirror_private_ip ~ ',localhost,127.0.0.1',
                   '-v', install_dir ~ ':/install:z',
                   '-v', install_dir ~ '/bin:/work/bin:z',
                   '-v', output_dir ~ '/mirror-ca.crt:/work/mirror-ca.crt:ro']
                  + _cb_repo_mounts
                  + ['--entrypoint', '/bin/bash',
                     _cb_base_image,
                     '/install/agent-build.sh'] }}"
      register: _cb_build
      changed_when: true

    - name: "container-build: show build tail"
      ansible.builtin.debug:
        msg: "{{ _cb_build.stdout_lines[-20:] | default([]) }}"

    - name: "container-build: assert ISO was produced"
      ansible.builtin.stat:
        path: "{{ install_dir }}/agent.x86_64.iso"
      register: _cb_out
      failed_when: not _cb_out.stat.exists

    # ── push artifacts to the mirror ECS so the existing downstream steps run ────
    - name: "container-build: ensure build dirs on the mirror ECS"
      ansible.builtin.shell: >-
        {{ _ssh_root_mirror }} 'mkdir -p {{ _m_install_dir }}/boot-artifacts'
      changed_when: true

    # pipefail: the status otherwise comes from the remote tar, so a local tar
    # that failed (missing ISO, no disk) would still report success and the
    # mirror would quietly receive nothing.
    - name: "container-build: push agent ISO to the mirror ECS (tar over ssh)"
      ansible.builtin.shell: |
        set -o pipefail
        tar -C {{ install_dir }} -czf - agent.x86_64.iso \
          | {{ _ssh_root_mirror }} 'tar -C {{ _m_install_dir }} -xzf -'
      args:
        executable: /bin/bash
      changed_when: true

    - name: "container-build: push boot-artifacts (rootfs) to the mirror ECS"
      ansible.builtin.shell: |
        set -o pipefail
        tar -C {{ install_dir }} -czf - boot-artifacts \
          | {{ _ssh_root_mirror }} 'tar -C {{ _m_install_dir }} -xzf -'
      args:
        executable: /bin/bash
      changed_when: true

- name: "container-build: agent ISO ready on the mirror ECS"
  ansible.builtin.debug:
    msg: >-
      ✓ agent ISO at {{ _m_iso }} on the mirror ECS
      ({{ 'built in UBI9 container + pushed' if _cb_build_iso else 'reused existing (resume)' }}).
      Downstream OSS upload / rootfs serve / ImportImage run unchanged.
