---
# Build the cluster-stack ROS parameter list into `_cluster_stack_params`.
# Shared by 06-create-cluster-stack.yml (initial create) and
# 06b-reimage-masters.yml (Agent-based phase-2 stack update) so the two never
# drift.  Caller MUST set:
#   cluster_stack_image_id   — value for the ImageId parameter.  The placeholder
#                              system image on the Agent-based phase-1 create; the
#                              real ecs_image_id on AI create and on ABI phase-2.
# Caller must already have loaded state + mirror_defaults and resolved
# _effective_control_plane_count / _effective_compute_count and _ssh_pub_slurp.

- name: cluster_stack_params — assemble ROS Parameters
  ansible.builtin.set_fact:
    _cluster_stack_params:
      # ── mirror-stack outputs passed through ──────────────────────
      - ParameterKey: VpcId
        ParameterValue: "{{ mirror_vpc_id }}"
      - ParameterKey: VpcCidr
        ParameterValue: "{{ mirror_vpc_cidr | default(vpc_cidr) }}"
      - ParameterKey: PrivateVSwitchId
        ParameterValue: "{{ mirror_private_vsw_1 }}"
      - ParameterKey: PrivateVSwitch2Id
        ParameterValue: "{{ mirror_private_vsw_2 }}"
      - ParameterKey: PrivateVSwitch3Id
        ParameterValue: "{{ mirror_private_vsw_3 | default('') }}"
      - ParameterKey: ZoneId
        ParameterValue: "{{ mirror_zone_id | default(zone) }}"
      - ParameterKey: ZoneId2
        ParameterValue: "{{ mirror_zone_id2 | default(zone2) }}"
      # Strictly from the mirror stack's ACTUAL third VSwitch — never fall back to
      # group_vars `zone3`.  ZoneId3 and PrivateVSwitch3Id must move together: if
      # the mirror has no vsw3, ZoneId3 stays "" so HasZone3 is false and we never
      # emit a zone3 NLB ZoneMapping / master-3 VSwitch ref with an empty
      # PrivateVSwitch3Id — that inconsistent combo makes CreateStack reject the
      # entire stack at request time (no_log-hidden failure).  Phase 06 asserts
      # vsw3 is present before we get here when ABI multi-AZ is requested.
      - ParameterKey: ZoneId3
        ParameterValue: "{{ mirror_zone_id3 | default('') }}"
      # Positive boolean that actually gates HasZone3 (ROS Fn::Not is broken).
      # True iff the mirror stack really built a third VSwitch — so ZoneId3 /
      # PrivateVSwitch3Id / EnableZone3 all move together and we never emit a
      # zone3 mapping with an empty VSwitchId.
      - ParameterKey: EnableZone3
        ParameterValue: "{{ 'true' if (mirror_private_vsw_3 | default('') | length > 0) else 'false' }}"
      - ParameterKey: NodeRamRoleName
        ParameterValue: "{{ mirror_node_ram_role }}"
      - ParameterKey: JumpHostSecurityGroupId
        ParameterValue: "{{ jump_host_sg_id if (jump_host_sg_id | default('') | length > 0) else 'none' }}"
      - ParameterKey: EnableJumpHostSsh
        ParameterValue: "{{ 'true' if (jump_host_sg_id | default('') | length > 0) else 'false' }}"
      # ── cluster-specific ─────────────────────────────────────────
      - ParameterKey: ClusterName
        ParameterValue: "{{ cluster_name }}"
      - ParameterKey: BaseDomain
        ParameterValue: "{{ base_domain }}"
      - ParameterKey: Region
        ParameterValue: "{{ region }}"
      # ENI-first: empty on the ABI phase-1 (ENI-only) create, real image on
      # AI create and ABI phase-2 update.  See ImageId description in
      # ros-templates/cluster-stack.yaml.
      - ParameterKey: ImageId
        ParameterValue: "{{ cluster_stack_image_id }}"
      - ParameterKey: ControlPlaneCount
        ParameterValue: "{{ _effective_control_plane_count | string }}"
      - ParameterKey: ControlPlaneInstanceType
        ParameterValue: "{{ control_plane_type }}"
      # ComputeCount / EnableWorkers drive the ROS WorkerInstanceGroup.  With
      # split_ingress_workers on, the workers come from WorkerInstance1/2
      # instead, so BOTH are forced off here — otherwise ROS would build the
      # InstanceGroup as well and the cluster would come up with twice the
      # workers it was asked for.
      #
      # Note this deliberately diverges from install-config: that keeps
      # _effective_compute_count (2), because the cluster really does have two
      # workers and 07's expected_hosts must count them.  Only the ROS side
      # goes to zero, because a different resource is creating them.
      - ParameterKey: ComputeCount
        ParameterValue: >-
          {{ 0 if (split_ingress_workers | default(false) | bool)
             else (_effective_compute_count | int) }}
      # Positive boolean that actually gates HasWorkers (ROS Fn::Not is broken).
      # True iff ComputeCount > 0 — normally false (workers come via CAPA phase 12).
      - ParameterKey: EnableWorkers
        ParameterValue: >-
          {{ 'false' if (split_ingress_workers | default(false) | bool)
             else ('true' if (_effective_compute_count | int > 0) else 'false') }}
      # Dedicated ingress workers: WorkerInstance1/2 become the *.apps backend
      # instead of the masters, which is what stops an in-cluster caller on a
      # master from being routed back to its own node by the CLB.
      - ParameterKey: EnableSplitWorkers
        ParameterValue: "{{ 'true' if (split_ingress_workers | default(false) | bool) else 'false' }}"
      - ParameterKey: Worker1Ip
        ParameterValue: "{{ worker1_ip | default('10.0.16.7') }}"
      - ParameterKey: Worker2Ip
        ParameterValue: "{{ worker2_ip | default('10.0.32.7') }}"
      - ParameterKey: ComputeInstanceType
        ParameterValue: "{{ compute_type }}"
      - ParameterKey: SystemDiskCategory
        ParameterValue: "{{ system_disk_category }}"
      - ParameterKey: SystemDiskSize
        ParameterValue: "{{ system_disk_size | string }}"
      - ParameterKey: InstallDiskSize
        ParameterValue: "{{ install_disk_size | string }}"
      - ParameterKey: RendezvousIp
        ParameterValue: "{{ rendezvous_ip }}"
      - ParameterKey: IngressVip
        ParameterValue: "{{ ingress_vip }}"
      - ParameterKey: InstallationMethod
        ParameterValue: "{{ installation_method }}"
      - ParameterKey: SshPublicKey
        ParameterValue: "{{ _ssh_pub_slurp.content | b64decode | trim }}"
