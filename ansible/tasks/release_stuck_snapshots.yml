# release_stuck_snapshots.yml — let a namespace actually delete.
#
# A VolumeSnapshot carries finalizers that the snapshot controller only clears
# once it has settled with the driver.  A snapshot that never became ready — the
# CSI driver could not reach the cloud API when it was taken, say — holds those
# finalizers forever, and `oc delete namespace` then hangs until it times out and
# reports something that has nothing to do with the real problem.
#
# SAFETY: only snapshots with readyToUse != true are released, and a READY one is
# never touched — force-deleting that would orphan a real cloud snapshot.
#
# But do NOT read "unready" as "nothing exists in the cloud".  On Apsara the
# opposite is typical: the driver creates the snapshot successfully and then
# crashes reading the response back, so the Kubernetes object stays unready while
# a finished snapshot sits in the cloud.  Three such orphans accumulated before
# this was understood.  Releasing the finalizer here is still right — the object
# is unusable either way — but it does not free the cloud resource, so the
# warning below says to go and look.
#
# Inputs: rss_ns (namespace), kubeconfig_file.

- name: "release-snapshots — list snapshots in {{ rss_ns }}"
  ansible.builtin.command:
    argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, "{{ rss_ns }}", get,
           volumesnapshot, -o, json]
  register: _rss_list
  changed_when: false
  failed_when: false

- name: "release-snapshots — pick the ones that never became ready"
  ansible.builtin.set_fact:
    _rss_stuck: >-
      {{ ((_rss_list.stdout | default('{}') | from_json)['items'] | default([]))
         | rejectattr('status.readyToUse', 'defined') | list
         + ((_rss_list.stdout | default('{}') | from_json)['items'] | default([]))
           | selectattr('status.readyToUse', 'defined')
           | rejectattr('status.readyToUse', 'equalto', true) | list }}
  when: _rss_list.rc | default(1) == 0

- name: "release-snapshots — nothing stuck"
  ansible.builtin.debug:
    msg: "No unready snapshots holding {{ rss_ns }}."
  when: (_rss_stuck | default([]) | length) == 0

- name: "release-snapshots — release the unready ones"
  when: (_rss_stuck | default([]) | length) > 0
  block:
    - name: "release-snapshots — WARN which snapshots are being released"
      ansible.builtin.debug:
        msg: >-
          {{ _rss_stuck | map(attribute='metadata.name') | join(', ') }} never
          became ready; dropping their finalizers so {{ rss_ns }} can delete.
          An unready object does NOT mean the cloud is clean — the snapshot may
          well have completed there before the driver failed reading it back.
          Check for orphans and remove them by hand: DescribeSnapshots, then
          delete only the snapshot-<uuid> entries. SnapshotForImage-* back your
          custom images and cluster1-mirror-data backs the mirror disk.

    - name: "release-snapshots — drop the VolumeSnapshot finalizers"
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", -n, "{{ rss_ns }}", patch,
               volumesnapshot, "{{ item.metadata.name }}", --type=merge,
               -p, '{"metadata":{"finalizers":null}}']
      loop: "{{ _rss_stuck }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      changed_when: true
      failed_when: false

    # The content object is cluster-scoped, so it outlives the namespace and
    # keeps the snapshot from going away on its own.
    - name: "release-snapshots — drop the VolumeSnapshotContent finalizers"
      ansible.builtin.command:
        argv: [oc, --kubeconfig, "{{ kubeconfig_file }}", patch,
               volumesnapshotcontent, "{{ item }}", --type=merge,
               -p, '{"metadata":{"finalizers":null}}']
      loop: >-
        {{ _rss_stuck | map(attribute='status.boundVolumeSnapshotContentName')
           | select('defined') | select('string') | list }}
      changed_when: true
      failed_when: false
