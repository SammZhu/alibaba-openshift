---
# Resolve the operator's Alibaba AccessKey pair into facts _ak / _sk from the
# right source per platform, so callers use {{ _ak }} / {{ _sk }} regardless:
#   apsara -> _cloud_creds (set by tasks/harden_cloud_env.yml), else cloud_env.AK/SK
#             — the aliyun CLI credential store
#             (~/.aliyun/config.json) does not exist on the Apsara operator host;
#             creds come from cloud_env (the same pair apsara-rpc signs with).
#   public -> ~/.aliyun/config.json for {{ aliyun_profile }} (aliyun CLI's store).
#
# no_log throughout: these facts are the raw secret.

# _cloud_creds is where tasks/harden_cloud_env.yml parks the pair after taking
# it out of cloud_env (so it stops reaching command lines).  Fall back to
# cloud_env for a playbook run on its own, which never passes through the
# hardening step and still has the untouched dict from group_vars.
- name: "resolve_ak_sk — from _cloud_creds, else cloud_env (apsara)"
  ansible.builtin.set_fact:
    _ak: "{{ (_cloud_creds | default({})).AK | default(cloud_env.AK, true) }}"
    _sk: "{{ (_cloud_creds | default({})).SK | default(cloud_env.SK, true) }}"
  no_log: true
  when: (cloud_platform | default('public')) == 'apsara'

- name: "resolve_ak_sk — read from ~/.aliyun/config.json (public)"
  ansible.builtin.command:
    argv:
      - jq
      - -r
      - '.profiles[] | select(.name=="{{ aliyun_profile }}") | .access_key_id + " " + .access_key_secret'
      - "{{ lookup('env', 'HOME') }}/.aliyun/config.json"
  register: _aksk_raw
  changed_when: false
  no_log: true
  when: (cloud_platform | default('public')) != 'apsara'

- name: "resolve_ak_sk — split into facts (public)"
  ansible.builtin.set_fact:
    _ak: "{{ _aksk_raw.stdout.split(' ')[0] }}"
    _sk: "{{ _aksk_raw.stdout.split(' ')[1] }}"
  no_log: true
  when: (cloud_platform | default('public')) != 'apsara'

- name: "resolve_ak_sk — assert both resolved"
  ansible.builtin.assert:
    that:
      - (_ak | default('') | length) > 0
      - (_sk | default('') | length) > 0
    fail_msg: >-
      Could not resolve AK/SK from
      {{ 'cloud_env.AK/SK (apsara)' if (cloud_platform | default('public')) == 'apsara'
         else 'profile ' + aliyun_profile + ' in ~/.aliyun/config.json' }}.
    quiet: true
  no_log: true
