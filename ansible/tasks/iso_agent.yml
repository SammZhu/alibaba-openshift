---
# tasks/iso_agent.yml — Agent-based Installer (installation_method=Agent-based)
# ISO build, ON THE MIRROR ECS (inside the VPC).
#
# Why the mirror ECS: `openshift-install agent create image` pulls the OCP
# release locally to assemble the agent ISO.  The mirror ECS already hosts the
# release at localhost:8443 (fastest, trusts its own CA), has podman (for
# coreos-installer), NAT egress (to fetch the pinned installer), a 200 GB data
# disk with ~90 GB free, and a RAM role with OSS+ImportImage perms — so the whole
# build -> clone-hook inject -> OSS upload -> ImportImage flow stays in-VPC.  The
# RHEL8 operator host only RENDERS the configs (per the render-on-operator rule)
# and orchestrates over ssh; nothing but the rendered install_dir is copied to
# the mirror ECS (no repo, no git).  All build scratch goes on the data disk
# ({{ _m_build_dir }}), never the 40 GB system disk.
#
# Included by 06a-build-agent-iso.yml when installation_method == 'agent'.
# Prereqs (site-agent.yml order): 03/04/05 mirror ran -> state has
# mirror_private_ip / jump_host_ip / mirror CA at {{ output_dir }}/mirror-ca.crt
# / mirror_vpc_id / mirror_private_vsw_1; group_vars has rendezvous_ip.

- name: ABI — resolve effective control-plane / compute counts per cluster_topology
  ansible.builtin.set_fact:
    _eff_control_plane_count: "{{ 1 if (cluster_topology | default('ha')) == 'sno' else (control_plane_count | int) }}"
    _eff_compute_count: "{{ 0 if (cluster_topology | default('ha')) == 'sno' else (compute_count | int) }}"

# ── ssh/scp to the mirror ECS via the jump host (same pattern as 04) ──────────
- name: ABI — set mirror ECS ssh/scp connection facts
  ansible.builtin.set_fact:
    _ssh_keepalive: "-o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes"
    _ssh_common_args: "-i {{ ssh_priv_key_file }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes"
    # Jump host (public cloud) -> ProxyCommand.  Direct reachability (apsara VPC
    # peering / BYO, jump_host_ip empty) -> no ProxyCommand, connect straight to
    # mirror_private_ip.  Same pattern as 04-prepare-mirror.yml.
    _ssh_proxy_args: >-
      {{ ("-o ProxyCommand='ssh -i " ~ ssh_priv_key_file ~ " -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@" ~ jump_host_ip ~ "'")
         if (jump_host_ip | default('')) | length > 0 else "" }}
    # All build artifacts live on the 200 GB data disk, never the 40 GB system disk.
    _m_build_dir: /var/lib/quay-storage/agent-build
    _m_install_dir: /var/lib/quay-storage/agent-build/install
    _m_tmp: /var/lib/quay-storage/agent-build/tmp
    _m_iso: /var/lib/quay-storage/agent-build/install/agent.x86_64.iso
    _oss_internal_endpoint: "{{ _oss_int_endpoint }}"
    oss_object: "agent-{{ cluster_name }}.iso"

- name: ABI — set _ssh_root_mirror
  ansible.builtin.set_fact:
    _ssh_root_mirror: "ssh {{ _ssh_common_args }} {{ _ssh_proxy_args }} root@{{ mirror_private_ip }}"

# Build location for the agent ISO:
#   mirror-ecs (default) — build on the mirror ECS (needs its glibc to match the
#     OCP clients; fine when the operator/mirror are RHEL8-era).
#   container            — build on THIS operator host in a UBI9 container (podman);
#     portable + required when the mirror ECS glibc is too old for RHEL9 clients
#     (Alibaba Cloud Linux 3 glibc 2.32 vs OCP 4.16+ clients needing 2.34).
- name: ABI — resolve agent-ISO build location
  ansible.builtin.set_fact:
    _agent_build_container: "{{ (agent_iso_build | default('mirror-ecs')) == 'container' }}"

- name: ABI — assert prerequisites
  ansible.builtin.assert:
    that:
      - mirror_enabled | default(false) | bool
      - mirror_private_ip is defined and mirror_private_ip | length > 0
      # apsara: Helper reaches mirror_private_ip directly via VPC peering — no jump host.
      - (jump_host_ip | default('') | length > 0) or (cloud_platform | default('public')) == 'apsara'
      - rendezvous_ip is defined and rendezvous_ip | length > 0
      - mirror_vpc_id is defined and mirror_vpc_id | length > 0
      - mirror_private_vsw_1 is defined and mirror_private_vsw_1 | length > 0
    fail_msg: >-
      ABI build needs a running mirror (03/04/05) + a route to it (jump host on
      public cloud, or direct/peering on apsara) + rendezvous_ip.  mirror_enabled
      must be true (the agent ISO is built on the mirror ECS).

# ── pull secret (+ mirror auth) + ssh key + mirror CA — for rendering ────────
- name: ABI — read pull secret + ssh public key
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ pull_secret_file }}"
    - "{{ ssh_pub_key_file }}"
  register: _abi_slurps
  no_log: true

- name: ABI — set ssh key + parse pull secret
  ansible.builtin.set_fact:
    _ssh_pub_key: "{{ _abi_slurps.results[1].content | b64decode | trim }}"
    _abi_pull_parsed: "{{ _abi_slurps.results[0].content | b64decode | from_json }}"
  no_log: true

- name: ABI — resolve mirror init password from state
  ansible.builtin.set_fact:
    _mirror_init_password_resolved: >-
      {{ mirror_init_password
         if (mirror_init_password | default('') | length > 0)
         else lookup('password', '/dev/null length=20 chars=ascii_letters,digits') }}
  no_log: true

- name: ABI — augment pull secret with mirror auth
  ansible.builtin.set_fact:
    _pull_secret_effective: >-
      {{ (_abi_pull_parsed
          | combine({'auths':
              _abi_pull_parsed.auths
              | combine({ (mirror_private_ip + ':8443'): {
                  'auth': ((mirror_init_user | default('mirror-admin')) + ':' + _mirror_init_password_resolved) | b64encode,
                  'email': 'mirror-registry@localhost'
                }})
          }))
         | to_json }}
  no_log: true

- name: ABI — slurp mirror CA cert
  ansible.builtin.slurp:
    src: "{{ output_dir }}/mirror-ca.crt"
  register: _abi_mirror_ca_slurp

- name: ABI — set mirror CA cert fact
  ansible.builtin.set_fact:
    _mirror_ca_cert: "{{ _abi_mirror_ca_slurp.content | b64decode }}"

# ── render configs + manifests into a LOCAL staging dir on the operator host ──
# (render-on-operator rule); this dir is then scp'd to the mirror ECS.
# mirror-ECS path: wipe + recreate (fresh render, then scp'd to the mirror).
# container path: DO NOT wipe — the build output (auth/, .openshift_install_state.json,
# bin/openshift-install) stays in install_dir on THIS host and is consumed by 07's
# local `agent wait-for`.  A resume (skipped rebuild) must keep those assets.
- name: ABI — reset local staging install_dir
  ansible.builtin.file:
    path: "{{ install_dir }}"
    state: "{{ item }}"
    mode: "0755"
  loop: "{{ ['absent', 'directory'] if not (_agent_build_container | default(false)) else ['directory'] }}"

- name: ABI — create local install_dir/openshift
  ansible.builtin.file:
    path: "{{ install_dir }}/openshift"
    state: directory
    mode: "0755"

- name: ABI — render install-config.yaml + agent-config.yaml
  ansible.builtin.template:
    src: "../templates/{{ item }}.j2"
    dest: "{{ install_dir }}/{{ item }}"
    mode: "0600"
  loop:
    - install-config.yaml
    - agent-config.yaml
  no_log: true

- name: ABI — render clone-hook live ignition fragment
  ansible.builtin.template:
    src: ../templates/agent-live-clonehook.ign.j2
    dest: "{{ install_dir }}/agent-live-clonehook.ign"
    mode: "0600"

- name: ABI — stage the ignition-merge jq script (scp'd with install_dir)
  ansible.builtin.copy:
    src: "{{ repo_root }}/ansible/files/abi-ign-merge.jq"
    dest: "{{ install_dir }}/abi-ign-merge.jq"
    mode: "0644"

# Registry config (mirror auth) + ICSP so the clone-hook step can `oc image
# extract` the version-matched coreos-installer from the release's
# machine-os-images (the FCOS coreos-installer:release fails on the RHCOS-9.6
# ISO). Rendered locally + tar'd to the mirror ECS with install_dir.
- name: ABI — compute mirror auth for the oc registry-config (clone-hook)
  ansible.builtin.set_fact:
    _abi_mirror_auth_b64: "{{ ((mirror_init_user | default('mirror-admin')) + ':' + mirror_init_password) | b64encode }}"
  no_log: true
  when: abi_clone_hook_enabled | default(false) | bool

- name: ABI — render oc registry-config + ICSP for matched coreos-installer extract
  ansible.builtin.copy:
    dest: "{{ install_dir }}/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0600"
  loop:
    - name: abi-rc.json
      content: '{"auths":{"{{ mirror_private_ip }}:8443":{"auth":"{{ _abi_mirror_auth_b64 }}"}}}'
    - name: abi-icsp.yaml
      content: |
        apiVersion: operator.openshift.io/v1alpha1
        kind: ImageContentSourcePolicy
        metadata:
          name: m
        spec:
          repositoryDigestMirrors:
          - source: quay.io/openshift-release-dev/ocp-release
            mirrors: ["{{ mirror_private_ip }}:8443/openshift/release-images"]
          - source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
            mirrors: ["{{ mirror_private_ip }}:8443/openshift/release"]
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: abi_clone_hook_enabled | default(false) | bool

- name: ABI — render CCM manifest + alibaba-ccm-config into openshift/
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ install_dir }}/openshift/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: "{{ repo_root }}/custom_manifests/01-alibaba-ccm.yaml.j2", dest: 01-alibaba-ccm.yaml }
    - { src: ../templates/alibaba-ccm-config.yaml.j2, dest: alibaba-ccm-config.yaml }

- name: ABI — render relaxed signature-policy MachineConfigs
  ansible.builtin.template:
    src: ../templates/mc-alibaba-signature-policy.yaml.j2
    dest: "{{ install_dir }}/openshift/99-alibaba-signature-policy-{{ item }}.yaml"
    mode: "0644"
  vars:
    _mc_role: "{{ item }}"
  loop: [master, worker]

- name: ABI — stage static custom manifests into openshift/
  ansible.builtin.copy:
    src: "{{ repo_root }}/custom_manifests/{{ item }}"
    dest: "{{ install_dir }}/openshift/{{ item }}"
    mode: "0644"
  loop:
    - 00-ovn-mtu.yaml
    - 03-machineconfig-providerid-master.yaml
    - 03-machineconfig-providerid-worker.yaml
    - 03-machineconfig-chrony-master.yaml
    - 03-machineconfig-chrony-worker.yaml

# ── provision build tools on the mirror ECS (data disk; has NAT egress) ───────
# Copy openshift-install + oc FROM the operator host (RHEL8) to the mirror ECS,
# rather than re-downloading on the mirror ECS.  The operator already has the
# version-matched binaries (a documented prerequisite), they are built for
# RHEL8 glibc (2.28) so they run on Alibaba Cloud Linux 3 (2.32) — avoiding the
# RHEL9-client GLIBC_2.34 break — and it removes the mirror ECS's egress
# dependency for tooling (air-gap-correct; only the release content comes from
# the mirror).  `openshift-install agent create image` shells out to `oc` to
# extract the base ISO + agent artifacts, so both binaries are required.
# ── mirror-ECS build path (default) — skipped when building in a container ────
- name: ABI — assert operator host has openshift-install + oc to ship
  when: not (_agent_build_container | default(false))
  ansible.builtin.shell: "command -v {{ item }}"
  changed_when: false
  loop:
    - openshift-install
    - oc
  loop_control:
    label: "{{ item }}"

# Ship the oc + openshift-install binaries (~500 MB) to the mirror via OSS, not
# scp-through-jump (removes the jump-sshd bottleneck).  Tar locally, ship, then
# extract on the mirror.
- name: ABI — tar oc + openshift-install on the operator host
  when: not (_agent_build_container | default(false))
  ansible.builtin.shell: >-
    tar -C "$(dirname "$(command -v openshift-install)")" -czf /tmp/abi-clients.tgz openshift-install oc
  args:
    executable: /bin/bash
  changed_when: true

- name: ABI — ship the client tarball to the mirror ECS via OSS
  when: not (_agent_build_container | default(false))
  ansible.builtin.include_tasks: ../tasks/ship_via_oss.yml
  vars:
    ship_local: /tmp/abi-clients.tgz
    ship_remote: /tmp/abi-clients.tgz
    ship_object: "abi-clients-{{ cluster_name }}.tgz"

- name: ABI — extract oc + openshift-install on the mirror ECS
  when: not (_agent_build_container | default(false))
  ansible.builtin.shell: >-
    {{ _ssh_root_mirror }} 'tar -C /usr/local/bin -xzf /tmp/abi-clients.tgz
    && chmod 0755 /usr/local/bin/openshift-install /usr/local/bin/oc
    && rm -f /tmp/abi-clients.tgz && oc version --client && openshift-install version'
  changed_when: true

- name: ABI — remove local client tarball
  when: not (_agent_build_container | default(false))
  ansible.builtin.file:
    path: /tmp/abi-clients.tgz
    state: absent

- name: ABI — ensure coreos-installer is runnable via podman on the mirror ECS
  when: not (_agent_build_container | default(false))
  ansible.builtin.shell: >-
    {{ _ssh_root_mirror }} 'podman image exists quay.io/coreos/coreos-installer:release ||
      podman pull quay.io/coreos/coreos-installer:release'
  changed_when: true
  # LIVE-VERIFY: in a strict air-gap, mirror this image via oc-mirror instead of
  # pulling from quay.io (the mirror ECS does have NAT egress, so this works).

# ── push the rendered install_dir to the mirror ECS data disk ────────────────
# Do NOT wipe the build dir: keep any already-built agent.x86_64.iso + .cache so
# a re-run after a downstream failure resumes instead of repeating the slow
# (~30 min) base-ISO extraction. Fresh configs are re-copied over the top below.
- name: ABI — ensure remote build dir on the mirror ECS data disk
  when: not (_agent_build_container | default(false))
  ansible.builtin.shell: >-
    {{ _ssh_root_mirror }} 'mkdir -p {{ _m_install_dir }} {{ _m_tmp }}'
  changed_when: true

# tar-over-ssh (not scp): RHEL8's scp defaults to the SFTP protocol and rejects
# the `dir/.` copy-contents syntax ("unexpected filename: ."). tar streams the
# whole install_dir (incl. the openshift/ subdir) through the same proxied ssh.
- name: ABI — copy rendered install_dir to the mirror ECS (tar over ssh, via jump host)
  when: not (_agent_build_container | default(false))
  ansible.builtin.shell: >-
    tar -C {{ install_dir }} -czf - . | {{ _ssh_root_mirror }} 'tar -C {{ _m_install_dir }} -xzf -'
  args:
    executable: /bin/bash
  register: _abi_scp
  retries: 3
  delay: 10
  until: _abi_scp.rc == 0
  changed_when: true

# ── build the agent ISO on the mirror ECS (release pulled from the mirror) ────
# Standard disconnected ABI: no RELEASE_IMAGE_OVERRIDE — the openshift-install
# binary (version-pinned to {{ openshift_version }}) carries its release digest,
# and install-config's imageDigestSources redirect quay.io/openshift-release-dev
# -> the mirror, so the installer pulls the right release FROM the mirror.  The
# mirror ECS trusts its own registry CA, so no extra trust flags are needed.
# ── container build path — build on THIS host in a UBI9 container, push to mirror
- name: ABI — build agent ISO in a UBI9 container (operator host) + push to mirror
  ansible.builtin.include_tasks: iso_agent_build_container.yml
  when: _agent_build_container | default(false) | bool

- name: ABI — openshift-install agent create image (on mirror ECS, data disk)
  when: not (_agent_build_container | default(false))
  ansible.builtin.shell: |
    {{ _ssh_root_mirror }} 'set -e
    export TMPDIR={{ _m_tmp }} XDG_CACHE_HOME={{ _m_build_dir }}/.cache
    # Resume ONLY a genuinely-complete prior build.  agent create image CONSUMES
    # (deletes) install-config.yaml + agent-config.yaml on success, so their
    # absence = the existing ISO matches those inputs -> safe to skip.  If the
    # freshly-rendered configs are still present next to an old ISO (e.g. a config
    # change like this run, or a half-finished build), the ISO is STALE -> rebuild
    # (regenerates the asset store too, else `agent wait-for` reads a stale store
    # and panics: asset.Asset is nil, not *agentconfig.AgentHosts).
    if [ -f {{ _m_iso }} ] && [ ! -f {{ _m_install_dir }}/install-config.yaml ] && [ ! -f {{ _m_install_dir }}/agent-config.yaml ]; then
      echo "agent ISO present + inputs consumed -> genuine resume, skipping create"; exit 0
    fi
    rm -f {{ _m_iso }} {{ _m_install_dir }}/.openshift_install_state.json
    openshift-install agent create image --dir {{ _m_install_dir }} --log-level=info'
  changed_when: true
  # LIVE-VERIFY: confirm the release override pullspec + that the installer
  # trusts the mirror CA (it is the mirror ECS's own registry, so the CA is in
  # local trust); add registries.conf/--insecure handling here if needed.

# ── inject the Alibaba clone-vdb-to-vda hook into the agent ISO live ignition ──
# ⚠ DEFAULT OFF (abi_clone_hook_enabled=false) AND SUPERSEDED.  This injection is
# fundamentally blocked: openshift-install customizes the agent ISO's kargs
# (prepends /images/assisted_installer_custom.img), so coreos-installer's
# `iso ignition embed` fails "kargs don't match at all offsets" on the agent ISO
# — confirmed with BOTH the FCOS 0.26.0 image AND the version-matched 0.24.0
# binary (extracted from machine-os-images, run inside the FCOS container for
# libssl.so.3).  Replaced by the cleaner approach: drop the masters' /dev/vdb
# install disk (cluster-stack.yaml IsAgentBased) so the assisted-installer
# installs RHCOS straight to /dev/vda — no clone needed.  Kept here, gated off,
# only for reference / a future ISO-format that allows the embed.
- name: ABI — inject clone-hook with version-matched coreos-installer (on mirror ECS)
  ansible.builtin.shell: |
    {{ _ssh_root_mirror }} 'set -e
    cd {{ _m_install_dir }}
    mkdir -p ci
    REL={{ mirror_private_ip }}:8443/openshift/release-images:{{ openshift_version }}-x86_64
    MOS=$(oc adm release info --image-for=machine-os-images --filter-by-os=linux/amd64 --insecure=true --icsp-file=abi-icsp.yaml $REL --registry-config=abi-rc.json)
    test -x ci/coreos-installer || oc image extract $MOS --path=/usr/bin/coreos-installer:ci --confirm --insecure=true --icsp-file=abi-icsp.yaml --registry-config=abi-rc.json
    chmod +x ci/coreos-installer
    podman run --rm -v {{ _m_install_dir }}/ci/coreos-installer:/ci:z -v {{ _m_install_dir }}:/d:z --entrypoint /ci quay.io/coreos/coreos-installer:release iso ignition show /d/agent.x86_64.iso > existing.ign
    jq -s -f abi-ign-merge.jq existing.ign agent-live-clonehook.ign > merged.ign
    podman run --rm -v {{ _m_install_dir }}/ci/coreos-installer:/ci:z -v {{ _m_install_dir }}:/d:z --entrypoint /ci quay.io/coreos/coreos-installer:release iso ignition embed --force --ignition-file /d/merged.ign /d/agent.x86_64.iso'
  changed_when: true
  when: abi_clone_hook_enabled | default(false) | bool

- name: ABI — WARN clone-hook injection skipped
  ansible.builtin.debug:
    msg: >-
      clone-vdb-to-vda hook NOT injected (abi_clone_hook_enabled=false). The
      agent ISO will boot without it — confirm whether the ABI minimal ISO needs
      it (node disk install on /dev/vda) before relying on this path.
  when: not (abi_clone_hook_enabled | default(false) | bool)

# ── upload to OSS (internal endpoint) + ImportImage, from the mirror ECS ──────
# aliyun on the mirror ECS authenticates via its instance RAM role (Instance
# Principal) — no AK/SK on the box.  STS creds are read from IMDS for ossutil.
# All remote aliyun commands use `|` literal blocks with each command on ONE
# line — a `>-` folded scalar preserves newlines before more-indented lines,
# which would split a single command across lines on the remote shell.
# LIVE-VERIFY: `aliyun oss` (ossutil) STS-token flag (-t) + internal endpoint
# reachability; and `{{ cloud_cli }} ecs --mode EcsRamRole --ram-role-name` inline flags.
- name: ABI — upload agent ISO to OSS via internal endpoint (mirror ECS RAM role)
  ansible.builtin.shell: |
    {{ _ssh_root_mirror }} 'set -e
    RR=$(curl -s http://100.100.100.200/latest/meta-data/ram/security-credentials/)
    C=$(curl -s http://100.100.100.200/latest/meta-data/ram/security-credentials/$RR)
    AK=$(echo "$C" | jq -r .AccessKeyId); SK=$(echo "$C" | jq -r .AccessKeySecret); TK=$(echo "$C" | jq -r .SecurityToken)
    {{ oss_cli }} cp {{ _m_iso }} oss://{{ oss_bucket }}/{{ oss_object }} -f --access-key-id="$AK" --access-key-secret="$SK" --sts-token="$TK" --region={{ region }} --endpoint={{ _oss_internal_endpoint }}'
  changed_when: true

# Air-gap: serve the minimal ISO's rootfs from an in-VPC HTTP server on the
# mirror ECS (agent-config bootArtifactsBaseURL = http://<mirror>:8080) so nodes
# fetch it in-VPC instead of from the public rhcos.mirror.openshift.com. The
# file MUST be agent.x86_64-rootfs.img (the URL openshift-install bakes into the
# kargs). A systemd unit keeps the server up across reboots / for the later
# Phase 06 boot. (OSS public-read was blocked by the bucket's public-access
# setting, so we serve it ourselves.)
- name: ABI — serve boot-artifacts rootfs over HTTP on the mirror ECS (in-VPC)
  ansible.builtin.shell: |
    {{ _ssh_root_mirror }} 'set -e
    ROOTFS=$(ls {{ _m_install_dir }}/boot-artifacts/*rootfs*.img 2>/dev/null | head -1)
    test -n "$ROOTFS" || { echo "no rootfs in boot-artifacts (bootArtifactsBaseURL not honored?)"; exit 1; }
    mkdir -p /var/lib/abi-rootfs
    cp -f "$ROOTFS" /var/lib/abi-rootfs/agent.x86_64-rootfs.img
    cat > /etc/systemd/system/abi-rootfs.service <<UNIT
    [Unit]
    Description=ABI rootfs HTTP server (in-VPC bootArtifactsBaseURL)
    After=network-online.target
    Wants=network-online.target
    [Service]
    WorkingDirectory=/var/lib/abi-rootfs
    ExecStart=/usr/bin/python3 -m http.server 8080
    Restart=always
    RestartSec=3
    [Install]
    WantedBy=multi-user.target
    UNIT
    systemctl daemon-reload
    systemctl reset-failed abi-rootfs.service 2>/dev/null || true
    systemctl enable abi-rootfs.service
    systemctl restart abi-rootfs.service
    # python http.server takes a moment to bind :8080 (esp. after a 1.2G cp), so
    # poll instead of a single eager curl.
    for i in $(seq 1 15); do
      code=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/agent.x86_64-rootfs.img -r 0-0 2>/dev/null || true)
      echo "attempt $i: local rootfs HTTP $code"
      if [ "$code" = "200" ] || [ "$code" = "206" ]; then exit 0; fi
      sleep 2
    done
    echo "rootfs HTTP never came up:"; systemctl status abi-rootfs.service --no-pager -l | tail -20; exit 1'
  changed_when: true

# ── adopt / ImportImage / poll ────────────────────────────────────────────────
# public cloud: run on the mirror ECS via its instance RAM role (no AK/SK there).
# apsara: cloud_cli (cloudcli) lives on the operator host, NOT the mirror ECS, so
# run these LOCALLY on the operator (like Phase 06 does) using cloud_env AK/SK —
# no _ssh_root_mirror, no RAM role.  (OSS upload/delete stay on the mirror, where
# apsara-oss + the instance RAM role work.)
- name: ABI — adopt existing agent image by name (mirror ECS / RAM role)
  when: (cloud_platform | default('public')) != 'apsara'
  ansible.builtin.shell: |
    {{ _ssh_root_mirror }} '{{ cloud_cli }} ecs DescribeImages --region {{ region }} --RegionId {{ region }} --ImageName openshift-{{ cluster_name }}-agent --mode EcsRamRole --ram-role-name $(curl -s http://100.100.100.200/latest/meta-data/ram/security-credentials/) | jq -r ".Images.Image[0].ImageId // empty"'
  register: _abi_img_lookup
  changed_when: false

- name: ABI — adopt existing agent image by name (apsara, local cloudcli)
  when: (cloud_platform | default('public')) == 'apsara'
  ansible.builtin.command:
    argv: ["{{ cloud_cli }}", ecs, DescribeImages, --RegionId, "{{ region }}",
           --ImageName, "openshift-{{ cluster_name }}-agent", --profile, "{{ aliyun_profile }}"]
  register: _abi_img_lookup_ap
  changed_when: false

- name: ABI — set ecs_image_id from adopted image
  ansible.builtin.set_fact:
    ecs_image_id: >-
      {{ (_abi_img_lookup.stdout | default('') | trim)
         if (cloud_platform | default('public')) != 'apsara'
         else ((_abi_img_lookup_ap.stdout | from_json).Images.Image | default([]) | map(attribute='ImageId') | list | first | default('')) }}

- name: ABI — ImportImage the agent ISO (mirror ECS / RAM role) when needed
  when:
    - (cloud_platform | default('public')) != 'apsara'
    - ecs_image_id is not defined or ecs_image_id | length == 0
  ansible.builtin.shell: |
    {{ _ssh_root_mirror }} 'RR=$(curl -s http://100.100.100.200/latest/meta-data/ram/security-credentials/)
    {{ cloud_cli }} ecs ImportImage --region {{ region }} --RegionId {{ region }} --mode EcsRamRole --ram-role-name "$RR" --ImageName openshift-{{ cluster_name }}-agent --OSType Linux --Platform CoreOS --Architecture x86_64 --BootMode UEFI --DiskDeviceMapping.1.Format RAW --DiskDeviceMapping.1.OSSBucket {{ oss_bucket }} --DiskDeviceMapping.1.OSSObject {{ oss_object }} | jq -r .ImageId'
  register: _abi_import
  changed_when: true

- name: ABI — ImportImage the agent ISO (apsara, local cloudcli) when needed
  when:
    - (cloud_platform | default('public')) == 'apsara'
    - ecs_image_id is not defined or ecs_image_id | length == 0
  ansible.builtin.command:
    argv: ["{{ cloud_cli }}", ecs, ImportImage, --RegionId, "{{ region }}",
           --ImageName, "openshift-{{ cluster_name }}-agent",
           --OSType, Linux, --Platform, CoreOS, --Architecture, x86_64, --BootMode, UEFI,
           --DiskDeviceMapping.1.Format, RAW,
           --DiskDeviceMapping.1.OSSBucket, "{{ oss_bucket }}",
           --DiskDeviceMapping.1.OSSObject, "{{ oss_object }}",
           --profile, "{{ aliyun_profile }}"]
  register: _abi_import_ap
  changed_when: true

- name: ABI — capture imported agent image id
  ansible.builtin.set_fact:
    ecs_image_id: >-
      {{ (_abi_import.stdout | default('') | trim)
         if ((cloud_platform | default('public')) != 'apsara' and (_abi_import is not skipped))
         else ((_abi_import_ap.stdout | default('{}') | from_json).ImageId | default(''))
              if ((cloud_platform | default('public')) == 'apsara' and (_abi_import_ap is not skipped))
              else ecs_image_id }}

- name: ABI — poll agent image until Available (mirror ECS / RAM role, ~15-30 min)
  when: (cloud_platform | default('public')) != 'apsara'
  ansible.builtin.shell: |
    {{ _ssh_root_mirror }} '{{ cloud_cli }} ecs DescribeImages --region {{ region }} --RegionId {{ region }} --ImageId {{ ecs_image_id }} --mode EcsRamRole --ram-role-name $(curl -s http://100.100.100.200/latest/meta-data/ram/security-credentials/) | jq -r ".Images.Image[0].Status // empty"'
  register: _abi_img_status
  changed_when: false
  retries: 90
  delay: 30
  until: _abi_img_status.stdout | trim == 'Available'

- name: ABI — poll agent image until Available (apsara, local cloudcli, ~15-30 min)
  when: (cloud_platform | default('public')) == 'apsara'
  ansible.builtin.command:
    argv: ["{{ cloud_cli }}", ecs, DescribeImages, --RegionId, "{{ region }}",
           --ImageId, "{{ ecs_image_id }}", --profile, "{{ aliyun_profile }}"]
  register: _abi_img_status_ap
  changed_when: false
  retries: 90
  delay: 30
  until: ((_abi_img_status_ap.stdout | default('{}') | from_json).Images.Image | default([]) | map(attribute='Status') | list | first | default('')) == 'Available'

# Delete the OSS agent ISO object now that the image is Available — it only
# existed to feed ImportImage (same as the AI path deletes its discovery-ISO
# object right after import).  The image keeps its own backing snapshot, which
# the teardown's ECS-image block cascade-deletes.  Keeps OSS clean (no ~133 MB
# leftover) without relying on teardown.
- name: ABI — delete the OSS agent ISO object (consumed by ImportImage)
  ansible.builtin.shell: |
    {{ _ssh_root_mirror }} 'set -e
    RR=$(curl -s http://100.100.100.200/latest/meta-data/ram/security-credentials/)
    C=$(curl -s http://100.100.100.200/latest/meta-data/ram/security-credentials/$RR)
    AK=$(echo "$C" | jq -r .AccessKeyId); SK=$(echo "$C" | jq -r .AccessKeySecret); TK=$(echo "$C" | jq -r .SecurityToken)
    {{ oss_cli }} rm oss://{{ oss_bucket }}/{{ oss_object }} --access-key-id="$AK" --access-key-secret="$SK" --sts-token="$TK" --region={{ region }} --endpoint={{ _oss_internal_endpoint }} -f'
  changed_when: true
  ignore_errors: true

# ── record outputs + tidy scratch ───────────────────────────────────────────
- name: ABI — record ISO build timestamp (24h ignition-cert window)
  ansible.builtin.set_fact:
    agent_iso_built_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

- name: ABI — persist ecs_image_id + build timestamp to state
  ansible.builtin.include_tasks: ../tasks/save_state.yml
  vars:
    new_state:
      ecs_image_id: "{{ ecs_image_id }}"
      agent_iso_built_at: "{{ agent_iso_built_at }}"

- name: ABI — free transient scratch on the mirror ECS (keep ISO + .cache)
  ansible.builtin.shell: >-
    {{ _ssh_root_mirror }} 'rm -rf {{ _m_tmp }}'
  changed_when: true
  ignore_errors: true
  # Keep agent.x86_64.iso (resume + clone-hook re-embed) and .cache (the
  # extracted coreos live ISO — source of the version-matched coreos-installer,
  # and it speeds up rebuilds). The 200 GB data disk has room.

- name: ABI — agent image ready
  ansible.builtin.debug:
    msg: >-
      Agent image imported: {{ ecs_image_id }} (built {{ agent_iso_built_at }}).
      ⚠ 24h ignition-cert window: boot instances (06) within ~24h or rebuild.
