# build_image_on_operator.yml — rebuild a Go operator/controller image ON the
# operator host and push it to the in-VPC mirror.
#
# WHY THIS SHAPE: from a China-side operator, upstream base images
# (gcr.io/distroless/static and friends) are unreachable and so is a push to a
# public registry.  These projects' Dockerfiles only copy one static binary, so
# compile here and layer that binary onto the image ALREADY IN THE MIRROR: the
# same runtime layer, no egress at all, pushed straight back to the mirror under
# a new tag.
#
# Inputs:
#   bi_name        short label used in task names and messages
#   bi_repo        path to the source checkout on the operator host
#   bi_ref         git ref to build ("" = build the working tree as-is)
#   bi_binary      path (relative to bi_repo) that `make build` produces
#   bi_mirror_repo repository path inside the mirror, e.g. samzhu/foo
#   bi_base_tag    tag to layer onto (normally the currently deployed one)
#   bi_image_path  where the binary lands in the image (default /manager).  The
#                  CCM's manifest runs /cloud-controller-manager, and a pod's
#                  `command` replaces ENTRYPOINT rather than finding the binary
#                  elsewhere, so the path has to match what the manifest asks for.
#   bi_image_user  USER line, or "" to inherit the base image's.  The controllers
#                  built here run unprivileged; the CCM reads a hostPath mount of
#                  /etc/kubernetes, so forcing 65532 on it would be a new failure
#                  mode rather than a hardening win.
#   bi_build_tag   tag to produce
#   bi_goproxy     module proxy (proxy.golang.org is blocked here)
# From state: mirror_private_ip, mirror_init_user, mirror_init_password.

- name: "{{ bi_name }} — build context path"
  ansible.builtin.set_fact:
    _bi_ctx: "/tmp/image-build-{{ bi_mirror_repo | regex_replace('[^A-Za-z0-9]', '-') }}"

- name: "{{ bi_name }} — the source repo must be present"
  ansible.builtin.stat:
    path: "{{ bi_repo }}/Makefile"
  register: _bi_repo

# Say which path was looked at.  The bare stat failure reports only
# "exists: false", which leaves the reader to re-derive bi_repo from
# playbook_dir by hand before they can even tell whether the repo is missing or
# the path is wrong.
- name: "{{ bi_name }} — where the source repo was expected"
  ansible.builtin.assert:
    that: _bi_repo.stat.exists
    fail_msg: >-
      No {{ bi_repo }}/Makefile — {{ bi_name }} expects the source checkout at
      {{ bi_repo | realpath }} (a sibling of the alibaba-openshift checkout).
      Clone it there, or point {{ bi_name }} elsewhere with bi_repo. 00a clones
      the companion repos; a repo added after 00a last ran will not be there.
    success_msg: "{{ bi_repo }}"
    quiet: true

# Fetch first.  Checking out a ref the clone already has silently builds
# whatever it happened to hold — a stale clone once produced a "successful"
# build of the previous commit, and that only surfaced later as the cluster
# rejecting a fix which had never been in the image.
- name: "{{ bi_name }} — fetch the requested ref"
  ansible.builtin.command:
    chdir: "{{ bi_repo }}"
    argv: [git, fetch, origin, "{{ bi_ref }}"]
  when: bi_ref | length > 0
  register: _bi_fetch
  changed_when: true
  failed_when: false
  retries: 3
  delay: 20
  until: _bi_fetch.rc == 0

# github.com is reachable from here only intermittently, and a failed fetch must
# not quietly build whatever the clone happens to hold — that is how a "fix" got
# deployed once without being in the image.  Stop, unless told explicitly to
# build offline, and then say which commit is being built so the choice is made
# with the facts.
- name: "{{ bi_name }} — could not reach the remote"
  ansible.builtin.assert:
    that: (_bi_fetch.rc | default(0)) == 0
    fail_msg: >-
      git fetch failed ({{ (_bi_fetch.stderr | default('')) | trim | truncate(160) }}).
      The image would otherwise be built from whatever this clone already has,
      which may not contain the change you are deploying.  Retry when the
      network is back, or pass -e {{ bi_name }}_allow_offline=true to build the
      checked-out commit deliberately — it is printed below either way.
  when:
    - bi_ref | length > 0
    - not (lookup('vars', bi_name ~ '_allow_offline', default=false) | bool)

- name: "{{ bi_name }} — check out exactly what the remote has"
  ansible.builtin.command:
    chdir: "{{ bi_repo }}"
    argv: [git, checkout, --force, "-B", "{{ bi_ref }}", "origin/{{ bi_ref }}"]
  when:
    - bi_ref | length > 0
    - (_bi_fetch.rc | default(0)) == 0
  changed_when: true

- name: "{{ bi_name }} — WARN building offline from the local clone"
  ansible.builtin.debug:
    msg: >-
      Remote unreachable and offline build requested: building whatever
      {{ bi_repo }} has checked out.  Confirm the commit printed next is the one
      you mean to deploy.
  when:
    - bi_ref | length > 0
    - (_bi_fetch.rc | default(0)) != 0

- name: "{{ bi_name }} — which commit is being built"
  ansible.builtin.command:
    chdir: "{{ bi_repo }}"
    argv: [git, log, --oneline, -1]
  register: _bi_commit
  changed_when: false

- name: "{{ bi_name }} — building"
  ansible.builtin.debug:
    msg: "building {{ _bi_commit.stdout }}"

# The binary MUST be static (CGO_ENABLED=0) and linux/amd64: it is layered onto
# a distroless base with no libc, so a dynamically linked build produces an image
# that fails at exec with nothing useful in the logs.  Projects whose own `make
# build` already guarantees that can use it (bi_build_argv); the default here
# does not rely on it.
#
# GOPROXY must be the China mirror: proxy.golang.org is blocked, and a module
# fetch that hangs looks exactly like a slow compile.
- name: "{{ bi_name }} — compile (static, linux/amd64)"
  ansible.builtin.command:
    chdir: "{{ bi_repo }}"
    argv: "{{ bi_build_argv | default(['make', 'build']) }}"
  environment:
    GOPROXY: "{{ bi_goproxy | default('https://goproxy.cn,direct') }}"
    GOSUMDB: "off"
    GOFLAGS: "-mod=mod"
    CGO_ENABLED: "0"
    GOOS: linux
    GOARCH: amd64
  changed_when: true

- name: "{{ bi_name }} — the binary must be statically linked"
  # A dynamically linked binary on a distroless base fails at exec with no
  # useful message, so catch it here rather than in a CrashLoop.
  ansible.builtin.command:
    argv: [file, "{{ bi_repo }}/{{ bi_binary }}"]
  register: _bi_file
  changed_when: false
  failed_when:
    - _bi_file.rc == 0
    - "'statically linked' not in _bi_file.stdout"
    - "'static-pie' not in _bi_file.stdout"

- name: "{{ bi_name }} — the binary must exist"
  ansible.builtin.stat:
    path: "{{ bi_repo }}/{{ bi_binary }}"
  register: _bi_bin
  failed_when: not _bi_bin.stat.exists

# The mirror registry requires auth; without it the base-image pull fails with a
# bare "unauthorized" that reads like a missing image.
- name: "{{ bi_name }} — log podman in to the mirror registry"
  ansible.builtin.command:
    argv: [podman, login, --tls-verify=false,
           "{{ mirror_private_ip }}:8443",
           -u, "{{ mirror_init_user | default('mirror-admin') }}",
           -p, "{{ mirror_init_password }}"]
  changed_when: true
  no_log: true

# Build from a context holding only the binary, NOT from the repo.  These repos
# .dockerignore bin/ (their real image is built by a multi-stage Dockerfile that
# compiles inside the builder), so a COPY from the repo context silently finds
# nothing: "no items matching glob ... (1 filtered out using .dockerignore)".
# A dedicated context sidesteps the ignore rules instead of trying to predict
# them, and does not ship the whole checkout to the build either.
- name: "{{ bi_name }} — staging directory for the build context"
  ansible.builtin.file:
    path: "{{ _bi_ctx }}"
    state: directory
    mode: "0755"

- name: "{{ bi_name }} — stage the binary into the build context"
  ansible.builtin.copy:
    src: "{{ bi_repo }}/{{ bi_binary }}"
    dest: "{{ _bi_ctx }}/manager"
    mode: "0755"
    remote_src: true

- name: "{{ bi_name }} — Dockerfile layering the new binary onto the mirrored image"
  ansible.builtin.copy:
    dest: "{{ _bi_ctx }}/Dockerfile"
    mode: "0644"
    content: |
      FROM {{ mirror_private_ip }}:8443/{{ bi_mirror_repo }}:{{ bi_base_tag }}
      COPY manager {{ bi_image_path | default('/manager') }}
      {% if (bi_image_user | default('65532:65532')) | length > 0 %}
      USER {{ bi_image_user | default('65532:65532') }}
      {% endif %}
      ENTRYPOINT ["{{ bi_image_path | default('/manager') }}"]

- name: "{{ bi_name }} — build the image"
  ansible.builtin.command:
    chdir: "{{ _bi_ctx }}"
    argv: [podman, build, --tls-verify=false,
           -t, "{{ mirror_private_ip }}:8443/{{ bi_mirror_repo }}:{{ bi_build_tag }}",
           .]
  changed_when: true

- name: "{{ bi_name }} — push it to the mirror"
  ansible.builtin.command:
    argv: [podman, push, --tls-verify=false,
           "{{ mirror_private_ip }}:8443/{{ bi_mirror_repo }}:{{ bi_build_tag }}"]
  changed_when: true

# Resolve the digest from the mirror we just pushed to.  A tag reference is
# only redirected by an ImageTagMirrorSet, which needs a running cluster with
# MCO — useless for an image that has to be pullable during bootstrap.  A digest
# reference is redirected by the install-config's ImageDigestMirrorSet, which
# exists before the first node boots.
- name: "{{ bi_name }} — resolve the pushed image digest"
  ansible.builtin.command:
    argv: [skopeo, inspect, --tls-verify=false,
           "docker://{{ mirror_private_ip }}:8443/{{ bi_mirror_repo }}:{{ bi_build_tag }}"]
  register: _bi_inspect
  changed_when: false

- name: "{{ bi_name }} — capture the digest"
  ansible.builtin.set_fact:
    bi_digest: "{{ (_bi_inspect.stdout | from_json).Digest }}"

- name: "{{ bi_name }} — built"
  ansible.builtin.debug:
    msg: |
      ✓ {{ mirror_private_ip }}:8443/{{ bi_mirror_repo }}:{{ bi_build_tag }}
        from {{ _bi_commit.stdout }}
        base {{ bi_mirror_repo }}:{{ bi_base_tag }}
        digest {{ bi_digest }}
