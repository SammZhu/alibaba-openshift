---
# Static inventory.
# - `local` is the operator's machine; runs Phases 00–04 and 99.
# - `jumphost` is populated dynamically by Phase 03 (via add_host) and used by
#   Phase 05 plus the app-layer cleanup in Phase 99. No need to edit by hand.
all:
  # Public-cloud defaults for the platform-dispatch variables the Apsara work
  # introduced.  They live in all.yml.example too, but an existing deployment
  # has its OWN group_vars/all.yml — copied before those keys existed — and does
  # not gain them on upgrade.  Without a default, phase 03 dies immediately with
  # "'cloud_cli' is undefined" on a cloud that never needed the variable.
  #
  # Deliberately here rather than in a vars_files: inventory group vars are the
  # LOWEST precedence of the two, so group_vars/all.yml still wins and an Apsara
  # deployment overrides these as it always did.  A vars_files would outrank the
  # user's own configuration — the trap that made worker_instance_type look
  # settable while only -e could change it.
  vars:
    cloud_platform: public
    cloud_cli: aliyun
    oss_cli: "aliyun oss"
    oss_cli_argv: "{{ oss_cli.split() }}"
    cloud_env: {}

    # Does this environment ship NAS at all?  Public cloud always does; an
    # Apsara deployment only does when an endpoint was discovered for it (dyz7
    # does not — every candidate hostname fails DNS).  Evaluated lazily, so it
    # picks up whatever cloud_platform/cloud_env end up as.
    #
    # One judgement, three consumers: the CSI CR (deploy the driver at all),
    # 08 (create the NAS StorageClass), 13 (run the RWX check).  Written out
    # three times it drifted — 08 kept creating a StorageClass for a service
    # that does not exist, and 13 then reported a soft FAIL whose explanation
    # sent the reader looking for missing network IDs.
    nas_available: >-
      {{ not ((cloud_platform | default('public')) == 'apsara'
              and (cloud_env.ENDPOINT_NAS | default('')) | length == 0) }}

    # Which NAS file-system type this environment can actually sell.  Not a
    # free choice: `DescribeZones` returns a Protocol list per type, and a type
    # whose list is empty is not provisionable even though it is listed.  ste2
    # offers NFS only under `Capacity` (`Performance` -> []), so it sets
    # `nas_storage_type: Capacity` in all.yml.  Public cloud keeps Performance,
    # which is what the StorageClass has always been created with.  Feeds both
    # the StorageClass `storageType` (08) and its name, so 13 finds it.
    # See docs/apsara/NAS.md.
    nas_storage_type: Performance

    # The access group CreateMountTarget needs. Public cloud pre-creates
    # DEFAULT_VPC_GROUP_NAME for every account and the driver defaults to it, so
    # nothing here changes there. An Apsara deployment may pre-create nothing —
    # ste2 had zero access groups, and every NAS provision failed with "The
    # specified AccessGroup does not exist" — so 08 creates this one, scoped to
    # the cluster VPC, and names it in the StorageClass.
    nas_access_group_name: "{{ cluster_name }}-nas"

    # ── playbooks/site-apsara.yml 的阶段表 ──────────────────────────────────
    # 专有云一键入口按这个顺序跑。放在 inventory 里而不是 site-apsara.yml 里,
    # 是因为 import_playbook 的 `when` 只能看到 inventory / extra-vars 这一层
    # 的变量——play 里 set_fact 出来的东西对它不可见。
    #
    # 顺序里有三处不显然但错了就要重装的依赖,理由写在 site-apsara.yml 的头部:
    # 08b/08c/08d 在 06 之前(08d 的 digest 要烤进 agent ISO)、08a 在 08 之前、
    # 10 在 12 之前。改这个列表前先读那段。
    apsara_phase_order:
      ['00a', '00', 'mirror-build', '03', '04', '05',
       '08b', '08c', '08d',
       '06', '06a', '06b', '07',
       '08a', '08', '10', '12',
       '13', '14', '15']
    apsara_from: '00a'          # 续跑:-e apsara_from=06
    apsara_to: '15'             # 只跑到某步:-e apsara_to=05
    apsara_skip: []             # 跳过个别步骤:-e '{"apsara_skip":["mirror-build"]}'
    # 惰性求值,和上面的 nas_available 一样——extra-vars 覆盖 from/to/skip 后
    # 这里自动跟着变。
    apsara_phases_selected: >-
      {{ apsara_phase_order[apsara_phase_order.index(apsara_from):apsara_phase_order.index(apsara_to) + 1]
         | difference(apsara_skip) }}

  hosts:
    local:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
